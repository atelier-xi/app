function makeLiveStore(db){
const build=(col,o={})=>{let q=db.collection(col);(o.where||[]).forEach(w=>{q=q.where(w[0],w[1],w[2])});if(o.orderBy)q=q.orderBy(o.orderBy[0],o.orderBy[1]);if(o.limit)q=q.limit(o.limit);return q};
return {
subCol:(col,o,cb,err)=>build(col,o).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),e=>err&&err(e)),
subDoc:(p,cb,err)=>db.doc(p).onSnapshot(s=>cb(s.exists?{...s.data(),id:s.id}:null),e=>err&&err(e)),
set:(p,d)=>db.doc(p).set(d), update:(p,d)=>db.doc(p).update(d), del:p=>db.doc(p).delete(),
add:async(col,d)=>{const r=db.collection(col).doc();await r.set(d);return r.id},
newId:col=>db.collection(col).doc().id,
};
}
function makeMemStore(seed){
const cols=new Map(),subs=new Set();
const col=c=>{if(!cols.has(c))cols.set(c,new Map());return cols.get(c)};
Object.entries(seed).forEach(([c,docs])=>docs.forEach(d=>{const o=clone(d);const id=o.id;delete o.id;col(c).set(id,o)}));
const match=(o,[f,op,v])=>{const x=o[f];switch(op){case'==':return x===v;case'!=':return x!==v;case'>=':return x>=v;case'<=':return x<=v;case'>':return x>v;case'<':return x<v;case'in':return v.includes(x);case'array-contains':return Array.isArray(x)&&x.includes(v)}return true};
const query=(c,o={})=>{let a=[...col(c).entries()].map(([id,v])=>({...clone(v),id}));(o.where||[]).forEach(w=>{a=a.filter(x=>match(x,w))});a.sort(o.orderBy?by(x=>x[o.orderBy[0]],o.orderBy[1]==='desc'?-1:1):by(x=>x.id));if(o.limit)a=a.slice(0,o.limit);return a};
const split=p=>{const i=p.lastIndexOf('/');return[p.slice(0,i),p.slice(i+1)]};
const notify=c=>subs.forEach(s=>{if(s.c===c)s.fire()});
return {
subCol(c,o,cb){const s={c,fire:()=>cb(query(c,o))};subs.add(s);setTimeout(s.fire,0);return()=>subs.delete(s)},
subDoc(p,cb){const[c,id]=split(p);const s={c,fire:()=>{const v=col(c).get(id);cb(v?{...clone(v),id}:null)}};subs.add(s);setTimeout(s.fire,0);return()=>subs.delete(s)},
async set(p,d){const[c,id]=split(p);col(c).set(id,clone(d));notify(c)},
async update(p,d){const[c,id]=split(p);const v=col(c).get(id);if(!v)throw{code:'invalid_argument',message:'Document does not exist'};col(c).set(id,deepMerge(v,clone(d)));notify(c)},
async del(p){const[c,id]=split(p);col(c).delete(id);notify(c)},
async add(c,d){const id=uid();col(c).set(id,clone(d));notify(c);return id},
newId:()=>uid(),
};
}
const Subs={m:new Map(),
on(key,fn){if(this.m.has(key))return;try{this.m.set(key,fn())}catch(e){console.error(key,e)}},
off(key){const u=this.m.get(key);if(u){try{u()}catch(e){}this.m.delete(key)}},
offPrefix(p){[...this.m.keys()].filter(k=>k.startsWith(p)).forEach(k=>this.off(k))},
offAll(){[...this.m.keys()].forEach(k=>this.off(k))}};
function dbErr(key,e){console.warn('subscription',key,e&&e.code,e&&e.message);if(e&&e.code==='revoked'){S.readOnly=true;render()}}
function subCol(key,path,opts,map){Subs.on(key,()=>Store.subCol(path,opts||{},rows=>{D[key]=map?map(rows):rows;LOADED.add(key);render()},e=>dbErr(key,e)))}
function subDoc(key,path,after){Subs.on(key,()=>Store.subDoc(path,d=>{D[key]=d;LOADED.add(key);if(after)after();render()},e=>dbErr(key,e)))}

function errMsg(e){
const c=e&&e.code;
if(c==='invalid_argument')return 'This account can’t save that. Ask the owner to check your access in Team & Settings.';
if(c==='quota_exceeded')return 'Storage is full. Delete some old records, then try again.';
if(c==='resource_exhausted')return 'Too many changes at once. Wait a moment, then try again.';
if(c==='revoked')return 'Your access to this app changed. Reload the page.';
return (e&&e.message&&!c)?e.message:'Couldn’t save. Check your connection and try again.';
}

/* modal */
function formData(form){const o={};form.querySelectorAll('[name]').forEach(i=>{if(i.type==='checkbox'){if(i.hasAttribute('data-multi')){(o[i.name]=o[i.name]||[]);if(i.checked)o[i.name].push(i.value)}else o[i.name]=i.checked}else if(i.type==='radio'){if(i.checked)o[i.name]=i.value;else if(!(i.name in o))o[i.name]=''}else if(i.type!=='file')o[i.name]=String(i.value).trim()});return o}
function modal({title,body,submit='Save',onSubmit,wide,extra='',onOpen}){
const el=document.createElement('div');el.className='scrim';
el.innerHTML=`<form class="modal ${wide?'wide':''}" novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${esc(title)}</h3><button type="button" class="x" data-close aria-label="Close">×</button></div><div class="modal-b">${body}</div><div class="modal-err" hidden></div><div class="modal-f">${extra}<span class="sp"></span><button type="button" class="btn" data-close>${onSubmit?'Cancel':'Close'}</button>${onSubmit?`<button class="btn primary" type="submit">${esc(submit)}</button>`:''}</div></form>`;
document.body.appendChild(el);
const form=el.querySelector('form'),errEl=el.querySelector('.modal-err');
const close=()=>el.remove();
el.addEventListener('mousedown',e=>{if(e.target===el)el._down=true});
el.addEventListener('click',e=>{if((e.target===el&&el._down)||e.target.closest('[data-close]'))close();el._down=false});
form.addEventListener('submit',async e=>{e.preventDefault();if(!onSubmit)return;errEl.hidden=true;const btn=form.querySelector('[type=submit]');btn.disabled=true;
try{const r=await onSubmit(formData(form),form);if(r===false){btn.disabled=false;return}if(typeof r==='string'){errEl.textContent=r;errEl.hidden=false;btn.disabled=false;return}close()}
catch(err){errEl.textContent=errMsg(err);errEl.hidden=false;btn.disabled=false}});
if(onOpen)onOpen(form,close);
setTimeout(()=>{const f=form.querySelector('.modal-b input:not([type=checkbox]):not([type=radio]):not([type=file]),.modal-b textarea,.modal-b select');if(f)f.focus()},40);
return {el,form,close};
}

function renderDrawer(){
const host=$('#drawerHost');
if(!S.drawer){host.innerHTML='';host._t=null;return}

let inner;try{inner=d.render(S.drawer)}catch(e){console.error(e);inner={head:'<h2>Error</h2>',body:esc(e.message)}}
if(!inner){closeDrawer();return}
if(!host.firstChild||host._t!==S.drawer.type+S.drawer.id){
host._t=S.drawer.type+S.drawer.id;
host.innerHTML=`<div class="drawer-scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true"><div class="drawer-h"></div><div class="drawer-b"></div></aside>`;
}
const h=$('.drawer-h',host),b=$('.drawer-b',host);
const a=document.activeElement;
if(a&&b.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','radio','button'].includes(a.type)))){host._dirty=true;return}
h.innerHTML=`<div class="grow">${inner.head}</div><button class="x" data-act="closeDrawer" aria-label="Close">×</button>`;
keepFocus(b,()=>{b.innerHTML=inner.body});
}

/* ---------- domain helpers ---------- */
const activePlayers=()=>D.players.filter(p=>p.status!=='inactive');
const playersInGroup=g=>activePlayers().filter(p=>p.group===g).sort(by(p=>p.name));
const isHeld=s=>!!s&&((s.players&&Object.values(s.players).some(Boolean))||(s.coaches&&Object.values(s.coaches).some(Boolean)));
const coachOn=(s,cid)=>!!(s&&s.coaches&&s.coaches[cid]);
const SESS_DESC={};
function slotsFor(dateStr){const w=wd(dateStr);return D.schedule.filter(s=>Number(s.day)===w)}
function sessionsForDate(dateStr){
const list=slotsFor(dateStr).map(sl=>{const id=dateStr+'_'+sl.id;return {id,date:dateStr,slotId:sl.id,group:sl.group,start:sl.start,end:sl.end,pitch:sl.pitch,coachIds:sl.coachIds||[],scheduled:true}});
D.sessions.filter(x=>x.date===dateStr&&!list.some(l=>l.id===x.id)).forEach(x=>list.push({id:x.id,date:x.date,slotId:x.slotId||null,group:x.group,start:x.start,end:x.end,pitch:x.pitch,coachIds:x.coachIds||[],scheduled:false}));
list.forEach(s=>{SESS_DESC[s.id]=s});
return list.sort(by(s=>s.start||''));
}
const sessDoc=id=>D.sessions.find(x=>x.id===id)||null;
function coachStatus(sid,cid){const c=D.confirmations[sid];const v=c&&c.coaches&&c.coaches[cid];return v==='ok'?'confirmed':v==='no'?'rejected':'pending'}
function coachMonth(cid){const rows=D.sessions.filter(s=>coachOn(s,cid)).sort(by(s=>s.date+(s.start||''))).map(s=>({s,st:coachStatus(s.id,cid)}));return {rows,total:rows.length,ok:rows.filter(r=>r.st==='confirmed').length,pending:rows.filter(r=>r.st==='pending').length,rejected:rows.filter(r=>r.st==='rejected').length}}
function pendingConfirmCount(){let n=0;D.sessions.forEach(s=>Object.keys(s.coaches||{}).forEach(cid=>{if(s.coaches[cid]&&coachStatus(s.id,cid)==='pending')n++}));return n}
function playerMonth(p){
let expected=0,attended=0,late=0,absent=0,excused=0,extra=0;const rows=[];
D.sessions.filter(s=>s.group===p.group&&isHeld(s)).sort(by(s=>s.date)).forEach(s=>{
const st=s.players&&s.players[p.id];const exp=(p.trainingDays||[]).map(Number).includes(wd(s.date));
if(exp||st)rows.push({s,st:st||null,exp});
if(exp){if(st==='E'){excused++;return}expected++;if(st==='P'||st==='L')attended++;if(st==='L')late++;if(st==='A'||!st)absent++}
else if(st==='P'||st==='L')extra++;
});
return {expected,attended,late,absent,excused,extra,rows,rate:pct(attended,expected)};
}
function overallAttendance(){let e=0,a=0;activePlayers().forEach(p=>{const m=playerMonth(p);e+=m.expected;a+=m.attended});return {e,a,rate:pct(a,e)}}
const feeOf=p=>{const b=D.billing[p.id];return b&&b.fee!=null&&b.fee!==''?Number(b.fee):Number(fin().defaultFee||0)};
const paidFor=(pid,m)=>sum(D.payments.filter(x=>x.playerId===pid&&x.month===m),x=>x.amount);
const billable=m=>D.players.filter(p=>(p.status!=='inactive'||D.payments.some(x=>x.playerId===p.id&&x.month===m))&&(!p.joined||monthOf(p.joined)<=m));
function payStatus(p,m){const fee=feeOf(p),paid=paidFor(p.id,m);if(fee<=0)return paid>0?'paid':'free';if(paid>=fee)return 'paid';if(paid>0)return 'partial';return 'unpaid'}
const PAY_PILL={paid:['ok','Paid'],partial:['warn','Partial'],unpaid:['bad','Unpaid'],free:['plain','Scholarship']};
const payPill=st=>`<span class="pill ${PAY_PILL[st][0]}">${PAY_PILL[st][1]}</span>`;
function monthFinance(m){
const bill=billable(m);

const expected=sum(bill,feeOf);
const collected=sum(D.payments.filter(x=>x.month===m),x=>x.amount);
const outstanding=sum(bill,p=>Math.max(0,feeOf(p)-paidFor(p.id,m)));
return {bill,active,expected,collected,outstanding};
}

const orderPaid=o=>sum(o.payments||[],x=>x.amount);
const orderStatus=o=>{const t=orderTotal(o),p=orderPaid(o);return p>=t&&t>0?'paid':p>0?'partial':'requested'};

const compNetIn=m=>sum(D.compPayments.filter(x=>monthOf(x.date)===m),x=>x.direction==='out'?-num(x.amount):num(x.amount));
const playerName=id=>(byId(D.players,id)||{}).name||'Former player';

function coachPill(st){return st==='confirmed'?'<span class="pill ok">Confirmed</span>':st==='rejected'?'<span class="pill bad">Rejected</span>':'<span class="pill warn">Awaiting confirmation</span>'}
const rateTone=r=>r==null?'':r>=85?'ok':r>=65?'warn':'bad';

/* per-document write queue (one write at a time per document) */
const WQ=new Map();
function queued(path,fn){if(!PLATFORM.serialWrites)return fn();const prev=WQ.get(path)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);WQ.set(path,next);next.finally(()=>{if(WQ.get(path)===next)WQ.delete(path)}).catch(()=>{});return next}
const CREATED=new Set();
function baseSession(s){return {date:s.date,month:monthOf(s.date),slotId:s.slotId||null,group:s.group,start:s.start||'',end:s.end||'',pitch:s.pitch||'',coachIds:s.coachIds||[],players:{},coaches:{},note:'',createdAt:Date.now(),createdBy:S.me.id||null}}
function writeSession(desc,patch){
const path='sessions/'+desc.id;
return queued(path,async()=>{
patch={...patch,updatedAt:Date.now(),updatedBy:S.me.id||null};
if(sessDoc(desc.id)||CREATED.has(desc.id))return W(()=>Store.update(path,patch));
CREATED.add(desc.id);try{await W(()=>Store.set(path,deepMerge(baseSession(desc),patch)))}catch(e){CREATED.delete(desc.id);throw e}
});
}
function writeConfirm(sid,cid,v){
const path='confirmations/'+sid;const desc=SESS_DESC[sid]||sessDoc(sid)||{};
return queued(path,async()=>{
if(D.confirmations[sid]||CREATED.has(path))return W(()=>Store.update(path,{coaches:{[cid]:v},...stamp()}));
CREATED.add(path);try{await W(()=>Store.set(path,{month:monthOf(desc.date||sid.slice(0,10)),coaches:{[cid]:v},...stamp()}))}catch(e){CREATED.delete(path);throw e}
});
}
function canMarkDate(dateStr){if(isMgmt())return true;if(S.role!=='coach')return false;const t=today();return dateStr<=t&&dateStr>=addDays(t,-2)}

DRAWERS.session={render(d){
const doc=sessDoc(d.id);const desc=SESS_DESC[d.id]||doc;if(!desc)return null;
const s={...desc,...(doc||{})};
const editable=canMarkDate(s.date);const mgmt=isMgmt();const me=myCoachId();
const coachIds=[...new Set([...(s.coachIds||[]),...Object.keys(s.coaches||{}).filter(k=>s.coaches[k])])];
const players=playersInGroup(s.group);const w=wd(s.date);
const exp=players.filter(p=>(p.trainingDays||[]).map(Number).includes(w));const other=players.filter(p=>!exp.includes(p));
const marks=s.players||{};
const present=players.filter(p=>['P','L'].includes(marks[p.id])).length;
const unmarkedExp=exp.filter(p=>!marks[p.id]).length;
const coachRows=coachIds.map(cid=>{const c=byId(D.coaches,cid);const ci=s.coaches&&s.coaches[cid];const st=coachStatus(s.id,cid);
let actions='';
if(ci){
if(mgmt)actions=`<button class="btn sm ${st==='confirmed'?'primary':''}" data-act="confirmCoach" data-s="${s.id}" data-c="${cid}" data-v="${st==='confirmed'?'':'ok'}">${ICON.check} ${st==='confirmed'?'Confirmed':'Confirm'}</button><button class="btn sm ${st==='rejected'?'danger':''}" data-act="confirmCoach" data-s="${s.id}" data-c="${cid}" data-v="${st==='rejected'?'':'no'}">${st==='rejected'?'Rejected':'Reject'}</button>`;
else if(cid===me&&st==='pending'&&editable)actions=`<button class="btn sm ghost" data-act="coachOut" data-s="${s.id}" data-c="${cid}">Undo check-in</button>`;
}else if(editable&&(cid===me||mgmt))actions=`<button class="btn sm ${cid===me?'primary':''}" data-act="coachIn" data-s="${s.id}" data-c="${cid}">${cid===me?'Check in':'Mark present'}</button>`;
return `<div class="att-row"><span class="av">${esc(initials(c?c.name:'?'))}</span><div class="grow"><div class="t">${esc(c?c.name:'Former coach')}${cid===me?' <span class="muted small">(you)</span>':''}</div><div class="s">${ci?`Checked in ${fmtTime(ci.at)}${ci.by&&mgmt&&!(D.members[ci.by]&&D.members[ci.by].coachId===cid)?` · added by ${esc(ci.by===S.me.id?'you':personName(ci.by))}`:''}`:'Not checked in'}</div></div>${ci?coachPill(st):''}<div class="row">${actions}</div></div>`}).join('');
const addable=D.coaches.filter(c=>!coachIds.includes(c.id));
const addCoach=editable&&(mgmt||(me&&!coachIds.includes(me)))?`<div class="att-row"><div class="grow s muted">${mgmt?'Add coach attendance':'Not on this session’s list?'}</div>${mgmt?`<select class="input" style="width:auto;height:30px" id="addCoachSel" aria-label="Coach">${addable.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn sm" data-act="coachInSel" data-s="${s.id}" ${addable.length?'':'disabled'}>Add</button>`:`<button class="btn sm primary" data-act="coachIn" data-s="${s.id}" data-c="${me}">Check me in</button>`}</div>`:'';
const row=p=>{const v=marks[p.id]||'';return `<div class="att-row">${avatar(p)}<div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${p.number?'#'+esc(p.number)+' · ':''}${esc(p.position||'')}</div></div><div class="seg" role="group" aria-label="Attendance for ${esc(p.name)}" ${editable?'':'aria-disabled="true"'}>${['P','L','A','E'].map(k=>`<button class="${k} ${v===k?'on':''}" data-act="mark" data-s="${s.id}" data-p="${p.id}" data-v="${k}" aria-pressed="${v===k}" title="${{P:'Present',L:'Late',A:'Absent',E:'Excused'}[k]}">${k}</button>`).join('')}</div></div>`};
return {
head:`<div class="eyebrow">${esc(fmtDayLong(s.date))}${s.pitch?' · '+esc(s.pitch):''}${s.slotId?'':' · Extra session'}</div><h2>${esc(s.group)} · ${esc(s.start||'')}–${esc(s.end||'')}</h2><div class="s"><span>${present} of ${players.length} present</span>${editable?'':'<span class="tag">View only</span>'}</div>`,
body:`${panel({title:'Coaches',count:coachIds.length,body:(coachRows||'<div class="att-row muted small">No coach assigned to this session.</div>')+addCoach,foot:mgmt?'Each coach check-in counts toward their monthly session total once confirmed.':'Administration or the owner confirms your check-in.'})}
${panel({title:'Players',count:players.length,actions:editable&&unmarkedExp?`<button class="btn sm" data-act="markAll" data-s="${s.id}">Mark ${unmarkedExp} present</button>`:'',body:players.length?`${exp.length?`<div class="subhead">Training today · ${exp.length}</div>${exp.map(row).join('')}`:''}${other.length?`<div class="subhead">Also in ${esc(s.group)} · not their training day</div>${other.map(row).join('')}`:''}`:`<div class="att-row muted small">No players in ${esc(s.group)} yet.</div>`,foot:'P present · L late · A absent · E excused. Tap again to clear.'})}
<div class="field"><label for="sessNote">Session note</label><textarea id="sessNote" ${editable?'':'readonly'} placeholder="Drills, weather, injuries…">${esc(s.note||'')}</textarea>${editable?`<div><button class="btn sm" data-act="saveNote" data-s="${s.id}">Save note</button></div>`:''}</div>`};
}};
Object.assign(ACT,{
mark:d=>{const desc=SESS_DESC[d.s]||sessDoc(d.s);const cur=(sessDoc(d.s)||{}).players||{};writeSession(desc,{players:{[d.p]:cur[d.p]===d.v?null:d.v}}).catch(()=>{})},

function pickPhoto(pid){
if(!PLATFORM.canPhoto())return toast(PLATFORM.photoDenied(),true);
const i=document.createElement('input');i.type='file';i.accept='image/*';
i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;toast('Uploading photo…');
try{const blob=await shrinkImage(f,PLATFORM.photoMax);const ph=await PLATFORM.uploadPhoto(blob);await W(()=>Store.update('players/'+pid,ph),'Photo saved');for(const x of D.potm.filter(x=>x.info&&x.info[pid]))await Store.update('potm/'+x.id,{info:{[pid]:ph}}).catch(()=>{})}catch(e){console.warn(e);toast(e&&e.message?e.message:'Couldn’t upload that photo.',true)}};
i.click();
}
function shrinkImage(file,max){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Couldn’t read that image.')),'image/jpeg',.86)};img.onerror=()=>rej(new Error('That file isn’t an image.'));img.src=u})}

function radarSVG(cur,prev){
const n=SKILLS.length,cx=170,cy=150,R=108;
const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/10,cy+Math.sin(a)*R*v/10]};
const poly=sc=>SKILLS.map(([k],i)=>pt(i,num(sc&&sc[k])).map(x=>x.toFixed(1)).join(',')).join(' ');
let g='';[2,4,6,8,10].forEach(l=>{g+=`<polygon points="${SKILLS.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
SKILLS.forEach((_,i)=>{const[x,y]=pt(i,10);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line-2)"/>`});
const labels=SKILLS.map(([,l],i)=>{const[x,y]=pt(i,12.4);return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1" fill="var(--muted)">${l.toUpperCase()}</text>`}).join('');
return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Skill rating chart">${g}${prev?`<polygon points="${poly(prev)}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>`:''}${cur?`<polygon points="${poly(cur)}" fill="var(--accent-soft)" stroke="var(--fg)" stroke-width="1.6"/>${SKILLS.map(([k],i)=>{const[x,y]=pt(i,num(cur[k]));return `<rect x="${(x-2.5).toFixed(1)}" y="${(y-2.5).toFixed(1)}" width="5" height="5" fill="var(--fg)"/>`}).join('')}`:''}${labels}</svg>`;
}
const avgScore=sc=>sc?Math.round(sum(SKILLS,([k])=>num(sc[k]))/SKILLS.length*10)/10:null;
function progressBody(p){
const rs=D.ratings.slice().sort(by(r=>r.date+String(r.at||''),-1));
const cur=rs[0]&&rs[0].scores,prev=rs[1]&&rs[1].scores;
const notes=D.progress.slice().sort(by(n=>n.date+String(n.at||''),-1));
return `<div class="grid g2">

/* ---------- match helpers ---------- */
function matchResult(m){if(m.status!=='ft')return null;const a=num(m.ourScore),b=num(m.theirScore);return a>b?'W':a<b?'L':'D'}
function compRecord(cid){let w=0,dr=0,l=0,gf=0,ga=0;const ms=D.matches.filter(m=>m.competitionId===cid&&m.status==='ft');ms.forEach(m=>{const a=num(m.ourScore),b=num(m.theirScore);gf+=a;ga+=b;if(a>b)w++;else if(a<b)l++;else dr++});return {p:ms.length,w,d:dr,l,gf,ga}}
function upcomingMatches(group){const t=today();return D.matches.filter(m=>(!group||matchGroup(m)===group)&&(m.status==='live'||(m.status==='scheduled'&&m.date>=t))).sort(by(m=>(m.status==='live'?'0':'1')+m.date+(m.time||'')))}
const matchGroup=m=>m.group||(byId(D.competitions,m.competitionId)||{}).group||'';
function compState(c){if(c.status)return c.status;const t=today();if(c.end&&c.end<t)return 'finished';if(c.start&&c.start>t)return 'upcoming';return 'ongoing'}
const COMP_PILL={upcoming:['','Upcoming'],ongoing:['ok','Ongoing'],finished:['plain','Finished']};
function fixtureRow(m,o={}){
const comp=byId(D.competitions,m.competitionId);const us=cfg().short;const home=m.homeAway!=='away';
const L=home?us:m.opponent,R=home?m.opponent:us;
const played=m.status==='ft'||m.status==='live';
const score=played?(home?`${num(m.ourScore)} – ${num(m.theirScore)}`:`${num(m.theirScore)} – ${num(m.ourScore)}`):m.status==='postponed'?'Postponed':esc(m.time||'TBC');
const res=matchResult(m);
return `<div class="fixture ${o.click?'click':''}" ${o.click?`data-act="editMatch" data-id="${m.id}"`:''}>
<div class="when">${esc(fmtDay(m.date))}${o.comp!==false&&comp?`<br>${esc(comp.name)}`:''}${m.round?`<br>${esc(m.round)}`:''}</div>
<div class="team home" ${home?'style="font-weight:700"':''}>${esc(L)}</div>
<div class="score ${played?'':'pending'}">${score}</div>
<div class="team" ${!home?'style="font-weight:700"':''}>${esc(R)}</div>
<div class="after">${m.status==='live'?'<span class="pill live">Live</span>':res?`<span class="res ${res}" title="${{W:'Win',D:'Draw',L:'Loss'}[res]}">${res}</span>`:`<span class="tag">${esc(matchGroup(m))}</span>`}</div>${o.note&&m.notes?`<div class="fnote">${esc(m.notes)}</div>`:''}</div>`;
}

if(S.ui.compId&&byId(D.competitions,S.ui.compId))return compDetail(byId(D.competitions,S.ui.compId));

const list=D.competitions.filter(c=>f==='all'||compState(c)===f).sort(by(c=>({ongoing:0,upcoming:1,finished:2}[compState(c)])+(c.start||'')));
const m=S.month;const inM=sum(D.compPayments.filter(x=>monthOf(x.date)===m&&x.direction!=='out'),x=>x.amount),outM=sum(D.compPayments.filter(x=>monthOf(x.date)===m&&x.direction==='out'),x=>x.amount);

`<div class="kpis">${kpi('Played',sum(allRec,r=>r.p),'Matches with a result')}${kpi('Record',`${sum(allRec,r=>r.w)}<small>W</small> ${sum(allRec,r=>r.d)}<small>D</small> ${sum(allRec,r=>r.l)}<small>L</small>`,`Goals ${sum(allRec,r=>r.gf)}–${sum(allRec,r=>r.ga)}`)}${kpi('Money in',money(inM),fmtMonth(m))}${kpi('Money out',money(outM),`Net ${money(inM-outM)}`)}</div>

${list.length?`<div class="comps">${list.map(c=>{const r=compRecord(c.id);const st=compState(c);const net=sum(D.compPayments.filter(x=>x.competitionId===c.id),x=>x.direction==='out'?-num(x.amount):num(x.amount));const nx=upcomingMatches().find(x=>x.competitionId===c.id);
return `<button class="comp" data-act="openComp" data-id="${c.id}"><div class="between"><span class="tag">${esc(c.kind||'Competition')} · ${esc(c.group||'')}</span><span class="pill ${COMP_PILL[st][0]}">${COMP_PILL[st][1]}</span></div><div class="nm">${esc(c.name)}</div><div class="muted small">${esc([c.location,c.start?fmtDate(c.start)+(c.end?' – '+fmtDateY(c.end):''):''].filter(Boolean).join(' · '))}</div>
<div class="rec"><span><b>${r.w}</b>Won</span><span><b>${r.d}</b>Drawn</span><span><b>${r.l}</b>Lost</span><span><b>${r.gf}:${r.ga}</b>Goals</span></div>
<div class="between small"><span class="muted">${c.placement?`Result · <b style="color:var(--fg)">${esc(c.placement)}</b>`:nx?`Next · ${esc(fmtDate(nx.date))} vs ${esc(nx.opponent)}`:''}</span><span class="mono ${net<0?'':'muted'}">${net?money(net):''}</span></div></button>`}).join('')}</div>`:`<div class="panel">${empty('No competitions',D.competitions.length?'Nothing matches this filter.':'Add a league or tournament to log fixtures, results and payments. Parents follow fixtures in the Match centre.',D.competitions.length?'':`<button class="btn primary" data-act="editComp">${ICON.plus} New competition</button>`)}</div>`}`;
};
function compDetail(c){
const t=tabs('cdTab',[['fixtures','Fixtures & results',D.matches.filter(m=>m.competitionId===c.id).length],['payments','Payments'],['info','Details']],'fixtures');

payOrder:d=>{const o=byId(D.apparelOrders,d.id);if(!o)return;const bal=Math.max(0,orderTotal(o)-orderPaid(o));

toast(`Kit payment recorded · ${money(num(f.amount))}`,false,{label:'Undo',fn:()=>{const c=byId(D.apparelOrders,d.id);if(!c)return;queued('apparelOrders/'+d.id,()=>W(()=>Store.update('apparelOrders/'+d.id,{payments:(c.payments||[]).filter(x=>x.at!==at)}),'Payment removed')).catch(()=>{})}})}});

/* ---------- SCHEDULE ---------- */
PAGE_RENDER.schedule=()=>{
const g=S.ui.sg||'';const mg=isMgmt();const tw=wd(today());
const slots=D.schedule.filter(s=>!g||s.group===g);
const cols=WEEK.map(d=>{const list=slots.filter(s=>Number(s.day)===d).sort(by(s=>s.start||''));
return `<div class="bcol ${d===tw?'today':''} ${list.length?'':'empty-day'}"><div class="bcol-h"><b>${DAY_SHORT[d]}</b><span>${list.length?list.length+' session'+(list.length>1?'s':''):'Rest'}</span></div><div class="bcol-b">${list.map(s=>{const inner=`<span class="tm">${esc(s.start)} – ${esc(s.end)}</span><span class="g">${esc(s.group)}</span><span class="p">${esc(s.pitch||'')}</span>${isStaffR(S.role)&&(s.coachIds||[]).length?`<span class="p">${(s.coachIds||[]).map(coachName).map(esc).join(', ')}</span>`:''}`;return mg?`<button class="slot" data-act="editSlot" data-id="${s.id}">${inner}</button>`:`<div class="slot">${inner}</div>`}).join('')}</div></div>`}).join('');
const hours=sum(slots,s=>{const[a,b]=[s.start,s.end].map(x=>{const[h,m]=String(x||'0:0').split(':').map(Number);return h*60+(m||0)});return Math.max(0,b-a)/60});
return titleBlock({sec:'Daily · Training schedule',title:'Training schedule',month:false,note:isStaffR(S.role)?'The weekly plan. Each slot becomes a session on the Attendance page on its day.':'Weekly training times for every age group.',cells:[['Sessions / week',slots.length],['Hours',Math.round(hours*10)/10]]})+
`<div class="toolbar">${chips('sg',groupOpts(true),'','Group')}${mg?`<button class="btn primary" data-act="editSlot">${ICON.plus} Add training slot</button>`:''}</div>
${D.schedule.length?`<div class="board-wrap"><div class="board">${cols}</div></div>`:`<div class="panel">${empty('No schedule yet',mg?'Add the weekly training slots for each group. Attendance sessions are created from them.':'The academy hasn’t published the training schedule yet.',mg?`<button class="btn primary" data-act="editSlot">${ICON.plus} Add training slot</button>`:'')}</div>`}`;
};
ACT.editSlot=d=>{const s=d.id?byId(D.schedule,d.id):{day:1,start:'17:00',end:'18:30',group:cfg().groups[0],pitch:cfg().pitches[0],coachIds:[]};
modal({title:d.id?'Edit training slot':'Add training slot',body:`${fld('Day',radios('day',WEEK.map(x=>[x,DAY_SHORT[x]]),s.day))}<div class="f3">${fld('Group',sel('group',cfg().groups,s.group))}${fld('Start',inp('start',s.start,'time'))}${fld('End',inp('end',s.end,'time'))}</div>${fld('Pitch',sel('pitch',cfg().pitches,s.pitch))}${fld('Coaches',`<div class="cpick">${D.coaches.map(c=>`<input type="checkbox" data-multi name="coachIds" id="f_sc_${c.id}" value="${c.id}" ${(s.coachIds||[]).includes(c.id)?'checked':''}><label for="f_sc_${c.id}">${esc(c.name)} <span class="muted small">${esc(c.title||'')}</span></label>`).join('')||'<span class="muted small" style="padding:6px">Add coaches first from the Coaches page.</span>'}</div>`)}`,
extra:d.id?`<button type="button" class="btn danger" data-act="delSlot" data-id="${d.id}">Delete</button>`:'',
onSubmit:async f=>{if(!f.start||!f.end)return 'Set start and end times.';if(f.end<=f.start)return 'End time must be after the start.';const o={day:Number(f.day),group:f.group,start:f.start,end:f.end,pitch:f.pitch,coachIds:f.coachIds||[],updatedAt:Date.now()};if(d.id)await W(()=>Store.update('schedule/'+d.id,o),'Slot saved');else await W(()=>Store.add('schedule',o),'Slot added')}});
};
ACT.delSlot=d=>{$$('.scrim').pop()?.remove();confirmBox('Delete training slot','Delete this weekly slot? Sessions already recorded from it stay in attendance.','Delete',()=>W(()=>Store.del('schedule/'+d.id),'Slot deleted'))};

/* ---------- PLAYER OF THE MONTH ---------- */
const potmDoc=m=>D.potm.find(x=>x.id===m)||null;
const currentPotm=()=>potmDoc(monthOf(today()));
function myVote(m){const v=D.potmVotes.find(x=>x.id===S.me.id);return v&&v.votes?v.votes[m]||null:null}
function tally(m){const t={};D.potmVotes.forEach(v=>{const p=v.votes&&v.votes[m];if(p)t[p]=(t[p]||0)+1});return t}
function pPhoto(p,cls){const u=photoUrl(p);return u?`<img src="${esc(u)}" alt="${esc(p.name)}" loading="lazy">`:`<span class="mono-l">${esc(initials(p.name))}</span>`}
function potmPlayer(id){const p=byId(D.players,id);if(p)return p;const d=D.potm.find(x=>x.info&&x.info[id]);if(d)return {id,...d.info[id]};return {id,name:(D.potm.find(x=>x.winner===id)||{}).winnerName||'Player',group:''}}
const potmInfo=ids=>Object.fromEntries(ids.map(id=>{const p=byId(D.players,id)||{};return [id,{name:p.name||'',group:p.group||'',position:p.position||'',number:p.number||'',photo:p.photo||null,photoUrl:p.photoUrl||null,photoData:p.photoData||null}]}));
function potmMini(pm){
const t=tally(pm.id);const lead=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];
if(pm.status==='closed'&&pm.winner)return potmWinnerMini(pm);
return panel({title:'Player of the month',count:fmtMonthName(pm.id),actions:`<button class="btn sm" data-act="go" data-r="potm">${myVote(pm.id)?'View':'Vote'}</button>`,body:`<div class="list"><div class="li"><div class="grow"><div class="t">Voting open · ${(pm.nominees||[]).length} nominees</div><div class="s">${sum(Object.values(t))} vote${sum(Object.values(t))===1?'':'s'} so far${isMgmt()&&lead?` · leading: ${esc(potmPlayer(lead[0]).name)}`:''}</div></div></div></div>`});
}
function potmWinnerMini(pm){const p=potmPlayer(pm.winner);return `<section class="panel"><div class="panel-h"><h2>Player of the month<span class="c">${esc(fmtMonth(pm.id))}</span></h2></div><div class="winner-band" style="border:0"><div class="ph" style="width:84px">${pPhoto(p)}</div><div style="min-width:0"><div class="eyebrow">${esc(p.group||'')}${p.position?' · '+esc(p.position):''}</div><div class="nm" style="font-size:26px;margin-top:6px">${esc(p.name)}</div>${pm.citation?`<p class="muted small" style="margin:6px 0 0">${esc(pm.citation)}</p>`:''}</div></div></section>`}
PAGE_RENDER.potm=()=>{
const m=S.month;const pm=potmDoc(m);const staff=isStaffR(S.role);const mg=isMgmt();
const hall=D.potm.filter(x=>x.status==='closed'&&x.winner).sort(by(x=>x.id,-1));
let body='';
if(!pm){
body=`<div class="panel">${empty('Voting not open',mg?`Pick the nominees for ${esc(fmtMonth(m))} to open voting. Coaches, administration and the owner each get one vote.`:`Nominees for ${esc(fmtMonth(m))} haven’t been announced yet.`,mg?`<button class="btn primary" data-act="potmNominate">${ICON.plus} Choose nominees</button>`:'')}</div>`;
}else{
const t=tally(m);const total=sum(Object.values(t));const max=Math.max(1,...Object.values(t));const mine=myVote(m);const closed=pm.status==='closed';
const showTally=mg||closed;
const noms=(pm.nominees||[]).map(potmPlayer).sort(by(p=>closed?-(t[p.id]||0):0));
if(closed&&pm.winner){const w=potmPlayer(pm.winner);body+=`<section class="winner-band"><div class="ph">${pPhoto(w)}</div><div style="min-width:0;display:grid;gap:8px"><span class="pill solid plain">Player of the month · ${esc(fmtMonth(m))}</span><div class="nm">${esc(w.name)}</div><div class="muted">${esc(w.group||'')}${w.position?' · '+esc(w.position):''}${w.number?' · #'+esc(w.number):''}${showTally?` · ${t[w.id]||0} of ${total} votes`:''}</div>${pm.citation?`<p style="margin:0;max-width:60ch;color:var(--fg-2)">${esc(pm.citation)}</p>`:''}</div></section>`}
body+=`<div class="toolbar"><span class="muted small">${closed?'Voting closed.':staff?(mine?`You voted for ${esc(potmPlayer(mine).name)}. You can change it until voting closes.`:'Tap a player to cast your vote. One vote per staff member.'):'Staff are voting. The winner is announced here at the end of the month.'}${!closed&&mg?` · ${total} vote${total===1?'':'s'} cast`:''}</span>${mg?`<div class="row">${closed?`<button class="btn" data-act="potmReopen">Reopen voting</button>`:`<button class="btn" data-act="potmNominate">Edit nominees</button><button class="btn primary" data-act="potmClose" ${total?'':'disabled'}>Close & announce winner</button>`}</div>`:''}</div>
<div class="potm-grid">${noms.map(p=>{const v=t[p.id]||0;return `<article class="pcard ${!closed&&mine===p.id?'voted':''} ${closed&&pm.winner===p.id?'winner':''}"><div class="ph">${pPhoto(p)}${p.number?`<span class="no">${esc(p.number)}</span>`:''}${mg&&PLATFORM.canPhoto()&&D.players.some(x=>x.id===p.id)?`<button class="btn sm addph" data-act="photo" data-id="${p.id}" aria-label="Add photo for ${esc(p.name)}">${ICON.cam}</button>`:''}</div><div class="bd"><div class="nm">${esc(p.name)}</div><div class="s">${esc(p.group||'')}${p.position?' · '+esc(p.position):''}</div>${showTally?`<div class="tally"><span class="bar"><i style="--p:${v/max}"></i></span><span>${v}</span></div>`:''}${staff&&!closed?`<button class="btn sm ${mine===p.id?'primary':''}" data-act="potmVote" data-p="${p.id}">${mine===p.id?ICON.check+' Your vote':'Vote'}</button>`:''}</div></article>`}).join('')}</div>`;
}
body+=hall.length?panel({title:'Past winners',count:hall.length,body:`<div class="hall">${hall.map(h=>{const p=potmPlayer(h.winner);return `<div>${avatar(p)}<div style="min-width:0"><div class="t" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div><div class="mono small muted">${esc(fmtMonthShort(h.id))}</div></div></div>`}).join('')}</div>`}):'';
return titleBlock({sec:'Squad · Player of the month',title:'Player of the month',note:mg&&PLATFORM.canPhoto()?'Add player photos from each card or from the player’s profile.':'',cells:[['Status',pm?(pm.status==='closed'?'Closed':'Voting'):'Not open']]})+body;
};
Object.assign(ACT,{
potmNominate:()=>{const m=S.month;const pm=potmDoc(m);const cur=new Set(pm?pm.nominees||[]:[]);
const groups=cfg().groups.map(g=>[g,playersInGroup(g)]).filter(([,ps])=>ps.length);
modal({title:'Nominees · '+fmtMonthName(m),wide:true,body:`<p class="muted small" style="margin:0">Choose two to eight players. Photos show on the voting cards when added.</p>${groups.map(([g,ps])=>fld(g,`<div class="cpick" style="max-height:none">${ps.map(p=>`<input type="checkbox" data-multi name="nominees" id="f_n_${p.id}" value="${p.id}" ${cur.has(p.id)?'checked':''}><label for="f_n_${p.id}">${esc(p.name)} <span class="muted small">${esc(p.position||'')}</span></label>`).join('')}</div>`)).join('')||'<p class="muted">Add players first.</p>'}`,
submit:pm?'Save nominees':'Open voting',onSubmit:async f=>{const n=f.nominees||[];if(n.length<2)return 'Pick at least two players.';if(n.length>8)return 'Pick eight players at most.';
if(pm)await W(()=>Store.update('potm/'+m,{nominees:n,info:potmInfo(n),updatedAt:Date.now()}),'Nominees saved');else await W(()=>Store.set('potm/'+m,{month:m,nominees:n,info:potmInfo(n),status:'open',winner:null,citation:'',openedAt:Date.now(),by:S.me.id||null}),'Voting is open')}});
},
potmVote:d=>{if(!S.me.id)return toast('Sign in to vote.',true);const m=S.month;const cur=D.potmVotes.find(x=>x.id===S.me.id);const votes={...((cur&&cur.votes)||{}),[m]:d.p};
queued('potmVotes/'+S.me.id,()=>W(()=>Store.set('potmVotes/'+S.me.id,{votes,at:Date.now()}),'Vote saved')).catch(()=>{})},
potmClose:()=>{const m=S.month;const pm=potmDoc(m);const t=tally(m);const noms=(pm.nominees||[]).slice().sort((a,b)=>(t[b]||0)-(t[a]||0));
modal({title:'Announce winner',body:`${fld('Winner',`<div class="cpick">${noms.map((id,i)=>`<input type="radio" name="winner" id="f_w_${id}" value="${id}" ${i===0?'checked':''}><label for="f_w_${id}">${esc(potmPlayer(id).name)} <span class="muted small">· ${t[id]||0} vote${(t[id]||0)===1?'':'s'}</span></label>`).join('')}</div>`,'The most-voted player is selected. Change it to break a tie.')}${fld('Citation (optional)',`<textarea name="citation" id="f_citation" placeholder="Why they earned it — shown to parents">${esc(pm.citation||'')}</textarea>`)}`,
submit:'Announce',onSubmit:async f=>{if(!f.winner)return 'Choose the winner.';const p=byId(D.players,f.winner);await W(()=>Store.update('potm/'+m,{status:'closed',winner:f.winner,winnerName:p?p.name:'',citation:f.citation,closedAt:Date.now()}),'Winner announced')}});
},
potmReopen:()=>W(()=>Store.update('potm/'+S.month,{status:'open',winner:null}),'Voting reopened').catch(()=>{}),
});

`<div class="toolbar">${staff?chips('anf',[['all','All'],['announcements','Everyone'],['staffAnnouncements','Staff only']],'all','Audience'):'<span></span>'}${mg?`<button class="btn primary" data-act="editAnn">${ICON.plus} New announcement</button>`:''}</div>

onSubmit:async f=>{if(!f.title)return 'Add a title.';const o={title:f.title,body:f.body,date:f.date||today(),pinned:!!f.pinned,...stamp()};const c=d.c||f.aud||'announcements';if(d.id)await W(()=>Store.update(c+'/'+d.id,o),'Saved');else await W(()=>Store.add(c,o),'Posted')}});

/* ---------- TASKS ---------- */
const taskDone=t=>!!(D.taskStatus[t.id]&&D.taskStatus[t.id].done);
function myOpenTasks(){return D.tasks.filter(t=>t.assignee===S.me.id&&!taskDone(t))}
PAGE_RENDER.tasks=()=>{
const owner=S.role==='owner';const f=S.ui.tkf||'open';const t0=today();
let list=owner?D.tasks.slice():D.tasks.filter(t=>t.assignee===S.me.id);
const who=S.ui.tka||'';if(owner&&who)list=list.filter(t=>t.assignee===who);
list=list.filter(t=>f==='all'||(f==='open'?!taskDone(t):taskDone(t))).sort(by(t=>(taskDone(t)?'1':'0')+(t.due||'9999')));

/* ============================================================
ATELIER XI — Money in & out: expenses, coach pay, profit
============================================================ */
const EXP_CATS=['Coach pay','Pitch rental','Equipment','Kit stock','Transport','Marketing','Utilities','Other'];
const coachRate=cid=>(((D.finance||{}).coachRates)||{})[cid]||null;
const expIn=m=>D.expenses.filter(x=>x.month===m);
const compInM=m=>sum(D.compPayments.filter(x=>monthOf(x.date)===m&&x.direction!=='out'),x=>x.amount);
const compOutM=m=>sum(D.compPayments.filter(x=>monthOf(x.date)===m&&x.direction==='out'),x=>x.amount);
const tuitionIn=m=>sum(D.payments.filter(x=>x.month===m),x=>x.amount);
function monthMoney(m){
const ins=[['Tuition',tuitionIn(m)],['Kits & apparel',apparelCollectedIn(m)],['Competitions',compInM(m)]];
const ex=expIn(m);const known=new Set(EXP_CATS);
const outs=EXP_CATS.map(c=>[c,sum(ex.filter(x=>x.category===c||(c==='Other'&&!known.has(x.category))),x=>x.amount)]);
outs.push(['Competitions',compOutM(m)]);
const tin=sum(ins,x=>x[1]),tout=sum(outs,x=>x[1]);
return {ins,outs,tin,tout,profit:tin-tout};
}
function coachPayRows(m){
return D.coaches.map(c=>{const r=coachRate(c.id);const cm=coachMonth(c.id);
const due=!r?0:r.type==='monthly'?num(r.rate):cm.ok*num(r.rate);
const paid=sum(D.expenses.filter(x=>x.month===m&&x.category==='Coach pay'&&x.coachId===c.id),x=>x.amount);
return {c,r,sessions:cm.ok,pending:cm.pending,due,paid,bal:Math.max(0,due-paid)}}).sort(by(x=>x.c.name));
}
const coachPayDue=m=>sum(coachPayRows(m),x=>x.bal);
function missingRecurring(m){
const prev=addMonths(m,-1);const cur=expIn(m);
return D.expenses.filter(x=>x.month===prev&&x.recurring&&!cur.some(y=>y.category===x.category&&(y.label||'')===(x.label||'')&&(y.coachId||'')===(x.coachId||'')));
}
const fmtK=v=>{const c=fin().currency||'$';return v>=10000?c+Math.round(v/1000)+'k':c+Math.round(v).toLocaleString('en-US')};
async function saveFinance(patch,msg){const cur={...(D.finance||{})};delete cur.id;await W(()=>Store.set('config/finance',{...DEFAULT_FIN,...cur,...patch,updatedAt:Date.now()}),msg)}

</div>
<section class="panel"><div class="li" style="border:0;padding:18px 18px"><div class="grow"><div class="eyebrow">Profit · ${esc(fmtMonth(m))}</div><div class="muted small" style="margin-top:6px">Money in ${money(M.tin)} − money out ${money(M.tout)}</div></div><b style="font:600 clamp(32px,5vw,44px)/1 var(--f-display);color:${M.profit<0?'var(--bad)':'var(--fg)'};white-space:nowrap">${money(M.profit)}</b></div></section>`;
}
function moneyExpenses(m){
const cat=S.ui.exCat||'';const all=expIn(m);

<div class="toolbar">${chips('exCat',[['','All'],...cats.map(c=>[c,c])],'','Category')}<div class="row">${list.length?`<button class="btn" data-act="exportExpenses">${ICON.down} CSV</button>`:''}<button class="btn primary" data-act="editExpense">${ICON.plus} Add expense</button></div></div>
${panel({title:'Expenses',count:fmtMonth(m),body:list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Paid on</th><th>Category</th><th>Description</th><th>Method</th><th class="r">Amount</th><th></th></tr></thead><tbody>${list.map(x=>`<tr class="click" data-act="editExpense" data-id="${x.id}"><td class="nowrap">${esc(fmtDate(x.date))}</td><td><span class="tag">${esc(x.category)}</span></td><td><div class="strong">${esc(x.label||x.category)}${x.recurring?' <span class="muted small">· monthly</span>':''}</div>${x.note?`<div class="muted small">${esc(x.note)}</div>`:''}</td><td class="muted small">${esc(x.method||'')}</td><td class="r strong">${money(x.amount)}</td><td class="r"><button class="btn sm ghost" data-act="editExpense" data-id="${x.id}">${ICON.edit} Edit</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Total</td><td class="r">${money(sum(list,x=>x.amount))}</td><td></td></tr></tfoot></table></div>`:empty('No expenses',`Nothing recorded for ${esc(fmtMonth(m))}${cat?' in this category':''}.`,`<button class="btn primary" data-act="editExpense">${ICON.plus} Add expense</button>`),foot:list.length?'Tap an expense to change or delete it. Tick “Regular monthly cost” for rent and salaries so the app reminds you next month.':''})}`;

function moneyCoachPay(m){
const rows=coachPayRows(m);const anyRate=rows.some(r=>r.r);

return `<tr><td><div class="cell-name"><span class="av">${esc(initials(r.c.name))}</span><div><div class="t">${esc(r.c.name)}</div><div class="s">${esc(r.c.title||'')}</div></div></div></td><td class="nowrap">${r.r?(r.r.type==='monthly'?`${money(r.r.rate)} / month`:`${money(r.r.rate)} / session`):'<span class="faint">—</span>'} <button class="btn sm ghost" data-act="setRate" data-c="${r.c.id}">${r.r?'Change':'Set rate'}</button></td><td class="r">${r.sessions}${r.pending?` <span class="muted small">+${r.pending} waiting</span>`:''}</td><td class="r strong">${r.r?money(r.due):'<span class="faint">—</span>'}</td><td class="r">${r.paid?money(r.paid):'<span class="faint">—</span>'}</td><td>${st}</td><td class="r">${r.bal>0?`<button class="btn sm primary" data-act="payCoach" data-c="${r.c.id}">Pay ${money(r.bal)}</button>`:''}</td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="3">Total</td><td class="r">${money(sum(rows,r=>r.due))}</td><td class="r">${money(sum(rows,r=>r.paid))}</td><td colspan="2"></td></tr></tfoot></table></div>`:empty('No coaches','Add coaches on the Coaches page first.'),foot:anyRate?'Paying a coach records it as a Coach pay expense for this month, so it shows in money out.':'Set each coach’s rate to see what you owe them every month.'})}`;

function moneyYear(m){
const months=Array.from({length:12},(_,i)=>addMonths(m,i-11));

const totIn=sum(rows,r=>r.tin),totOut=sum(rows,r=>r.tout);

function yearChart(rows){
const W=720,H=250,L=58,R=8,T=14,B=34,pw=W-L-R,ph=H-T-B;
const max=Math.max(1,...rows.map(r=>Math.max(r.tin,r.tout)));
const niceStep=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
const step=niceStep(max/4),top=Math.ceil(max/step)*step;
const y=v=>T+ph-(v/top)*ph;const gw=pw/rows.length,bw=Math.min(16,gw/2-4);
const bar=(x,v,cls)=>{if(v<=0)return '';const h=Math.max(2,ph*v/top),yy=T+ph-h,r=Math.min(4,h/2,bw/2);return `<path class="${cls}" d="M${x},${T+ph} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${T+ph} Z"/>`};
let grid='';for(let v=0;v<=top+1e-9;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'yc-base':'yc-grid'}"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" class="yc-lbl">${esc(fmtK(v))}</text>`}
let bars='',labels='',hits='';
rows.forEach((r,i)=>{const gx=L+i*gw,cx=gx+gw/2;
hits+=`<rect class="yc-hit" data-yc="${i}" x="${gx}" y="${T}" width="${gw}" height="${ph+B-4}"/>`;
bars+=bar(cx-bw-1,r.tin,'yc-in')+bar(cx+1,r.tout,'yc-out');
const d=parseD(r.m+'-01');const mo=d.toLocaleDateString('en-GB',{month:'short'});
labels+=`<text x="${cx}" y="${T+ph+16}" text-anchor="middle" class="yc-lbl">${esc(mo)}</text>${i===0||d.getMonth()===0?`<text x="${cx}" y="${T+ph+28}" text-anchor="middle" class="yc-lbl yc-yr">${d.getFullYear()}</text>`:''}`});
return `<div class="yc-legend" aria-hidden="true"><span><i class="yc-sw yc-in"></i>Money in</span><span><i class="yc-sw yc-out"></i>Money out</span></div>
<div class="yc-wrap"><svg viewBox="0 0 ${W} ${H}" class="yc" role="img" aria-label="Money in and money out for each of the last 12 months. The table below lists the same figures.">${grid}${hits}${bars}${labels}</svg><div class="yc-tip" hidden></div></div>`;
}

/* ---------- Daily report ---------- */
function ensureReportSubs(date){
if(S._repKey===date&&Subs.m.has('repPayments')&&Subs.m.has('repExpenses'))return;
Subs.off('repPayments');Subs.off('repExpenses');D.repPayments=[];D.repExpenses=[];LOADED.delete('repPayments');LOADED.delete('repExpenses');
S._repKey=date;
subCol('repPayments','payments',{where:[['date','==',date]]});
subCol('repExpenses','expenses',{where:[['date','==',date]]});
}
function dayData(date){
const ins=[],outs=[];
D.repPayments.filter(x=>x.date===date).forEach(x=>{const p=byId(D.players,x.playerId);ins.push({cat:'Tuition',who:playerName(x.playerId),what:`${fmtMonth(x.month)} fee${p?' · '+p.group:''}`,note:x.note||'',method:x.method||'Cash',by:x.by,at:x.at,amount:num(x.amount),act:'editPay',id:x.id})});
D.apparelOrders.forEach(o=>(o.payments||[]).forEach(pp=>{if(pp.date===date)ins.push({cat:'Kits & apparel',who:buyerName(o),what:`${itemName(o.itemId)}${o.size?' · '+o.size:''} × ${num(o.qty)}`,note:'',method:pp.method||'Cash',by:o.by,at:pp.at||o.at,amount:num(pp.amount)})}));
D.compPayments.filter(x=>x.date===date).forEach(x=>{const c=byId(D.competitions,x.competitionId);const row={cat:'Competitions',who:x.playerId?playerName(x.playerId):'',what:`${x.label||''}${c?' · '+c.name:''}`,note:'',method:x.method||'Cash',by:x.by,at:x.at,amount:num(x.amount)};(x.direction==='out'?outs:ins).push(row)});
D.repExpenses.filter(x=>x.date===date).forEach(x=>outs.push({cat:EXP_CATS.includes(x.category)?x.category:'Other',who:x.coachId?coachName(x.coachId):'',what:x.label||x.category,note:x.note||'',method:x.method||'Cash',by:x.by,at:x.at,amount:num(x.amount),act:'editExpense',id:x.id}));
const group=(rows,order)=>order.map(c=>{const rs=rows.filter(r=>r.cat===c).sort(by(r=>r.at||0));return {cat:c,rows:rs,total:sum(rs,r=>r.amount)}}).filter(g=>g.rows.length);
const all=[...ins,...outs];const mo=mm=>{const i=METHODS.indexOf(mm);return i<0?99:i};
const byMethod=[...new Set(all.map(r=>r.method))].sort((a,b)=>mo(a)-mo(b)).map(mm=>({method:mm,in:sum(ins.filter(r=>r.method===mm),r=>r.amount),out:sum(outs.filter(r=>r.method===mm),r=>r.amount)}));
const tin=sum(ins,r=>r.amount),tout=sum(outs,r=>r.amount);
const sessions=D.sessions.filter(s=>s.date===date&&isHeld(s)).sort(by(s=>s.start||''));
const matches=D.matches.filter(mt=>mt.date===date).sort(by(mt=>mt.time||''));
return {date,ins,outs,inG:group(ins,['Tuition','Kits & apparel','Competitions']),outG:group(outs,[...EXP_CATS,'Competitions']),byMethod,tin,tout,net:tin-tout,sessions,matches};
}

${panel({title:'Activity',body:act})}
<p class="muted small no-print" style="margin:0">Counts every payment by its “paid on” date. Tap a tuition payment or an expense to correct it.</p>

function reportText(R){

L.push(`*Cash in: ${money(R.tin)}*`);R.inG.forEach(g=>L.push(`• ${g.cat}: ${money(g.total)} (${g.rows.length})`));if(!R.inG.length)L.push('• Nothing');

function fbErr(e){const c=e&&e.code;const map={'permission-denied':'invalid_argument','not-found':'invalid_argument','unauthenticated':'invalid_argument','resource-exhausted':'resource_exhausted','unavailable':'unavailable'};return {code:map[c]||c||'unavailable',message:(e&&e.message)||''}}
function settle(p){return Promise.race([p.catch(e=>{throw fbErr(e)}),new Promise(r=>setTimeout(()=>r('queued'),4000))])}
function makeFireStore(db){
const FP=firebase.firestore.FieldPath;
const build=(col,o={})=>{let q=db.collection(col);(o.where||[]).forEach(w=>{q=q.where(w[0],w[1],w[2])});if(o.orderBy)q=q.orderBy(o.orderBy[0],o.orderBy[1]||'asc');if(o.limit)q=q.limit(o.limit);return q};
const flat=(obj,pre=[],out=[])=>{for(const k in obj){const v=obj[k];if(isObj(v)&&Object.keys(v).length)flat(v,[...pre,k],out);else out.push([[...pre,k],v===undefined?null:v])}return out};
return {
subCol:(col,o,cb,err)=>build(col,o).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),e=>err&&err(fbErr(e))),
subDoc:(p,cb,err)=>db.doc(p).onSnapshot(s=>cb(s.exists?{...s.data(),id:s.id}:null),e=>err&&err(fbErr(e))),
set:(p,d)=>settle(db.doc(p).set(d)),
update:(p,d)=>{const pairs=flat(d);if(!pairs.length)return Promise.resolve();const args=[];pairs.forEach(([path,v])=>{args.push(new FP(...path),v)});return settle(db.doc(p).update(...args))},
del:p=>settle(db.doc(p).delete()),
add:async(col,d)=>{const r=db.collection(col).doc();await settle(r.set(d));return r.id},
newId:col=>db.collection(col).doc().id,
};
}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Couldn’t read that image.'));r.readAsDataURL(b)})}
function authMsg(e){const c=(e&&e.code)||'';
if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Email or password is incorrect.';
if(c.includes('email-already-in-use'))return 'That email already has an account. Sign in instead.';
if(c.includes('weak-password'))return 'Use a password with at least 6 characters.';
if(c.includes('invalid-email'))return 'Enter a valid email address.';
if(c.includes('too-many-requests'))return 'Too many attempts. Wait a few minutes and try again.';
if(c.includes('network-request-failed'))return 'No connection. Check your internet and try again.';
if(c.includes('operation-not-allowed'))return 'Email sign-in isn’t turned on in Firebase yet (Authentication → Sign-in method).';
return (e&&e.message)||'Something went wrong. Try again.';
}
function signInModal(mode){
mode=mode||'in';
const title={in:'Staff sign in',up:'Create staff account',reset:'Reset password'}[mode];
const links={in:`<button type="button" class="link" data-act="signIn" data-m="up">New here? Create an account</button><button type="button" class="link" data-act="signIn" data-m="reset">Forgot password?</button>`,
up:`<button type="button" class="link" data-act="signIn" data-m="in">Already have an account? Sign in</button>`,
reset:`<button type="button" class="link" data-act="signIn" data-m="in">Back to sign in</button>`}[mode];
modal({title,body:`${mode==='up'?'<p class="muted small" style="margin:0">After creating your account, tap <b>Request staff access</b>. The owner approves you and sets your role.</p>':''}${mode==='reset'?'<p class="muted small" style="margin:0">We’ll email you a link to choose a new password.</p>':''}
${fld('Email',inp('email','','text','autocomplete="email" inputmode="email" required'))}
${mode!=='reset'?fld('Password',`<input type="password" name="password" id="f_password" autocomplete="${mode==='up'?'new-password':'current-password'}" required>`,mode==='up'?'At least 6 characters.':''):''}
<div class="row" style="justify-content:space-between">${links}</div>`,
submit:{in:'Sign in',up:'Create account',reset:'Send link'}[mode],
onSubmit:async f=>{
if(!f.email)return 'Enter your email.';
try{
if(mode==='in')await AUTH.signInWithEmailAndPassword(f.email,f.password||'');
else if(mode==='up'){const c=await AUTH.createUserWithEmailAndPassword(f.email,f.password||'');c.user.sendEmailVerification().catch(()=>{});toast('Account created')}
else{await AUTH.sendPasswordResetEmail(f.email);toast('Reset link sent to '+f.email)}
}catch(e){return authMsg(e)}
}});
}
async function ownerCheck(u){
const key='axi_owner_'+u.uid;
try{await FS.doc('ownerCheck/me').get({source:'server'});try{localStorage.setItem(key,'1')}catch(e){}return true}
catch(e){if(e&&e.code==='unavailable'){try{return localStorage.getItem(key)==='1'}catch(x){return false}}try{localStorage.removeItem(key)}catch(x){}return false}
}
async function onAuth(u){
Subs.offAll();resetData();S.viewAs=null;S.requested=false;S.coachId=null;
S.me.id=u?u.uid:null;S.email=u?u.email:null;S.verified=!!(u&&u.emailVerified);
S.isOwner=u?await ownerCheck(u):false;
S.realRole=S.isOwner?'owner':'guest';S.role=S.realRole;
if(u&&!S.isOwner){
Subs.on('meMember',()=>Store.subDoc('members/'+u.uid,d=>{const m={...D.members};if(d)m[u.uid]=d;else delete m[u.uid];D.members=m;resolveRole()},e=>dbErr('meMember',e)));
Subs.on('meReq',()=>Store.subDoc('requests/'+u.uid,d=>{S.requested=!!d;render()},()=>{}));
}
wire();
if(!allowed(S.route))go(homeFor(S.role),true);
render();
}
function bootFirebase(){
try{const i=document.querySelector('link[rel=icon]');if(i)i.href=IMG.markN;const a=document.querySelector('link[rel=apple-touch-icon]');if(a)a.href=IMG.crestN;const t=document.querySelector('.topbar img');if(t)t.src=IMG.crestW}catch(e){}
try{const r=location.hash.slice(1);if(r&&PAGES.some(p=>p.id===r))S.route=r}catch(e){}
if(!FIREBASE_CONFIG||typeof firebase==='undefined')return startPreview();
try{
firebase.initializeApp(FIREBASE_CONFIG);
FS=firebase.firestore();
try{FS.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
FS.enablePersistence({synchronizeTabs:true}).catch(()=>{});
AUTH=firebase.auth();
}catch(e){console.error(e);return startPreview()}
Store=makeFireStore(FS);S.mode='live';S.realRole='guest';S.role='guest';
if(!allowed(S.route))S.route=homeFor('guest');
render();
AUTH.onAuthStateChanged(u=>{onAuth(u)});
}
Object.assign(PLATFORM,{
boot:bootFirebase, membersPublic:false, serialWrites:false, photoMax:480,
railFoot(){
if(!S.me.id)return `<button class="rail-btn" data-act="signIn" data-m="in">Staff sign in</button>`;
let h=`<div class="who"><div style="min-width:0"><div class="n">${esc(S.email||'')}</div><div class="r">${S.realRole==='guest'?'No staff role yet':esc(ROLE_LABEL[S.realRole])}${S.realRole==='coach'&&S.coachId?` · ${esc((byId(D.coaches,S.coachId)||{}).name||'')}`:''}</div></div></div>`;
if(S.realRole==='owner')h+=viewAsSelect();
if(S.realRole==='guest')h+=`<button class="rail-btn" data-act="requestAccess">${S.requested?'Access requested · waiting for approval':'Request staff access'}</button>`;
h+=`<button class="rail-btn" data-act="signOut">Sign out</button>`;
return h;
},
strip(){
if(S.me.id&&!S.verified&&S.realRole==='guest')return `<div class="strip"><b>Verify your email</b><span>We sent a link to ${esc(S.email||'')}. The owner account only unlocks once its email is verified.</span><div class="row"><button class="btn sm" data-act="resendVerify">Resend link</button><button class="btn sm" data-act="recheckVerify">I’ve verified</button></div></div>`;
return '';
},
personName(id){const m=D.members[id];if(m&&m.email)return m.email;const r=D.requests.find(x=>x.id===id);return r&&r.name?r.name:null},
canPhoto:()=>S.mode==='live'&&isMgmt(),
photoDenied:()=>S.mode==='preview'?'Photos can be added once the app is connected to Firebase.':'Only the owner and administration can add photos.',
async uploadPhoto(blob){const d=await blobToDataURL(blob);if(d.length>700000)throw new Error('That photo is too large. Try a smaller image.');return {photoData:d,photo:null,photoUrl:null}},
canDownload:()=>true,
canPrint:()=>true,
download(name,text){const u=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return Promise.resolve()},
requestAccess(){if(!S.me.id)return signInModal('up');if(S.requested)return toast('Your request is waiting for the owner’s approval.');requestModal({email:S.email||''})},
denyMsg:'Couldn’t send the request. Sign out, sign in again and retry.',
accessGuide:()=>`<div class="callout"><h4>How people get in</h4><ol>
<li><b>Parents</b> — send them the link. No account needed.</li>
<li><b>Staff</b> — send the same link. They tap <b>Staff sign in → Create account</b>, then <b>Request staff access</b>.</li>
<li>Approve each request here and pick the role. Link coaches to their coach profile.</li></ol>
<p>Owner access comes from the email addresses listed in your Firebase security rules. Owners must verify their email.</p></div>`,
});
Object.assign(ACT,{
signIn:d=>{$$('.scrim').forEach(x=>x.remove());signInModal(d.m)},
signOut:()=>{AUTH&&AUTH.signOut().then(()=>toast('Signed out'))},
resendVerify:()=>{const u=AUTH&&AUTH.currentUser;if(u)u.sendEmailVerification().then(()=>toast('Link sent to '+u.email)).catch(e=>toast(authMsg(e),true))},
recheckVerify:async()=>{const u=AUTH&&AUTH.currentUser;if(!u)return;try{await u.reload();await u.getIdToken(true);await onAuth(AUTH.currentUser);toast(AUTH.currentUser.emailVerified?'Email verified':'Not verified yet — open the link in the email first.',!AUTH.currentUser.emailVerified)}catch(e){toast(authMsg(e),true)}},
});

const PREVIEW_PEOPLE={};function sampleData(){return {}}
boot();
