const s=SP.s,p=SP.p,st=host.scrollTop,tot=spTotal(p),avg=spAvg(p.reflection);
const coachOpts=[['','—'],...D.coaches.map(c=>[c.id,c.name])];
const block=([k,l],i)=>{const b=p.blocks[k],dr=b.drillId?byId(D.drills,b.drillId):null;
return `<section class="sp-card sp-block"><header class="sp-bh"><span class="sp-bn">${String(i+1).padStart(2,'0')}</span><h3>${l}</h3><span class="sp"></span><label class="sp-min"><input class="input" type="number" min="0" step="1" inputmode="numeric" id="spMin_${k}" value="${esc(b.min)}" aria-label="${l} minutes" placeholder="0"><span>min</span></label></header>
<div class="sp-bb"><div class="sp-diag">${dr?`<button class="sp-pic ${drIsPhoto(dr)?'photo':''}" data-act="openDrill" data-id="${dr.id}" aria-label="Open drill ${esc(dr.title||'')}">${drThumb(dr,'dr-thumb')}</button><div class="sp-dt"><b>${esc(dr.title||'Untitled drill')}</b>${dr.duration?`<span class="muted small">${num(dr.duration)} min in library</span>`:''}</div><div class="row"><button class="btn sm" data-act="spPick" data-b="${k}">Change</button><button class="btn sm" data-act="spUpload" data-b="${k}">${ICON.cam} Picture</button><button class="btn sm ghost" data-act="spUnlink" data-b="${k}">Remove</button></div>`
:`<div class="sp-empty"><svg viewBox="0 0 40 52" width="40" height="52" aria-hidden="true"><rect x="1" y="1" width="38" height="50" rx="3" fill="#3d9a5b"/><rect x="5" y="5" width="30" height="42" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M5 26h30" stroke="#fff" stroke-width="1.5"/><circle cx="20" cy="26" r="5" fill="none" stroke="#fff" stroke-width="1.5"/></svg><p>No drill yet</p><div class="row"><button class="btn sm primary" data-act="spDraw" data-b="${k}">Draw a drill</button><button class="btn sm" data-act="spPick" data-b="${k}" ${D.drills.length?'':'disabled'}>From library</button><button class="btn sm" data-act="spUpload" data-b="${k}">${ICON.cam} Upload picture</button></div></div>`}</div>
<div class="sp-notes"><label class="flabel" for="spNotes_${k}">Coaching notes</label><textarea id="spNotes_${k}" rows="6" placeholder="Key coaching points, questions to ask, progressions…">${esc(b.notes||'')}</textarea>${dr&&(dr.desc||dr.points)?`<details class="sp-det"><summary>Drill set-up from the library</summary>${dr.desc?`<p>${esc(dr.desc)}</p>`:''}${dr.points?`<ul>${String(dr.points).split('\n').map(x=>x.trim()).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</details>`:''}</div></div></section>`};
host.innerHTML=`<div class="dr-top sp-top"><button class="ib" data-act="spClose" aria-label="Close the session plan">←</button><div class="sp-tt"><div class="eyebrow">Session plan · ${esc(s.group)}</div><b>${esc(spWhen(s))}</b></div><span class="sp"></span>
<span class="sp-total" aria-live="polite">${tot?`<b>${tot}</b> min planned`:''}</span>
<div class="row dr-acts">${s.plan?`<button class="btn sm danger" data-act="spDelete">Delete plan</button>`:''}${PLATFORM.canDownload()?`<button class="btn sm" data-act="spImage">Image</button><button class="btn sm" data-act="spPdf">PDF</button>`:''}<button class="btn sm primary" data-act="spSave" ${spDirty()||!s.plan?'':'disabled'}>${spDirty()||!s.plan?'Save plan':'Saved'}</button></div></div>
<div class="sp-body"><div class="sp-sheet">
<section class="sp-card sp-head"><div class="sp-grid">
<div class="field"><label for="spCoach">Coach</label>${`<select id="spCoach">${coachOpts.map(([v,l])=>`<option value="${esc(v)}" ${String(p.coachId||'')===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`}</div>
<div class="field"><span class="flabel">Age group</span><div class="sp-ro">${esc(s.group||'—')}</div></div>
<div class="field"><span class="flabel">Date</span><div class="sp-ro">${esc(fmtDateY(s.date))}${s.start?` · ${esc(s.start)}`:''}</div></div>
</div><div class="sp-grid sp-g2">${SP_HEAD.map(([k,l,ph])=>`<div class="field ${k==='intention'?'sp-wide':''}"><label for="spH_${k}">${l}</label>${k==='intention'?`<textarea id="spH_${k}" rows="2" placeholder="${esc(ph)}">${esc(p[k]||'')}</textarea>`:`<input class="input" id="spH_${k}" value="${esc(p[k]||'')}" placeholder="${esc(ph)}">`}${spPresetChips(k,p[k])}</div>`).join('')}</div>${spPhotoCard(p)}</section>
${SP_BLOCKS.map(block).join('')}
<section class="sp-card sp-reflect"><header class="sp-bh"><span class="sp-bn">05</span><h3>Reflection on training</h3><span class="sp"></span>${avg!=null?`<span class="sp-avg"><b>${avg}</b>/5</span>`:'<span class="muted small">Score each out of 5 after the session</span>'}</header>
<div class="sp-rates">${SP_REFLECT.map(([k,l])=>{const v=num(p.reflection[k]);return `<div class="sp-rate"><span class="sp-rl">${l}</span><div class="sp-stars" role="group" aria-label="${esc(l)}">${[1,2,3,4,5].map(n=>`<button class="${n<=v?'on':''}" data-act="spRate" data-k="${k}" data-v="${n}" aria-pressed="${n===v}" aria-label="${n} out of 5">${n}</button>`).join('')}</div><span class="sp-rv">${v?v+'/5':'—'}</span></div>`}).join('')}</div>
<div class="field"><label for="spComments">Additional comments</label><textarea id="spComments" rows="4" placeholder="What worked, what to change next time, players to follow up…">${esc(p.reflection.comments||'')}</textarea></div></section>
</div></div>`;
host.scrollTop=st;spBind();
}
function spSaveBtn(){const b=$('#spHost [data-act="spSave"]');if(b){const on=spDirty()||!SP.s.plan;b.disabled=!on;b.textContent=on?'Save plan':'Saved'}const t=$('#spHost .sp-total');if(t){const n=spTotal(SP.p);t.innerHTML=n?`<b>${n}</b> min planned`:''}}
function spBind(){
const on=(id,fn)=>{const n=$('#'+id);if(n)n.addEventListener(n.tagName==='SELECT'?'change':'input',()=>{fn(n.value);spSaveBtn()})};
on('spCoach',v=>{SP.p.coachId=v});
SP_HEAD.forEach(([k])=>on('spH_'+k,v=>{SP.p[k]=v;spPresetSync(k)}));
SP_BLOCKS.forEach(([k])=>{on('spMin_'+k,v=>{SP.p.blocks[k].min=v});on('spNotes_'+k,v=>{SP.p.blocks[k].notes=v})});

}
function spOpen(){
let host=$('#spHost');if(!host){host=document.createElement('div');host.id='spHost';host.className='dr-host sp-host';host.setAttribute('role','dialog');host.setAttribute('aria-modal','true');host.setAttribute('aria-label','Session plan');document.body.appendChild(host)}
SP.open=true;host.hidden=false;document.documentElement.classList.add('dr-lock');spRender();host.scrollTop=0;
}
function spCloseNow(){SP.open=false;const host=$('#spHost');if(host){host.hidden=true;host.innerHTML=''}if(!DR.open)document.documentElement.classList.remove('dr-lock');render()}
window.addEventListener('keydown',e=>{if(!SP.open||DR.open||$$('.scrim').length)return;if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){a.blur();return}ACT.spClose()}},true);

g.font=`600 52px ${F.d}`;if('letterSpacing' in g)g.letterSpacing='4px';const tw=g.measureText('SESSION PLAN').width;if('letterSpacing' in g)g.letterSpacing='0px';
const nmax=R-tw-40-(M+116);let fs=32;const nm=String(c.name||'').toUpperCase();g.font=`600 ${fs}px ${F.d}`;while(fs>18&&g.measureText(nm).width+nm.length*3>nmax){fs--;g.font=`600 ${fs}px ${F.d}`}
text(nm,M+116,y+24,`600 ${fs}px ${F.d}`,NAVY,'left',3);text(String(c.slogan||'').toUpperCase(),M+116,y+52,`500 14px ${F.m}`,MUTED,'left',3);
text('SESSION PLAN',R,y+34,`600 52px ${F.d}`,NAVY,'right',4);
y=184;line(M,y,R,y,NAVY,3);y+=24;
const cell=(k,v,x,w,yy)=>{text(k.toUpperCase(),x,yy,`500 13px ${F.m}`,MUTED,'left',2);const ls=wrap(v||'—',`600 21px ${F.b}`,w-16).slice(0,3);ls.forEach((l,i)=>text(l,x,yy+30+i*27,`600 21px ${F.b}`,INK));return 30+ls.length*27};
const cw=(R-M)/4;let h1=0;[['Coach',p.coachId?coachName(p.coachId):''],['Age group',s.group],['Date',fmtDateY(s.date)],['Time',s.start?`${s.start}–${s.end||''}`:'']].forEach(([k,v],i)=>{h1=Math.max(h1,cell(k,v,M+i*cw,cw,y+14))});y+=h1+22;line(M,y,R,y);y+=12;
let h2=cell('Team intention',p.intention,M,R-M,y+14);y+=h2+18;
const cw3=(R-M)/3;let h3=0;[['Function',p.function],['Task',p.task],['Overload',p.overload]].forEach(([k,v],i)=>{h3=Math.max(h3,cell(k,v,M+i*cw3,cw3,y+14))});y+=h3+18;
const tot=spTotal(p);g.fillStyle=SOFT;g.fillRect(M,y,R-M,50);text(`TOTAL ${tot||0} MIN`,M+18,y+33,`600 18px ${F.m}`,NAVY,'left',2);
text(SP_BLOCKS.map(([k,l])=>`${l} ${num(p.blocks[k].min)||0}′`).join('   ·   '),R-18,y+32,`500 17px ${F.b}`,MUTED,'right');y+=80;
SP_BLOCKS.forEach(([k,l],i)=>{
const b=p.blocks[k],dr=b.drillId&&byId(D.drills,b.drillId),pic=pics[k];
const colX=M+520,colW=R-colX;const notes=wrap(b.notes||'',`500 19px ${F.b}`,colW);const setup=dr&&dr.desc?wrap(dr.desc,`500 17px ${F.b}`,colW).slice(0,8):[];
const bodyH=Math.max(pic?Math.min(470,500*pic.height/pic.width):120,(dr?40:0)+(setup.length?34+setup.length*25:0)+(notes.length?44+notes.length*27:30));
need(64+bodyH+30);
g.fillStyle=NAVY;g.fillRect(M,y,R-M,52);text(String(i+1).padStart(2,'0'),M+18,y+35,`600 22px ${F.m}`,'#9DB8EE');text(l.toUpperCase(),M+70,y+37,`600 30px ${F.d}`,'#FFFFFF','left',3);text(b.min?`${num(b.min)} MIN`:'— MIN',R-18,y+35,`600 20px ${F.m}`,'#FFFFFF','right',2);y+=64;

y=Math.max(top+bodyH,yy)+30;
});
const avg=spAvg(p.reflection);const com=wrap(p.reflection.comments||'',`500 19px ${F.b}`,R-M);
need(64+SP_REFLECT.length*52+90+Math.max(1,com.length)*27);
g.fillStyle=NAVY;g.fillRect(M,y,R-M,52);text('05',M+18,y+35,`600 22px ${F.m}`,'#9DB8EE');text('REFLECTION ON TRAINING',M+70,y+37,`600 30px ${F.d}`,'#FFFFFF','left',3);text(avg!=null?`${avg} / 5`:'',R-18,y+35,`600 20px ${F.m}`,'#FFFFFF','right',2);y+=74;
SP_REFLECT.forEach(([k,l])=>{const v=num(p.reflection[k]);text(l,M,y+8,`500 20px ${F.b}`,INK);for(let n=1;n<=5;n++){const cx=R-250+(n-1)*44;g.beginPath();g.arc(cx,y+1,15,0,Math.PI*2);g.fillStyle=n<=v?NAVY:'#fff';g.fill();g.strokeStyle=n<=v?NAVY:LINE;g.lineWidth=2;g.stroke();text(n,cx,y+7,`600 15px ${F.b}`,n<=v?'#fff':MUTED,'center')}text(v?`${v}/5`:'—',R,y+8,`600 18px ${F.b}`,INK,'right');y+=40;line(M,y-12,R,y-12)});

pages.forEach((cv,i)=>{const gg=cv.getContext('2d');gg.strokeStyle=NAVY;gg.lineWidth=2;gg.beginPath();gg.moveTo(M,FOOT);gg.lineTo(R,FOOT);gg.stroke();gg.font=`500 14px ${F.m}`;gg.fillStyle=MUTED;gg.textAlign='left';gg.fillText(`${String(c.short||'').toUpperCase()} · ${String(c.slogan||'').toUpperCase()}`,M,FOOT+36);gg.textAlign='right';gg.fillText(`Page ${i+1} of ${pages.length}`,R,FOOT+36)});

/* ---------- actions ---------- */
function spClean(p){
return JSON.parse(JSON.stringify({photoId:p.photoId||null,photoThumb:p.photoThumb||null,coachId:p.coachId||null,intention:String(p.intention||'').trim(),function:String(p.function||'').trim(),task:String(p.task||'').trim(),overload:String(p.overload||'').trim(),
blocks:Object.fromEntries(SP_BLOCKS.map(([k])=>{const b=p.blocks[k]||{};return [k,{min:b.min===''||b.min==null?null:num(b.min),drillId:b.drillId||null,notes:b.notes||''}]})),
reflection:{org:num(p.reflection.org),time:num(p.reflection.time),behaviour:num(p.reflection.behaviour),interventions:num(p.reflection.interventions),comments:p.reflection.comments||''},
updatedAt:Date.now(),updatedBy:S.me.id||null}));
}
Object.assign(ACT,{
openPlan:d=>{
if(!LOADED.has('sessions'))return toast('Sessions are still loading. Try again in a moment.',true);
const desc=SESS_DESC[d.s]||sessDoc(d.s);if(!desc)return toast('That session isn’t in this month.',true);
SP.sid=d.s;SP.desc=desc;SP.s={...desc,...(sessDoc(d.s)||{})};SP.p=spFrom(SP.s);SP.origPhoto=SP.p.photoId||null;SP.orig=JSON.stringify(SP.p);spOpen();
},
spClose:()=>{if(spDirty())confirmBox('Leave without saving?','Your changes to this session plan will be lost.','Discard changes',()=>spCloseNow());else spCloseNow()},
spSave:async()=>{try{await writeSession(SP.desc,{plan:spClean(SP.p)});toast('Session plan saved');if(SP.origPhoto&&SP.origPhoto!==SP.p.photoId)photoDel(SP.origPhoto);SP.origPhoto=SP.p.photoId||null;SP.s={...SP.desc,...(sessDoc(SP.sid)||{}),plan:spClean(SP.p)};SP.orig=JSON.stringify(SP.p);spRender()}catch(e){}},
spDelete:()=>confirmBox('Delete session plan',`Delete the plan for ${esc(SP.s.group||'')} on ${esc(fmtDayLong(SP.s.date))}? The training session and its attendance stay; only the plan and its reflection are removed.`,'Delete plan',async()=>{await writeSession(SP.desc,{plan:null});toast('Session plan deleted');if(SP.origPhoto)photoDel(SP.origPhoto);SP.orig=JSON.stringify(SP.p);spCloseNow()}),
spRate:d=>{const cur=num(SP.p.reflection[d.k]);SP.p.reflection[d.k]=cur===Number(d.v)?0:Number(d.v);spRender()},
spUnlink:d=>{SP.p.blocks[d.b].drillId='';spRender()},
spDraw:d=>{const k=d.b,lab=(SP_BLOCKS.find(x=>x[0]===k)||[])[1]||'Drill',foc=(SP_BLOCKS.find(x=>x[0]===k)||[])[2];
DR.after=id=>{SP.p.blocks[k].drillId=id;toast(`Drill added to ${lab}. Save the plan to keep it.`)};
ACT.openDrill({prefill:{title:`${lab} · ${SP.s.group||''}`.trim(),ages:SP.s.group?[SP.s.group]:[],focus:foc?[foc]:[],duration:SP.p.blocks[k].min||''}})},
spPick:d=>{const k=d.b,cur=SP.p.blocks[k].drillId;const g=SP.s.group;
const list=[...D.drills].sort(by(x=>(x.id===cur?'0':(x.ages||[]).includes(g)?'1':'2')+(x.title||'')));
modal({title:`Choose a drill · ${(SP_BLOCKS.find(x=>x[0]===k)||[])[1]}`,submit:'Use this drill',body:`<div class="pfind"><span class="pfind-i" aria-hidden="true">${ICON.search}</span><input type="search" id="f_spfind" autocomplete="off" placeholder="Find a drill" aria-label="Find a drill"></div>
<div class="sp-picklist">${list.map(x=>`<label class="sp-pickrow" data-n="${esc(((x.title||'')+' '+(x.focus||[]).join(' ')+' '+(x.ages||[]).join(' ')).toLowerCase())}"><input type="radio" name="drillId" value="${x.id}" ${x.id===cur?'checked':''}><span class="dr-mini">${drSvg(x,{cls:'dr-minisvg'})}</span><span class="grow"><b>${esc(x.title||'Untitled drill')}</b><span class="muted small">${esc([(x.focus||[]).slice(0,2).join(', '),(x.ages||[]).join(', '),x.duration?num(x.duration)+' min':''].filter(Boolean).join(' · '))}</span></span></label>`).join('')}</div>`,
onOpen:form=>{const q=form.querySelector('#f_spfind');const rows=[...form.querySelectorAll('.sp-pickrow')];q.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();rows.forEach(r=>{r.hidden=!!s&&!r.dataset.n.includes(s)})})},
onSubmit:async f=>{if(!f.drillId)return 'Pick a drill.';SP.p.blocks[k].drillId=f.drillId;const dr=byId(D.drills,f.drillId);if(dr&&!SP.p.blocks[k].min&&dr.duration)SP.p.blocks[k].min=String(dr.duration);setTimeout(spRender,0)}});
},

/* ============================================================
ATELIER XI — Share images
Branded pictures of a whole session plan or a single drill,
sized for social posts (4:5) and stories (9:16).
============================================================ */
const SH_SIZES={post:{l:'Post · 4:5',w:1080,h:1350},story:{l:'Story · 9:16',w:1080,h:1920}};
const SH_NAVY='#0B1730',SH_ICE='#9DB8EE',SH_DIM='rgba(238,242,249,.62)',SH_LINE='rgba(238,242,249,.22)';
let SH_LOGO=null;
function shLogo(){if(SH_LOGO)return SH_LOGO;SH_LOGO=new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=IMG.crestW});return SH_LOGO}
const SHF={d:'"Big Shoulders Display","Arial Narrow",Arial,sans-serif',b:'"Instrument Sans",system-ui,"Segoe UI",Arial,sans-serif',m:'"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace'};
function shCanvas(w,h){
const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');
g.fillStyle=SH_NAVY;g.fillRect(0,0,w,h);
g.strokeStyle='rgba(255,255,255,.045)';g.lineWidth=1;for(let x=36;x<w;x+=36){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,h);g.stroke()}for(let y=36;y<h;y+=36){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke()}
const T=(s,x,y,font,color,align='left',ls=0)=>{g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';if('letterSpacing' in g)g.letterSpacing=ls+'px';g.fillText(String(s),x,y);if('letterSpacing' in g)g.letterSpacing='0px'};
const fit=(s,font,max,ls=0)=>{g.font=font;if('letterSpacing' in g)g.letterSpacing=ls+'px';s=String(s);let out=s;if(g.measureText(s).width>max){while(out.length>1&&g.measureText(out+'…').width>max)out=out.slice(0,-1);out+='…'}if('letterSpacing' in g)g.letterSpacing='0px';return out};
const wrap=(s,font,max,n)=>{g.font=font;const ls=drWrap(g,s,max).filter((l,i,a)=>l||i<a.length-1);if(n&&ls.length>n){const k=ls.slice(0,n);k[n-1]=fit(k[n-1]+'…',font,max);return k}return ls};
return {cv,g,T,fit,wrap};
}
function shHeader(K,logo,label,w,M){
const c=cfg(),{g,T,fit}=K;
if(logo)g.drawImage(logo,M,56,96,96*logo.height/logo.width);
const nm=String(c.name||'').toUpperCase();g.font=`600 16px ${SHF.m}`;if('letterSpacing' in g)g.letterSpacing='4px';const lw=g.measureText(label).width;if('letterSpacing' in g)g.letterSpacing='0px';
const max=w-2*M-120-lw-40;let fs=30;const wid=f=>{g.font=`600 ${f}px ${SHF.d}`;return g.measureText(nm).width+nm.length*3};while(fs>18&&wid(fs)>max)fs--;
T(fit(nm,`600 ${fs}px ${SHF.d}`,max,3),M+120,96,`600 ${fs}px ${SHF.d}`,'#FFFFFF','left',3);
T(String(c.slogan||'').toUpperCase(),M+120,126,`500 14px ${SHF.m}`,SH_DIM,'left',3);
T(label,w-M,96,`600 16px ${SHF.m}`,SH_ICE,'right',4);
g.strokeStyle=SH_LINE;g.lineWidth=2;g.beginPath();g.moveTo(M,178);g.lineTo(w-M,178);g.stroke();
}
function shFooter(K,w,h,M,right){
const c=cfg(),{g,T}=K;g.strokeStyle=SH_LINE;g.lineWidth=2;g.beginPath();g.moveTo(M,h-86);g.lineTo(w-M,h-86);g.stroke();
T(`${String(c.short||'').toUpperCase()} · ${String(c.slogan||'').toUpperCase()}`,M,h-46,`500 15px ${SHF.m}`,SH_DIM,'left',3);
if(right)T(right,w-M,h-46,`600 16px ${SHF.m}`,'#FFFFFF','right',3);
}
function shPitch(g,pic,x,y,w,h,bg){
g.fillStyle=bg||'#2c7445';g.fillRect(x,y,w,h);
if(pic){const sc=Math.min((w-16)/pic.width,(h-16)/pic.height);const pw=pic.width*sc,ph=pic.height*sc;g.drawImage(pic,x+(w-pw)/2,y+(h-ph)/2,pw,ph)}
}

/* whole session: header, intention, the four parts in a 2 × 2 grid */
async function spShareCanvas(s,p,size,notes){
await invFonts();const logo=await shLogo();const Z=SH_SIZES[size]||SH_SIZES.post,W=Z.w,H=Z.h,M=56;
const pics={};for(const [k] of SP_BLOCKS){const dr=p.blocks[k].drillId&&byId(D.drills,p.blocks[k].drillId);try{pics[k]=await drCanvas(dr||{pitch:'full',grass:'classic',items:[],lines:[]},1.3)}catch(e){}}
const K=shCanvas(W,H),{g,T,fit,wrap}=K;
shHeader(K,logo,'TRAINING SESSION',W,M);
let y=262;
const big=`600 ${size==='story'?96:84}px ${SHF.d}`;T(fit(String(s.group||'').toUpperCase(),big,W/2,3),M,y,big,'#FFFFFF','left',3);
T(fit(fmtDayLong(s.date).toUpperCase(),`600 22px ${SHF.m}`,W/2-M,2),W-M,y-40,`600 22px ${SHF.m}`,'#FFFFFF','right',2);
T(`${s.start||''}${s.end?' – '+s.end:''}${p.coachId?'  ·  '+String(coachName(p.coachId)).toUpperCase():''}`,W-M,y-8,`500 16px ${SHF.m}`,SH_DIM,'right',2);
y+=34;
if(p.intention){T('TEAM INTENTION',M,y+20,`600 14px ${SHF.m}`,SH_ICE,'left',3);const il=wrap(p.intention,`600 30px ${SHF.b}`,W-2*M,2);il.forEach((l,i)=>T(l,M,y+60+i*38,`600 30px ${SHF.b}`,'#FFFFFF'));y+=60+il.length*38}
const meta=[['Function',p.function],['Task',p.task],['Overload',p.overload]].filter(([,v])=>v);
if(meta.length){y+=10;const cw=(W-2*M)/meta.length;let mh=0;meta.forEach(([k,v],i)=>{const x=M+i*cw;T(k.toUpperCase(),x,y+18,`600 13px ${SHF.m}`,SH_ICE,'left',3);const ls=wrap(v,`600 20px ${SHF.b}`,cw-24,2);ls.forEach((l,j)=>T(l,x,y+46+j*26,`600 20px ${SHF.b}`,'#FFFFFF'));mh=Math.max(mh,ls.length)});y+=40+mh*26}
y+=22;
const foot=H-110,gap=22,cw=(W-2*M-gap)/2,ch=(foot-y-gap)/2,nl=notes?(size==='story'?4:2):0;
SP_BLOCKS.forEach(([k,l],i)=>{
const x=M+(i%2)*(cw+gap),yy=y+Math.floor(i/2)*(ch+gap),b=p.blocks[k],dr=b.drillId&&byId(D.drills,b.drillId);
g.fillStyle='rgba(255,255,255,.06)';g.fillRect(x,yy,cw,ch);g.strokeStyle=SH_LINE;g.lineWidth=1.5;g.strokeRect(x+.75,yy+.75,cw-1.5,ch-1.5);
g.fillStyle='#FFFFFF';g.fillRect(x,yy,cw,50);
T(String(i+1).padStart(2,'0'),x+16,yy+33,`600 16px ${SHF.m}`,'#5D6886','left',1);T(l.toUpperCase(),x+52,yy+36,`600 28px ${SHF.d}`,SH_NAVY,'left',3);T(b.min?`${num(b.min)}′`:'',x+cw-16,yy+35,`600 22px ${SHF.m}`,SH_NAVY,'right',1);
const nlines=nl&&b.notes?wrap(b.notes,`500 17px ${SHF.b}`,cw-28,nl):[];
const textH=(dr?36:0)+(nlines.length?nlines.length*23+8:0)+14,ph=ch-50-textH;
shPitch(g,pics[k],x,yy+50,cw,ph,dr&&drIsPhoto(dr)?'#14254B':null);
let ty=yy+50+ph;
if(dr){T(fit(dr.title||'',`600 20px ${SHF.b}`,cw-28),x+14,ty+28,`600 20px ${SHF.b}`,'#FFFFFF');ty+=36}
nlines.forEach((ln,j)=>T(ln,x+14,ty+(dr?14:26)+j*23,`500 17px ${SHF.b}`,SH_DIM));
});
const tot=spTotal(p);shFooter(K,W,H,M,tot?`TOTAL ${tot} MIN`:'');
return K.cv;
}

const K=shCanvas(W,H),{g,T,fit}=K;shHeader(K,logo,'TRAINING SESSION',W,M);

T(fit(fmtDayLong(s.date).toUpperCase(),`600 22px ${SHF.m}`,W/2-M,2),W-M,222,`600 22px ${SHF.m}`,'#FFFFFF','right',2);

await invFonts();const logo=await shLogo();const Z=SH_SIZES[size]||SH_SIZES.post,W=Z.w,H=Z.h,M=56;

/* preview + save + share */
async function shCanShare(){try{return !!(navigator.canShare&&navigator.share&&navigator.canShare({files:[new File([new Uint8Array(1)],'x.png',{type:'image/png'})]}))}catch(e){return false}}
async function shareImageModal({title,name,render,toggles=[],extraSize}){
const canShare=await shCanShare();
const sizes=[...Object.entries(SH_SIZES).map(([k,v])=>[k,v.l]),...(extraSize?[extraSize]:[])];
let blob=null,busy=0;
modal({title,wide:true,submit:'Save image',body:`<div class="sh-wrap"><div class="sh-opts">${fld('Format',radios('size',sizes,'post'))}${toggles.map(([k,l,on])=>`<label class="check"><input type="checkbox" name="${k}" ${on?'checked':''}> ${esc(l)}</label>`).join('')}<p class="muted small" style="margin:0">${canShare?'Share sends it straight to Instagram, WhatsApp or Photos.':'Save the image, then post it from your photos or downloads.'}</p></div><div class="sh-prev"><img id="shImg" alt="Preview of the image"><p class="muted small" id="shMsg" aria-live="polite">Preparing…</p></div></div>`,
extra:canShare?`<button type="button" class="btn" id="shShare" disabled>Share…</button>`:'',
onOpen:form=>{
const img=form.querySelector('#shImg'),msg=form.querySelector('#shMsg'),sb=form.querySelector('#shShare'),save=form.querySelector('[type=submit]');
const draw=async()=>{const n=++busy;blob=null;save.disabled=true;if(sb)sb.disabled=true;msg.textContent='Preparing…';msg.hidden=false;
try{const f=formData(form);const cv=await render(f.size||'post',f);if(n!==busy)return;img.src=cv.toDataURL('image/jpeg',0.86);blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(n!==busy)return;msg.hidden=true;save.disabled=false;if(sb)sb.disabled=false}
catch(e){console.warn(e);msg.textContent='Couldn’t draw the image.'}};
form.addEventListener('change',draw);
if(sb)sb.addEventListener('click',async()=>{if(!blob)return;const f=formData(form);try{await navigator.share({files:[new File([blob],name(f.size||'post',f),{type:'image/png'})],title})}catch(e){if(e&&e.name!=='AbortError')toast('Sharing isn’t available here. Use Save image.',true)}});
draw();
},
onSubmit:async f=>{if(!blob)return 'The image is still being prepared.';try{await PLATFORM.download(name(f.size||'post',f),blob);toast('Image saved')}catch(e){if(e&&e.code==='declined')return false;throw e}}});
}
const shSlug=s=>String(s||'').replace(/[^\w-]+/g,'-').replace(/^-+|-+$/g,'');
Object.assign(ACT,{
spImage:()=>{if(!PLATFORM.canDownload())return toast('Downloads aren’t available here.',true);const s=SP.s,p=JSON.parse(JSON.stringify(SP.p));
shareImageModal({title:'Session image',name:size=>`Session-${shSlug(s.group)}-${s.date}-${size}.png`,toggles:[['notes','Show coaching notes',true]],extraSize:p.photoId||p.photoThumb?['notebook','Notebook page']:null,render:(size,f)=>size==='notebook'?spNotebookCanvas(s,p):spShareCanvas(s,p,size,!!f.notes)})},
drShare:()=>{if(!PLATFORM.canDownload())return toast('Downloads aren’t available here.',true);const d=JSON.parse(JSON.stringify(DR.d));
shareImageModal({title:'Drill image',name:size=>`${shSlug(d.title)||'Drill'}-${size}.png`,toggles:[['points','Show coaching points',true]],extraSize:['pitch',drIsPhoto(d)?'Picture only':'Diagram only'],
render:(size,f)=>size==='pitch'?drCanvas(d,2):drShareCanvas(d,size,!!f.points)})},
});

/* ============================================================
ATELIER XI — Pictures
Full-size pictures live in their own collection (photos/{id}) and
are only downloaded when someone opens them. Lists keep a small
thumbnail inside the item, drill or plan so the app stays fast.
============================================================ */
const PHOTO_DATA={},PHOTO_REQ={};
const PHOTO_CAP=880000;
function imgLoad(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('That file isn’t a picture we can read.'));i.src=src})}
function pickImage(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.style.display='none';document.body.appendChild(i);i.addEventListener('change',()=>{res(i.files&&i.files[0]||null);i.remove()},{once:true});i.addEventListener('cancel',()=>{res(null);i.remove()},{once:true});i.click()})}
function imgToData(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*s));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*s));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function photoPrep(src,{max=1500,thumb=360,mid=0}={}){
let url=src,tmp=null;if(src instanceof Blob){tmp=URL.createObjectURL(src);url=tmp}
try{const img=await imgLoad(url);let full=imgToData(img,max,0.8);for(const [m,q] of [[1300,0.74],[1100,0.7],[900,0.66]]){if(full.length<=PHOTO_CAP)break;full=imgToData(img,m,q)}
return {full,thumb:imgToData(img,thumb,0.72),mid:mid?imgToData(img,mid,0.76):null}}
finally{if(tmp)URL.revokeObjectURL(tmp)}
}
async function photoRotate(dataUrl,o){const img=await imgLoad(dataUrl);const c=document.createElement('canvas');c.width=img.naturalHeight;c.height=img.naturalWidth;const g=c.getContext('2d');g.translate(c.width,0);g.rotate(Math.PI/2);g.drawImage(img,0,0);return photoPrep(c.toDataURL('image/jpeg',0.9),o)}
async function photoStore(full){const id=Store.newId('photos');await W(()=>Store.set('photos/'+id,{data:full,by:S.me.id||null,at:Date.now()}));PHOTO_DATA[id]=full;return id}
function photoDel(id){if(!id)return;delete PHOTO_DATA[id];delete PHOTO_REQ[id];Promise.resolve().then(()=>Store.del('photos/'+id)).catch(()=>{})}
function photoGet(id){if(!id)return Promise.resolve(null);if(PHOTO_DATA[id])return Promise.resolve(PHOTO_DATA[id]);if(!PHOTO_REQ[id])PHOTO_REQ[id]=Store.getDoc('photos/'+id).then(d=>{const v=d&&d.data||null;if(v)PHOTO_DATA[id]=v;return v}).catch(()=>null);return PHOTO_REQ[id]}
function photoNow(id,onload){if(!id)return null;if(PHOTO_DATA[id])return PHOTO_DATA[id];photoGet(id).then(v=>{if(v&&onload)onload()});return null}
async function photoFromPicker(o){const f=await pickImage();if(!f)return null;if(!/^image\//.test(f.type||'image/'))throw new Error('Choose a picture (JPG or PNG).');return photoPrep(f,o)}
function photoErr(e){console.warn(e);toast(e&&e.message&&!e.code?e.message:errMsg(e),true)}

rm.addEventListener('click',()=>{P.full=null;P.thumb=null;P.mid=null;P.removed=true;show()})},
onSubmit:async f=>{if(!f.name)return 'Name the item.';const o={name:f.name,category:f.category,price:num(f.price),cost:f.cost===''?null:num(f.cost),sizes:csvList(f.sizes),public:!!f.public,updatedAt:Date.now()};
const old=i.photoId||null;
if(P.full){o.photoId=await photoStore(P.full);o.thumb=P.thumb}else if(P.removed){o.photoId=null;o.thumb=null}
let id=d.id;if(d.id)await W(()=>Store.update('apparelItems/'+d.id,o),'Item saved');else id=await W(()=>Store.add('apparelItems',o),'Item added');
if(old&&(P.full||P.removed))photoDel(old);
const prev=byId(D.catalog,id);catalogPut(id,{...i,...o,thumb:P.thumb},P.mid||(P.removed?null:(prev&&prev.pic)||P.thumb))}});
};

async function drPhotoCanvas(d,maxSide){const src=await drPhotoSrc(d);if(!src)throw new Error('Picture not available');const img=await imgLoad(src);const s=Math.min(1,(maxSide||1600)/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c}

ACT.openDrill({prefill:{kind:'photo',thumb:r.thumb,_full:r.full}});DR.orig='';DR.tab='details';drRender();toast('Picture added. Give it a name and save it.')}catch(e){photoErr(e)}})};

/* ---------- parents' kit catalogue: a public copy without costs or orders ---------- */
let CAT_FAIL=false,CAT_T=0;
function catalogDoc(it,pic){return {name:it.name||'',category:it.category||'',price:num(it.price),sizes:it.sizes||[],cur:fin().currency||'$',pic:pic||null,order:it.category||'',updatedAt:Date.now()}}
function catalogDel(id){Promise.resolve().then(()=>Store.del('catalog/'+id)).catch(()=>{})}
function catalogPut(id,it,pic){if(!id)return;if(it.public===false)return catalogDel(id);Promise.resolve().then(()=>Store.set('catalog/'+id,catalogDoc(it,pic))).catch(e=>{console.warn('catalog',e);CAT_FAIL=true})}
function catalogSync(){
if(CAT_FAIL)return;const want=new Map(D.apparelItems.filter(i=>i.public!==false).map(i=>[i.id,i]));
D.catalog.forEach(c=>{if(!want.has(c.id))catalogDel(c.id)});
const sig=x=>JSON.stringify([x.name||'',x.category||'',num(x.price),x.sizes||[]]);
want.forEach((it,id)=>{const c=D.catalog.find(x=>x.id===id);if(!c||sig(c)!==sig(it)||(!c.pic&&it.thumb)||(c.pic&&!it.thumb)||(c.cur||'$')!==(fin().currency||'$'))catalogPut(id,it,it.thumb?(c&&c.pic)||it.thumb:null)});
}
function catalogSyncSoon(){if(CAT_FAIL||!isMgmtR(S.realRole)||!LOADED.has('apparelItems')||!LOADED.has('catalog')||!LOADED.has('finance'))return;clearTimeout(CAT_T);CAT_T=setTimeout(catalogSync,900)}
{const base=PAGE_RENDER.apparel;PAGE_RENDER.apparel=()=>{catalogSyncSoon();return base()}}
const kitPrice=x=>`${x.cur||'$'}${num(x.price).toLocaleString('en-US',{maximumFractionDigits:2})}`;
PAGE_RENDER.kits=()=>{
const c=cfg(),items=D.catalog.slice().sort(by(x=>(x.order||x.category||'')+'|'+(x.name||'')));const wa=String(c.phone||'').replace(/[^\d]/g,'');
const card=x=>`<article class="kit">${x.pic?`<button class="kit-pic" data-act="viewKit" data-id="${esc(x.id)}" aria-label="Bigger picture of ${esc(x.name)}"><img src="${x.pic}" alt="${esc(x.name)}" loading="lazy"></button>`:`<div class="kit-pic none" aria-hidden="true"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg></div>`}
<div class="kit-b"><div class="kit-c">${esc(x.category||'')}</div><h3>${esc(x.name)}</h3>${seePrices()?`<div class="kit-p">${kitPrice(x)}</div>`:''}${(x.sizes||[]).length?`<div class="kit-s" aria-label="Sizes">${x.sizes.map(z=>`<span>${esc(z)}</span>`).join('')}</div>`:''}
${wa?`<a class="btn sm" href="https://wa.me/${wa}?text=${encodeURIComponent(`Hello, I’d like to order: ${x.name}`)}" target="_blank" rel="noopener">Order on WhatsApp</a>`:''}</div></article>`;
return titleBlock({sec:'Academy · Kits & apparel',title:'Kits & apparel',month:false,note:`Official ${esc(c.short||'academy')} kit and training wear.`,cells:[['Items',items.length]]})+

};
ACT.viewKit=d=>{const x=byId(D.catalog,d.id);if(!x)return;modal({title:x.name,wide:true,submit:'Done',body:`<div class="ph-view"><img src="${x.pic}" alt="${esc(x.name)}"></div><p class="muted small" style="margin:8px 0 0">${esc(x.category||'')}${seePrices()?' · '+kitPrice(x):''}${(x.sizes||[]).length?' · Sizes '+esc(x.sizes.join(', ')):''}</p>`,onSubmit:async()=>{}})};

/* ============================================================
ATELIER XI — Player IDs and competition PDFs
ID pictures live in playerIds/{playerId}; only the owner and
administration can open them. The player record keeps a small
flag (idDoc) so squad lists know who has an ID without loading it.
============================================================ */
const ID_CAP=430000;
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.style.display='none';document.body.appendChild(i);i.addEventListener('change',()=>{res(i.files&&i.files[0]||null);i.remove()},{once:true});i.addEventListener('cancel',()=>{res(null);i.remove()},{once:true});i.click()})}
function fileToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Couldn’t read that file.'));r.readAsDataURL(b)})}
function dataToBlob(d){const [h,b]=String(d).split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
async function idPrep(file){
if(/pdf$/i.test(file.type||'')||/\.pdf$/i.test(file.name||'')){const d=await fileToData(file);if(d.length>900000)throw new Error('That PDF is too big. Take a photo of the ID instead.');return {kind:'pdf',data:d.replace(/^data:[^;]*;/,'data:application/pdf;')}}
if(!/^image\//.test(file.type||'image/'))throw new Error('Choose a photo of the ID, or a PDF.');
const url=URL.createObjectURL(file);
try{const img=await imgLoad(url);let d='';for(const [m,q] of [[1500,0.82],[1300,0.78],[1100,0.74],[950,0.7],[800,0.66]]){d=imgToData(img,m,q);if(d.length<=ID_CAP)break}return {kind:'image',data:d}}
finally{URL.revokeObjectURL(url)}
}
const ID_DATA={};
function idGet(pid){if(ID_DATA[pid])return Promise.resolve(ID_DATA[pid]);return Store.getDoc('playerIds/'+pid).then(d=>{if(d)ID_DATA[pid]=d;return d}).catch(()=>null)}

function idModal(pid){
const p=byId(D.players,pid);if(!p)return;if(!isMgmt())return toast('Only the owner and administration can open player IDs.',true);
const st={front:null,back:null,loaded:!p.idDoc};
const slot=k=>{const v=st[k];const lbl=k==='front'?'Front':'Back (optional)';
return `<div class="id-slot" data-k="${k}"><div class="id-prev">${!st.loaded?'<span class="muted small">Loading…</span>':v?(v.kind==='pdf'?`<span class="id-pdf">${ICON.pdf}<b>PDF file</b></span>`:`<img src="${v.data}" alt="${lbl} of ${esc(p.name)}’s ID">`):`<span class="muted small">No ${k==='front'?'picture':'back'} yet</span>`}</div>
<div class="row"><span class="strong small">${lbl}</span><span class="sp"></span><button type="button" class="btn sm" data-pick="${k}">${v?'Replace':k==='front'?'Take or choose photo':'Add back'}</button>${v?`<button type="button" class="btn sm ghost" data-rm="${k}">Remove</button>`:''}</div></div>`};
modal({title:`ID · ${p.name}`,wide:true,submit:'Save ID',
body:`<p class="muted small" style="margin:0">Keep a photo of ${esc(p.name)}’s ID card or passport for competitions. Only the owner and administration can see it.</p><div class="id-slots" id="idSlots">${slot('front')}${slot('back')}</div><p class="muted small" id="idMsg" style="margin:0" aria-live="polite"></p>`,
extra:p.idDoc?`<button type="button" class="btn" id="idDl">${ICON.down} Download</button><button type="button" class="btn danger" id="idDel">Delete ID</button>`:'',
onOpen:(form,close)=>{
const box=form.querySelector('#idSlots'),msg=form.querySelector('#idMsg');const paint=()=>{box.innerHTML=slot('front')+slot('back')};
if(p.idDoc)idGet(pid).then(d=>{st.loaded=true;if(d){st.front=d.front||null;st.back=d.back||null}paint()});
box.addEventListener('click',async e=>{const b=e.target.closest('[data-pick],[data-rm]');if(!b)return;
if(b.dataset.rm){st[b.dataset.rm]=null;paint();return}
const k=b.dataset.pick;const f=await pickFile('image/*,application/pdf');if(!f)return;msg.textContent='Preparing…';
try{st[k]=await idPrep(f);st.loaded=true;msg.textContent='';paint()}catch(err){msg.textContent=err.message||'Couldn’t use that file.'}});
const dl=form.querySelector('#idDl');if(dl)dl.addEventListener('click',()=>idDownload(pid));
const del=form.querySelector('#idDel');if(del)del.addEventListener('click',()=>{close();confirmBox('Delete ID',`Delete ${esc(p.name)}’s ID pictures?`,'Delete',async()=>{await W(()=>Store.del('playerIds/'+pid));delete ID_DATA[pid];await W(()=>Store.update('players/'+pid,{idDoc:null}),'ID deleted')})});
},
onSubmit:async()=>{
if(!st.loaded)return 'Still loading the ID. Try again in a moment.';
if(!st.front&&st.back){st.front=st.back;st.back=null}
if(!st.front){if(p.idDoc){await W(()=>Store.del('playerIds/'+pid));delete ID_DATA[pid];await W(()=>Store.update('players/'+pid,{idDoc:null}),'ID removed')}return}
const size=st.front.data.length+(st.back?st.back.data.length:0);if(size>960000)return 'These files are too big together. Use photos instead of PDFs.';
const doc={front:st.front,back:st.back||null,at:Date.now(),by:S.me.id||null};
await W(()=>Store.set('playerIds/'+pid,doc));ID_DATA[pid]=doc;
await W(()=>Store.update('players/'+pid,{idDoc:{at:doc.at,pages:st.back?2:1,kind:st.front.kind}}),'ID saved');
}});
}
async function idDownload(pid){
const p=byId(D.players,pid);const d=await idGet(pid);if(!p||!d)return toast('Couldn’t load the ID.',true);
const nm=`${cfg().short} - ID - ${p.name}`.replace(/[\\/:*?"<>|]+/g,' ');
try{
if(d.front&&d.front.kind==='pdf'&&!d.back){await PLATFORM.download(nm+'.pdf',dataToBlob(d.front.data));return toast('ID saved')}
const cvs=await drawIdPages([{p,d}]);await PLATFORM.download(nm+'.pdf',pagesToPdf(cvs,nm));toast('ID saved');
}catch(e){if(e&&e.code!=='declined')toast('Couldn’t save the ID.',true)}
}
Object.assign(ACT,{addId:d=>idModal(d.p),viewId:d=>idModal(d.p)});

/* ---------- drawing helpers shared by the PDFs ---------- */
const CP_W=1240,CP_H=1754,CP_M=90;
const CP_C={NAVY:'#0E1E3A',INK:'#1B2A47',MUTED:'#5D6886',LINE:'#D6DCE7',SOFT:'#F3F5F9',OK:'#2C7A55',BAD:'#AE3636'};
const CP_F={d:'"Big Shoulders Display","Arial Narrow",Arial,sans-serif',b:'"Instrument Sans",system-ui,"Segoe UI",Arial,sans-serif',m:'"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace'};
function cpWriter(runTitle){
const pages=[];let g=null;const W={y:0,pages};const R=CP_W-CP_M,BOT=CP_H-130;
const text=(s,x,y,font,color,align='left',ls=0)=>{g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';if('letterSpacing' in g)g.letterSpacing=ls+'px';g.fillText(String(s),x,y);if('letterSpacing' in g)g.letterSpacing='0px'};
const fit=(s,font,max)=>{g.font=font;s=String(s??'');if(g.measureText(s).width<=max)return s;while(s.length>1&&g.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'};
const line=(x1,y1,x2,y2,color=CP_C.LINE,w=1.5)=>{g.strokeStyle=color;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};
W.text=text;W.fit=fit;W.line=line;W.g=()=>g;W.R=R;W.BOT=BOT;
W.page=()=>{const cv=document.createElement('canvas');cv.width=CP_W;cv.height=CP_H;g=cv.getContext('2d');g.fillStyle='#FFFFFF';g.fillRect(0,0,CP_W,CP_H);g.fillStyle=CP_C.NAVY;g.fillRect(0,0,CP_W,14);
g.strokeStyle=CP_C.NAVY;g.lineWidth=3;[[40,52,1,1],[CP_W-40,52,-1,1],[40,CP_H-40,1,-1],[CP_W-40,CP_H-40,-1,-1]].forEach(([x,y,sx,sy])=>{g.beginPath();g.moveTo(x,y+sy*24);g.lineTo(x,y);g.lineTo(x+sx*24,y);g.stroke()});
pages.push(cv);if(pages.length>1){text(fit(`${String(cfg().short||'').toUpperCase()} · ${runTitle}`,`500 15px ${CP_F.m}`,R-CP_M),CP_M,86,`500 15px ${CP_F.m}`,CP_C.MUTED,'left',2);line(CP_M,102,R,102)}
W.y=pages.length>1?146:96;return cv};
W.need=h=>{if(W.y+h>BOT)W.page()};
W.table=(cols,rows,o={})=>{
const tot=sum(cols,c=>c.w);let x=CP_M;cols.forEach(c=>{c.px=(R-CP_M)*c.w/tot;c.x=x;x+=c.px});const RH=o.rh||44;
const head=()=>{cols.forEach(c=>{const ax=c.a==='right'?c.x+c.px-10:c.a==='center'?c.x+c.px/2:c.x+6;text(c.h,ax,W.y,`500 13px ${CP_F.m}`,CP_C.MUTED,c.a||'left',1.5)});W.y+=14;line(CP_M,W.y,R,W.y,CP_C.NAVY,2)};
W.need(RH*2+20);head();
rows.forEach((r,i)=>{if(W.y+RH>BOT){W.page();head()}
if(i%2===1){g.fillStyle=CP_C.SOFT;g.fillRect(CP_M,W.y,R-CP_M,RH)}
cols.forEach(c=>{const v=c.v(r);const font=`${c.b?600:500} ${c.fs||19}px ${CP_F.b}`;const ax=c.a==='right'?c.x+c.px-10:c.a==='center'?c.x+c.px/2:c.x+6;text(fit(v,font,c.px-14),ax,W.y+RH/2+7,font,(c.tone&&c.tone(r))||CP_C.INK,c.a||'left')});
W.y+=RH;line(CP_M,W.y,R,W.y)});
if(o.total){if(W.y+RH>BOT){W.page();head()}cols.forEach(c=>{const v=o.total(c);if(v==null)return;const font=`600 19px ${CP_F.b}`;const ax=c.a==='right'?c.x+c.px-10:c.x+6;text(fit(v,font,c.px-14),ax,W.y+RH/2+7,font,CP_C.NAVY,c.a||'left')});W.y+=RH;line(CP_M,W.y,R,W.y,CP_C.NAVY,2)}
W.y+=26};
W.note=(s)=>{const font=`500 18px ${CP_F.b}`;g.font=font;const lines=[];let cur='';String(s).split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(g.measureText(t).width>R-CP_M&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);
W.need(18+lines.length*26);lines.forEach((l,i)=>text(l,CP_M,W.y+20+i*26,font,CP_C.MUTED));W.y+=20+lines.length*26+20};
W.finish=()=>{const n=pages.length;pages.forEach((cv,i)=>{g=cv.getContext('2d');line(CP_M,CP_H-104,R,CP_H-104,CP_C.NAVY,2);text(fit(`${String(cfg().short||'').toUpperCase()} · ${String(cfg().slogan||'').toUpperCase()}`,`500 14px ${CP_F.m}`,700),CP_M,CP_H-74,`500 14px ${CP_F.m}`,CP_C.MUTED,'left',3);text(`PAGE ${i+1} OF ${n}`,R,CP_H-74,`500 14px ${CP_F.m}`,CP_C.MUTED,'right',2)});return pages};
return W;
}

try{const im=await imgLoad(v.data);const s=Math.min((W.R-CP_M)/im.naturalWidth,boxH/im.naturalHeight);const w=im.naturalWidth*s,h=im.naturalHeight*s;W.g().drawImage(im,CP_M+(W.R-CP_M-w)/2,W.y,w,h);W.g().strokeStyle=CP_C.LINE;W.g().lineWidth=2;W.g().strokeRect(CP_M+(W.R-CP_M-w)/2,W.y,w,h);W.y+=h+20}catch(e){}
}
}

ACT.compPdf=d=>{

const c=d.c?byId(D.competitions,d.c):null;const t=c&&d.t?compTeams(c).find(x=>x.id===d.t):null;
if(!c&&!D.competitions.length)return toast('Add a competition first.',true);
const scopes=[...(t?[['team',`${teamLabel(t)} only`]]:[]),...(c?[['comp',c.name]]:[]),['all','All competitions']];
modal({title:'Download PDF',submit:'Download PDF',body:`${fld('What to print',radios('scope',scopes,scopes[0][0]))}
${fld('Include',`<div class="cp-checks"><label class="check"><input type="checkbox" name="squads" checked> Squads</label><label class="check"><input type="checkbox" name="matches" checked> Matches and results</label><label class="check"><input type="checkbox" name="money"> Payments</label><label class="check"><input type="checkbox" name="ids"> Player ID pictures</label></div>`)}
<p class="muted small" style="margin:0">Player IDs are added at the end, one player per page, for everyone in the squads you print.</p>`,
onSubmit:async f=>{
const blocks=f.scope==='team'?[{c,teams:[t]}]:f.scope==='comp'?[{c,teams:compTeams(c)}]:D.competitions.slice().sort(by(x=>({ongoing:0,upcoming:1,finished:2}[compState(x)])+(x.start||''))).map(x=>({c:x,teams:compTeams(x)}));
const short=cfg().short||'Academy';
const nm=f.scope==='team'?`${short} - ${c.name} - ${teamLabel(t)}`:f.scope==='comp'?`${short} - ${c.name}`:`${short} - All competitions`;
const heading=f.scope==='all'?'Competitions':'Tournament details';
const sub=f.scope==='team'?`${c.name} · ${teamLabel(t)}`:f.scope==='comp'?`${c.name}${c.kind?' · '+c.kind:''}`:`${blocks.length} competition${blocks.length===1?'':'s'}`;
toast('Making the PDF…');
const idList=[];
if(f.ids){const seen=new Set();for(const b of blocks)for(const tt of b.teams)for(const pid of (tt.playerIds||[])){if(seen.has(pid))continue;seen.add(pid);const p=byId(D.players,pid);if(p&&p.idDoc){const dd=await idGet(pid);if(dd)idList.push({p,d:dd})}}
idList.sort(by(x=>x.p.name));if(!idList.length)toast('No player IDs on file for these squads yet.')}

const blob=pagesToPdf(cvs,nm);
try{await PLATFORM.download(nm.replace(/[\\/:*?"<>|]+/g,' ')+'.pdf',blob);toast('PDF saved')}catch(e){if(e&&e.code!=='declined')throw e}
}});
};

/* ============================================================
ATELIER XI — one-tap WhatsApp invoices (WhatsApp Cloud API)
The app sends the invoice PDF to a small Google Apps Script web app.
The script checks the person is the owner or administration, then
sends the PDF from the academy's WhatsApp number to the parent with
an approved message template. The WhatsApp key never reaches the page.
============================================================ */
const WA_TEMPLATE='atelier_invoice';
const waApiUrl=()=>String(fin().waEndpoint||'').trim();
const waApiOn=()=>!!(typeof PLATFORM.idToken==='function'&&S.mode==='live'&&waApiUrl()&&isMgmt());
const waPlus=n=>{n=String(n||'');return n.indexOf('961')===0?'+961 '+n.slice(3):'+'+n};
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Couldn’t read the PDF.'));r.readAsDataURL(b)})}
function waErr(e){e=String(e||'');
if(e==='not_signed_in')return 'Couldn’t confirm your sign-in. Sign out, sign in again and retry.';
if(e==='not_allowed')return 'Only the owner and administration can send invoices.';
if(e==='missing_keys')return 'The WhatsApp keys aren’t in the script yet. Add WA_TOKEN and WA_PHONE_ID in the script’s properties.';
if(e==='bad_number')return 'That phone number doesn’t look right. Use the full number.';
if(e.indexOf('meta: ')===0)return 'WhatsApp says: '+e.slice(6);
return e||'Couldn’t send.';
}
async function waApiCall(body,url){
const idToken=await PLATFORM.idToken();let r;
try{r=await fetch(url||waApiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,idToken})})}
catch(e){throw new Error('Couldn’t reach the sending link. Check your internet and the link in Team & settings.')}
let j=null;try{j=await r.json()}catch(e){throw new Error('The sending link didn’t answer. Check it was deployed as a Web app with access for “Anyone”.')}
if(!j||!j.ok)throw new Error(waErr(j&&j.error));return j;
}

/* ---------- the script the owner pastes into Google Apps Script ---------- */
function waScript(){
const fc=typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG?FIREBASE_CONFIG:{};
const owner=String(S.isOwner&&S.email&&S.email.indexOf('@')>0?S.email:'').toLowerCase();
return `/* ${cfg().short||'Academy'} — sends invoice PDFs on WhatsApp.
1. Paste this whole file into a new Google Apps Script project (script.google.com).
2. Project Settings → Script properties → add WA_TOKEN (Meta system user token) and WA_PHONE_ID (phone number ID).
3. Deploy → New deployment → Web app → Execute as: Me → Who has access: Anyone. Copy the web app URL into the app. */
var FIREBASE_API_KEY = '${fc.apiKey||'PASTE_FIREBASE_WEB_API_KEY'}';
var FIREBASE_PROJECT = '${fc.projectId||'PASTE_FIREBASE_PROJECT_ID'}';
var OWNER_EMAILS = ['${owner||'PASTE_OWNER_EMAIL'}'];
var TEMPLATE = '${WA_TEMPLATE}', LANG = 'en', GRAPH = 'https://graph.facebook.com/v22.0/';

function prop_(k) { return PropertiesService.getScriptProperties().getProperty(k) || ''; }
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function doGet() { return out_({ ok: true, service: 'WhatsApp invoice sender' }); }

function doPost(e) {
try {
var req = JSON.parse(e.postData.contents);
var who = checkUser_(req.idToken);
if (!prop_('WA_TOKEN') || !prop_('WA_PHONE_ID')) throw new Error('missing_keys');
if (req.action === 'test') {
var info = meta_('get', prop_('WA_PHONE_ID') + '?fields=display_phone_number,verified_name');
return out_({ ok: true, who: who, number: info.display_phone_number, name: info.verified_name });
}
var to = String(req.to || '').replace(/\\D/g, '');
if (!/^\\d{8,15}$/.test(to)) throw new Error('bad_number');
var name = req.filename || 'invoice.pdf';
var blob = Utilities.newBlob(Utilities.base64Decode(req.pdf), 'application/pdf', name);
var media = meta_('post', prop_('WA_PHONE_ID') + '/media', { messaging_product: 'whatsapp', type: 'application/pdf', file: blob });
var msg = meta_('post', prop_('WA_PHONE_ID') + '/messages', JSON.stringify({
messaging_product: 'whatsapp', to: to, type: 'template',
template: { name: TEMPLATE, language: { code: LANG }, components: [
{ type: 'header', parameters: [{ type: 'document', document: { id: media.id, filename: name } }] },
{ type: 'body', parameters: (req.params || []).map(function (t) { return { type: 'text', text: String(t) }; }) }
] }
}));
return out_({ ok: true, id: msg.messages && msg.messages[0] && msg.messages[0].id });
} catch (err) {
return out_({ ok: false, error: String((err && err.message) || err) });
}
}

function meta_(method, path, payload) {
var o = { method: method, headers: { Authorization: 'Bearer ' + prop_('WA_TOKEN') }, muteHttpExceptions: true };
if (payload) { o.payload = payload; if (typeof payload === 'string') o.contentType = 'application/json'; }
var r = UrlFetchApp.fetch(GRAPH + path, o);
var j = JSON.parse(r.getContentText() || '{}');
if (r.getResponseCode() >= 300) throw new Error('meta: ' + ((j.error && (j.error.error_user_msg || j.error.message)) || r.getResponseCode()));
return j;
}

/* Only the owner and administration can send: the app passes the person's Firebase sign-in,
which is checked with Firebase, and their role is read from the members list. */
function checkUser_(idToken) {
if (!idToken) throw new Error('not_signed_in');
var r = UrlFetchApp.fetch('https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=' + FIREBASE_API_KEY,
{ method: 'post', contentType: 'application/json', payload: JSON.stringify({ idToken: idToken }), muteHttpExceptions: true });
if (r.getResponseCode() !== 200) throw new Error('not_signed_in');
var u = (JSON.parse(r.getContentText()).users || [])[0];
if (!u) throw new Error('not_signed_in');
if (u.email && OWNER_EMAILS.indexOf(String(u.email).toLowerCase()) >= 0) return 'owner';
var m = UrlFetchApp.fetch('https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT + '/databases/(default)/documents/members/' + u.localId,
{ headers: { Authorization: 'Bearer ' + idToken }, muteHttpExceptions: true });
if (m.getResponseCode() === 200) {
var f = JSON.parse(m.getContentText()).fields || {};
if (f.role && f.role.stringValue === 'admin') return 'admin';
}
throw new Error('not_allowed');
}
`;
}

newId:col=>db.collection(col).doc().id,

/* Everyone signs in with a name and a password. Firebase needs an email behind the scenes,
so each name becomes a private address like "imad_feghali@members.atelier-xi.app".
Names are unique (Firebase refuses a second account with the same address).
The owner keeps signing in with their real email, which the security rules recognise. */
const NAME_DOMAIN='members.atelier-xi.app';
function nameKey(n){
const t=String(n||'').trim().toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'');let k='';
for(const ch of t){if(/[a-z0-9]/.test(ch))k+=ch;else if(/[\s._\-]/.test(ch))k+='_';else k+='-'+ch.codePointAt(0).toString(36)}
return k.replace(/_+/g,'_').replace(/^[_-]+|[_-]+$/g,'');
}
const loginEmail=n=>String(n||'').includes('@')?String(n).trim():`${nameKey(n)}@${NAME_DOMAIN}`;
const isNameLogin=e=>String(e||'').toLowerCase().endsWith('@'+NAME_DOMAIN);
function authMsg(e,mode){const c=(e&&e.code)||'';
if(/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c))return mode==='up'?'That name can’t be used. Try another one.':'Name or password is incorrect.';
if(c.includes('email-already-in-use'))return 'That name is taken. Try another one — for example add your family name.';
if(c.includes('weak-password'))return 'Use a password with at least 6 characters.';
if(c.includes('too-many-requests'))return 'Too many attempts. Wait a few minutes and try again.';
if(c.includes('network-request-failed'))return 'No connection. Check your internet and try again.';
if(c.includes('operation-not-allowed'))return 'Sign-in isn’t turned on in Firebase yet (Authentication → Sign-in method → Email/Password).';
return (e&&e.message)||'Something went wrong. Try again.';
}

:`${fld('Your name',inp('name','','text','autocomplete="username" autocapitalize="words" required'))}
${fld('Password',`<input type="password" name="password" id="f_password" autocomplete="current-password" required>`)}`;
modal({title,body:body+`<div class="row" style="justify-content:space-between">${links}</div>`,
submit:{in:'Sign in',up:'Create account',reset:'Send link'}[mode],
onOpen:form=>{const po=form.querySelector('#poRow');if(po){const sync=()=>{po.hidden=(form.querySelector('input[name=role]:checked')||{}).value!=='parent'};form.addEventListener('change',sync);sync()}},
onSubmit:async f=>{
try{
if(mode==='reset'){if(!f.email)return 'Enter your email, or message the academy.';await AUTH.sendPasswordResetEmail(f.email);toast('Reset link sent to '+f.email);return}
const name=String(f.name||'').replace(/\s+/g,' ').trim();
if(!name)return 'Enter your name.';
if(mode==='in'){await AUTH.signInWithEmailAndPassword(loginEmail(name),f.password||'');return}
if(name.includes('@'))return 'Use your name, not an email address.';
const key=nameKey(name);if(key.length<3)return 'That name is too short.';if(key.length>60)return 'That name is too long. Try a shorter one.';
if(String(f.password||'').length<6)return 'Use a password with at least 6 characters.';
const role=f.role||'parent';const parentOf=role==='parent'?String(f.parentOf||'').replace(/\s+/g,' ').trim():'';
if(role==='parent'&&!parentOf)return 'Write your child’s full name.';
const cred=await AUTH.createUserWithEmailAndPassword(loginEmail(name),f.password);
try{await cred.user.updateProfile({displayName:name})}catch(e){}
S.displayName=name;
await FS.doc('requests/'+cred.user.uid).set({name,role,parentOf,phone:f.phone||'',login:key,at:Date.now()});
S.requested=true;render();toast('Account created. The academy will approve you soon.');
}catch(e){return authMsg(e,mode)}
}});
}
async function ownerCheck(u){
const key='axi_owner_'+u.uid;
try{await FS.doc('ownerCheck/me').get({source:'server'});try{localStorage.setItem(key,'1')}catch(e){}return true}
catch(e){if(e&&e.code==='unavailable'){try{return localStorage.getItem(key)==='1'}catch(x){return false}}try{localStorage.removeItem(key)}catch(x){}return false}
}
async function onAuth(u){
Subs.offAll();resetData();S.viewAs=null;S.requested=false;S.coachId=null;
S.me.id=u?u.uid:null;S.email=u?u.email:null;S.verified=!!(u&&(u.emailVerified||isNameLogin(u.email)));S.displayName=u?(u.displayName||(isNameLogin(u.email)?'':u.email)):null;
S.isOwner=u?await ownerCheck(u):false;
S.realRole=S.isOwner?'owner':'guest';S.role=S.realRole;
if(u&&!S.isOwner){
Subs.on('meMember',()=>Store.subDoc('members/'+u.uid,d=>{const m={...D.members};if(d)m[u.uid]=d;else delete m[u.uid];D.members=m;resolveRole()},e=>dbErr('meMember',e)));
Subs.on('meReq',()=>Store.subDoc('requests/'+u.uid,d=>{S.requested=!!d;if(d&&d.name)S.reqName=d.name;render()},()=>{}));
}
wire();
if(!allowed(S.route))go(homeFor(S.role),true);
render();
}
function bootFirebase(){
try{const i=document.querySelector('link[rel=icon]');if(i)i.href=IMG.markN;const t=document.querySelector('.topbar img');if(t)t.src=IMG.crestW}catch(e){}
try{const r=location.hash.slice(1);if(r&&PAGES.some(p=>p.id===r))S.route=r}catch(e){}
if(!FIREBASE_CONFIG||typeof firebase==='undefined')return startPreview();
try{
firebase.initializeApp(FIREBASE_CONFIG);
FS=firebase.firestore();
try{FS.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
FS.enablePersistence({synchronizeTabs:true}).catch(()=>{});
AUTH=firebase.auth();
}catch(e){console.error(e);return startPreview()}
Store=makeFireStore(FS);S.mode='live';S.realRole='guest';S.role='guest';
if(!allowed(S.route))S.route=homeFor('guest');
render();
AUTH.onAuthStateChanged(u=>{onAuth(u)});
}
Object.assign(PLATFORM,{
boot:bootFirebase, membersPublic:false, serialWrites:false, photoMax:480,
idToken:()=>AUTH&&AUTH.currentUser?AUTH.currentUser.getIdToken():Promise.reject(new Error('not_signed_in')),
railFoot(){
if(!S.me.id)return `<button class="rail-btn solid" data-act="signIn" data-m="in">Sign in</button><button class="rail-btn" data-act="signIn" data-m="up">Create an account</button>`;
const m=D.members[S.me.id];const nm=(m&&m.label)||S.displayName||S.reqName||(isNameLogin(S.email)?String(S.email).split('@')[0].replace(/_/g,' '):S.email)||'';
let h=`<div class="who"><div style="min-width:0"><div class="n">${esc(nm)}</div><div class="r">${S.realRole==='guest'?(S.requested?'Waiting for approval':'Not approved yet'):esc(ROLE_LABEL[S.realRole])}${S.realRole==='coach'&&S.coachId?` · ${esc((byId(D.coaches,S.coachId)||{}).name||'')}`:''}${S.realRole==='parent'&&m&&m.parentOf?` · ${esc(m.parentOf)}`:''}</div></div></div>`;
if(S.realRole==='owner')h+=viewAsSelect();
if(S.realRole==='guest'&&!S.requested)h+=`<button class="rail-btn" data-act="requestAccess">Ask the academy for access</button>`;
h+=`<button class="rail-btn" data-act="signOut">Sign out</button>`;
return h;
},
strip(){
if(S.me.id&&S.realRole==='guest'&&S.requested)return `<div class="strip"><b>Almost there</b><span>Your account is waiting for the academy to approve it. Until then you can see training times, matches and kit.</span></div>`;
if(S.me.id&&!S.verified&&S.realRole==='guest')return `<div class="strip"><b>Verify your email</b><span>We sent a link to ${esc(S.email||'')}. The owner account only unlocks once its email is verified.</span><div class="row"><button class="btn sm" data-act="resendVerify">Resend link</button><button class="btn sm" data-act="recheckVerify">I’ve verified</button></div></div>`;
return '';
},
personName(id){const m=D.members[id];if(m&&m.label)return m.label;if(m&&m.email)return m.email;const r=D.requests.find(x=>x.id===id);return r&&r.name?r.name:null},
canPhoto:()=>S.mode==='live'&&isMgmt(),
photoDenied:()=>S.mode==='preview'?'Photos can be added once the app is connected to Firebase.':'Only the owner and administration can add photos.',
async uploadPhoto(blob){const d=await blobToDataURL(blob);if(d.length>700000)throw new Error('That photo is too large. Try a smaller image.');return {photoData:d,photo:null,photoUrl:null}},
canDownload:()=>true,
canPrint:()=>true,
download(name,text){const u=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return Promise.resolve()},
requestAccess(){if(!S.me.id)return signInModal('up');if(S.requested)return toast('Your request is waiting for the academy’s approval.');requestModal({email:S.email||'',name:S.displayName||''})},
denyMsg:'Couldn’t send the request. Sign out, sign in again and retry.',
accessGuide:()=>`<div class="callout"><h4>How people get in</h4><ol>
<li>Send everyone the same link. Without an account they’re <b>guests</b>: training times, matches, kit (no prices) and the chat.</li>
<li>They tap <b>Create an account</b>, choose a name and password, and say if they’re a parent (with their child’s full name), coach or administration.</li>
<li>Approve each request here. Link parents to their child and coaches to their coach profile.</li></ol>
<p>Forgot password: delete the person in Firebase → Authentication → Users, then they create the account again. You keep signing in with your email.</p></div>`,
});
Object.assign(ACT,{
signIn:d=>{$$('.scrim').forEach(x=>x.remove());signInModal(d.m)},
signOut:()=>{AUTH&&AUTH.signOut().then(()=>toast('Signed out'))},
resendVerify:()=>{const u=AUTH&&AUTH.currentUser;if(u)u.sendEmailVerification().then(()=>toast('Link sent to '+u.email)).catch(e=>toast(authMsg(e),true))},
recheckVerify:async()=>{const u=AUTH&&AUTH.currentUser;if(!u)return;try{await u.reload();await u.getIdToken(true);await onAuth(AUTH.currentUser);toast(AUTH.currentUser.emailVerified?'Email verified':'Not verified yet — open the link in the email first.',!AUTH.currentUser.emailVerified)}catch(e){toast(authMsg(e),true)}},
});

const PREVIEW_PEOPLE={};function sampleData(){return {}}
boot();

</script>
