function makeLiveStore(db){
const build=(col,o={})=>{let q=db.collection(col);(o.where||[]).forEach(w=>{q=q.where(w[0],w[1],w[2])});if(o.orderBy)q=q.orderBy(o.orderBy[0],o.orderBy[1]);if(o.limit)q=q.limit(o.limit);return q};
return {
subCol:(col,o,cb,err)=>build(col,o).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),e=>err&&err(e)),
subDoc:(p,cb,err)=>db.doc(p).onSnapshot(s=>cb(s.exists?{...s.data(),id:s.id}:null),e=>err&&err(e)),
set:(p,d)=>db.doc(p).set(d), update:(p,d)=>db.doc(p).update(d), del:p=>db.doc(p).delete(),
add:async(col,d)=>{const r=db.collection(col).doc();await r.set(d);return r.id},
newId:col=>db.collection(col).doc().id,
getCol:col=>db.collection(col).get().then(s=>s.docs.map(d=>({...d.data(),id:d.id}))),
getDoc:p=>db.doc(p).get().then(s=>s.exists?{...s.data(),id:s.id}:null),
};
}
function makeMemStore(seed){
const cols=new Map(),subs=new Set();
const col=c=>{if(!cols.has(c))cols.set(c,new Map());return cols.get(c)};
Object.entries(seed).forEach(([c,docs])=>docs.forEach(d=>{const o=clone(d);const id=o.id;delete o.id;col(c).set(id,o)}));
const match=(o,[f,op,v])=>{const x=o[f];switch(op){case'==':return x===v;case'!=':return x!==v;case'>=':return x>=v;case'<=':return x<=v;case'>':return x>v;case'<':return x<v;case'in':return v.includes(x);case'array-contains':return Array.isArray(x)&&x.includes(v)}return true};
const query=(c,o={})=>{let a=[...col(c).entries()].map(([id,v])=>({...clone(v),id}));(o.where||[]).forEach(w=>{a=a.filter(x=>match(x,w))});a.sort(o.orderBy?by(x=>x[o.orderBy[0]],o.orderBy[1]==='desc'?-1:1):by(x=>x.id));if(o.limit)a=a.slice(0,o.limit);return a};
const split=p=>{const i=p.lastIndexOf('/');return[p.slice(0,i),p.slice(i+1)]};
const notify=c=>subs.forEach(s=>{if(s.c===c)s.fire()});
return {
subCol(c,o,cb){const s={c,fire:()=>cb(query(c,o))};subs.add(s);setTimeout(s.fire,0);return()=>subs.delete(s)},
subDoc(p,cb){const[c,id]=split(p);const s={c,fire:()=>{const v=col(c).get(id);cb(v?{...clone(v),id}:null)}};subs.add(s);setTimeout(s.fire,0);return()=>subs.delete(s)},
async set(p,d){const[c,id]=split(p);col(c).set(id,clone(d));notify(c)},
async update(p,d){const[c,id]=split(p);const v=col(c).get(id);if(!v)throw{code:'invalid_argument',message:'Document does not exist'};col(c).set(id,deepMerge(v,clone(d)));notify(c)},
async del(p){const[c,id]=split(p);col(c).delete(id);notify(c)},
async add(c,d){const id=uid();col(c).set(id,clone(d));notify(c);return id},
newId:()=>uid(),
async getCol(c){return query(c)},
async getDoc(p){const[c,id]=split(p);const v=col(c).get(id);return v?{...clone(v),id}:null},
};
}
const Subs={m:new Map(),
on(key,fn){if(this.m.has(key))return;try{this.m.set(key,fn())}catch(e){console.error(key,e)}},
off(key){const u=this.m.get(key);if(u){try{u()}catch(e){}this.m.delete(key)}},
offPrefix(p){[...this.m.keys()].filter(k=>k.startsWith(p)).forEach(k=>this.off(k))},
offAll(){[...this.m.keys()].forEach(k=>this.off(k))}};
function dbErr(key,e){if(key==='drills'){S.drillsDenied=true;render()}console.warn('subscription',key,e&&e.code,e&&e.message);if(e&&e.code==='revoked'){S.readOnly=true;render()}}

function subDoc(key,path,after){Subs.on(key,()=>Store.subDoc(path,d=>{D[key]=d;LOADED.add(key);if(after)after();render()},e=>dbErr(key,e)))}

}

const activePlayers=()=>D.players.filter(p=>p.status!=='inactive');

const isHeld=s=>!!s&&((s.players&&Object.values(s.players).some(Boolean))||(s.coaches&&Object.values(s.coaches).some(Boolean)));
const coachOn=(s,cid)=>!!(s&&s.coaches&&s.coaches[cid]);
const SESS_DESC={};
function slotsFor(dateStr){const w=wd(dateStr);return D.schedule.filter(s=>Number(s.day)===w)}
function matchDesc(m){const c=byId(D.competitions,m.competitionId);return {id:'m_'+m.id,date:m.date,slotId:null,group:matchGroup(m)||'',start:m.time||'',end:'',pitch:m.venue||'',coachIds:m.coachIds||[],scheduled:true,kind:'match',matchId:m.id,title:`vs ${m.opponent||''}`,comp:c?c.name:''}}
const sessTitle=s=>s&&s.kind==='match'?`Match · ${s.group||''} ${s.title||''}`.trim():`${s.group||''} · ${s.start||''}–${s.end||''}`;

D.matches.filter(m=>m.date===dateStr&&m.status!=='postponed').forEach(m=>list.push(matchDesc(m)));
D.sessions.filter(x=>x.date===dateStr&&!list.some(l=>l.id===x.id)).forEach(x=>list.push({kind:x.kind||null,matchId:x.matchId||null,title:x.title||'',id:x.id,date:x.date,slotId:x.slotId||null,group:x.group,start:x.start,end:x.end,pitch:x.pitch,coachIds:x.coachIds||[],scheduled:false}));
list.forEach(s=>{SESS_DESC[s.id]=s});
return list.sort(by(s=>s.start||''));

function coachMonth(cid){const rows=D.sessions.filter(s=>coachOn(s,cid)).sort(by(s=>s.date+(s.start||''))).map(s=>({s,st:coachStatus(s.id,cid)}));return {rows,total:rows.length,ok:rows.filter(r=>r.st==='confirmed').length,pending:rows.filter(r=>r.st==='pending').length,rejected:rows.filter(r=>r.st==='rejected').length}}
function pendingConfirmCount(){let n=0;D.sessions.forEach(s=>Object.keys(s.coaches||{}).forEach(cid=>{if(s.coaches[cid]&&coachStatus(s.id,cid)==='pending')n++}));return n}
function playerMonth(p){
let expected=0,attended=0,late=0,absent=0,excused=0,extra=0;const rows=[];
D.sessions.filter(s=>s.kind!=='match'&&s.group===p.group&&isHeld(s)).sort(by(s=>s.date)).forEach(s=>{
const st=s.players&&s.players[p.id];const exp=(p.trainingDays||[]).map(Number).includes(wd(s.date));
if(exp||st)rows.push({s,st:st||null,exp});
if(exp){if(st==='E'){excused++;return}expected++;if(st==='P'||st==='L')attended++;if(st==='L')late++;if(st==='A'||!st)absent++}
else if(st==='P'||st==='L')extra++;
});
return {expected,attended,late,absent,excused,extra,rows,rate:pct(attended,expected)};
}
function overallAttendance(){let e=0,a=0;activePlayers().forEach(p=>{const m=playerMonth(p);e+=m.expected;a+=m.attended});return {e,a,rate:pct(a,e)}}
const feeOf=p=>{const b=D.billing[p.id];return b&&b.fee!=null&&b.fee!==''?Number(b.fee):Number(fin().defaultFee||0)};
const paidFor=(pid,m)=>sum(D.payments.filter(x=>x.playerId===pid&&x.month===m),x=>x.amount);
const billable=m=>D.players.filter(p=>(p.status!=='inactive'||D.payments.some(x=>x.playerId===p.id&&x.month===m))&&(!p.joined||monthOf(p.joined)<=m));
function payStatus(p,m){const fee=feeOf(p),paid=paidFor(p.id,m);if(fee<=0)return paid>0?'paid':'free';if(paid>=fee)return 'paid';if(paid>0)return 'partial';return 'unpaid'}

function attPill(st){return st==='P'?'<span class="pill ok">Present</span>':st==='L'?'<span class="pill warn">Late</span>':st==='A'?'<span class="pill bad">Absent</span>':st==='E'?'<span class="pill">Excused</span>':'<span class="pill plain">Not marked</span>'}

/* per-document write queue (one write at a time per document) */
const WQ=new Map();
function queued(path,fn){if(!PLATFORM.serialWrites)return fn();const prev=WQ.get(path)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);WQ.set(path,next);next.finally(()=>{if(WQ.get(path)===next)WQ.delete(path)}).catch(()=>{});return next}
const CREATED=new Set();
function baseSession(s){return {kind:s.kind||null,matchId:s.matchId||null,title:s.title||'',date:s.date,month:monthOf(s.date),slotId:s.slotId||null,group:s.group,start:s.start||'',end:s.end||'',pitch:s.pitch||'',coachIds:s.coachIds||[],players:{},coaches:{},note:'',createdAt:Date.now(),createdBy:S.me.id||null}}
function writeSession(desc,patch){
const path='sessions/'+desc.id;
return queued(path,async()=>{
patch={...patch,updatedAt:Date.now(),updatedBy:S.me.id||null};
if(sessDoc(desc.id)||CREATED.has(desc.id))return W(()=>Store.update(path,patch));
CREATED.add(desc.id);try{await W(()=>Store.set(path,deepMerge(baseSession(desc),patch)))}catch(e){CREATED.delete(desc.id);throw e}
});
}
function writeConfirm(sid,cid,v){
const path='confirmations/'+sid;const desc=SESS_DESC[sid]||sessDoc(sid)||{};
return queued(path,async()=>{
if(D.confirmations[sid]||CREATED.has(path))return W(()=>Store.update(path,{coaches:{[cid]:v},...stamp()}));
CREATED.add(path);try{await W(()=>Store.set(path,{month:monthOf(desc.date||sid.slice(0,10)),coaches:{[cid]:v},...stamp()}))}catch(e){CREATED.delete(path);throw e}
});
}
function canMarkDate(dateStr){if(isMgmt())return true;if(S.role!=='coach')return false;const t=today();return dateStr<=t&&dateStr>=addDays(t,-2)}

}

markAll:d=>{const desc=SESS_DESC[d.s]||sessDoc(d.s);const doc=sessDoc(d.s)||{};const w=wd(desc.date);const patch={};playersInGroup(desc.group).filter(p=>(p.trainingDays||[]).map(Number).includes(w)&&!(doc.players||{})[p.id]).forEach(p=>patch[p.id]='P');writeSession(desc,{players:patch}).then(()=>toast('Marked present')).catch(()=>{})},
coachIn:d=>{if(!d.c)return toast('Your account isn’t linked to a coach profile yet. Ask the owner.',true);const desc=SESS_DESC[d.s]||sessDoc(d.s);writeSession(desc,{coaches:{[d.c]:{at:Date.now(),by:S.me.id||null}}}).then(()=>toast(d.c===myCoachId()?'Checked in':'Coach marked present')).catch(()=>{})},
coachInSel:d=>{const v=$('#addCoachSel')?.value;if(v)ACT.coachIn({s:d.s,c:v})},
coachOut:d=>{const desc=SESS_DESC[d.s]||sessDoc(d.s);writeSession(desc,{coaches:{[d.c]:null}}).catch(()=>{})},
confirmCoach:d=>writeConfirm(d.s,d.c,d.v||null).then(()=>toast(d.v==='ok'?'Confirmed':d.v==='no'?'Rejected':'Cleared')).catch(()=>{}),
saveNote:d=>{const desc=SESS_DESC[d.s]||sessDoc(d.s);writeSession(desc,{note:$('#sessNote').value.trim()}).then(()=>toast('Note saved')).catch(()=>{})},
});

${panel({title:'Sessions',count:fmtMonth(S.month),body:r.rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Session</th><th>Checked in</th><th>Status</th></tr></thead><tbody>${r.rows.map(x=>`<tr class="click" data-act="openSession" data-id="${x.s.id}"><td>${esc(fmtDay(x.s.date))}</td><td>${esc(sessTitle(x.s))}</td><td class="mono small">${fmtTime(x.s.coaches[cid].at)}</td><td>${coachPill(x.st)}</td></tr>`).join('')}</tbody></table></div>`:empty('No sessions yet','Check in from the Attendance page when you start a session.')})}`;

/* ---------- COACHES ---------- */
PAGE_RENDER.coaches=()=>{
const pend=pendingConfirmCount();
const t=tabs('coTab',[['report','Monthly report'],['confirm','Confirmations',pend||null],['list','Coach list',D.coaches.length]],'report');
let body='';
if(t.cur==='report'){
const rows=D.coaches.map(c=>({c,r:coachMonth(c.id),groups:[...new Set(D.sessions.filter(s=>coachOn(s,c.id)).map(s=>s.group))]}));
body=`<div class="toolbar"><span class="muted small">A session counts once administration or the owner confirms the coach’s check-in. Tap a coach to tick their sessions on a calendar.</span>${PLATFORM.canDownload()&&rows.length?`<div class="row"><button class="btn" data-act="coachPdf">${ICON.pdf} PDF report</button><button class="btn" data-act="exportCoaches">${ICON.down} Export CSV</button></div>`:''}</div>
${panel({title:'Sessions given',count:fmtMonth(S.month),body:rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Coach</th><th>Groups</th><th class="r">Confirmed</th><th class="r">Pending</th><th class="r">Rejected</th><th class="r">Check-ins</th></tr></thead><tbody>${rows.map(({c,r,groups})=>`<tr class="click" data-act="openCoach" data-id="${c.id}"><td><div class="cell-name"><span class="av">${esc(initials(c.name))}</span><div><div class="t">${esc(c.name)}</div><div class="s">${esc(c.title||'')}</div></div></div></td><td>${groups.map(g=>`<span class="tag">${esc(g)}</span>`).join(' ')||'<span class="faint">—</span>'}</td><td class="r"><b style="font:600 22px var(--f-display)">${r.ok}</b></td><td class="r">${r.pending||'<span class="faint">0</span>'}</td><td class="r">${r.rejected||'<span class="faint">0</span>'}</td><td class="r">${r.total}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td><td class="r">${sum(rows,x=>x.r.ok)}</td><td class="r">${sum(rows,x=>x.r.pending)}</td><td class="r">${sum(rows,x=>x.r.rejected)}</td><td class="r">${sum(rows,x=>x.r.total)}</td></tr></tfoot></table></div>`:empty('No coaches yet','Add your coaching staff in the Coach list tab.')})}`;
}else if(t.cur==='confirm'){
const q=[];D.sessions.forEach(s=>Object.keys(s.coaches||{}).forEach(cid=>{if(s.coaches[cid])q.push({s,cid,st:coachStatus(s.id,cid),at:s.coaches[cid].at})}));
const f=S.ui.cfFilter||'pending';const list=q.filter(x=>f==='all'||x.st===f).sort(by(x=>x.s.date+(x.s.start||''),-1));
body=`<div class="toolbar">${chips('cfFilter',[['pending','Waiting'],['confirmed','Confirmed'],['rejected','Rejected'],['all','All']],'pending','Status')}${f==='pending'&&list.length?`<button class="btn primary" data-act="confirmAll">${ICON.check} Confirm all ${list.length}</button>`:''}</div>
${panel({title:'Coach check-ins',count:list.length,body:list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Coach</th><th>Session</th><th>Check-in</th><th>Status</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td class="nowrap">${esc(fmtDay(x.s.date))}</td><td class="strong">${esc(coachName(x.cid))}</td><td class="nowrap">${esc(sessTitle(x.s))}</td><td class="mono small">${fmtTime(x.at)}</td><td>${coachPill(x.st)}</td><td class="r nowrap"><button class="btn sm ${x.st==='confirmed'?'primary':''}" data-act="confirmCoach" data-s="${x.s.id}" data-c="${x.cid}" data-v="${x.st==='confirmed'?'':'ok'}">${ICON.check}</button> <button class="btn sm ${x.st==='rejected'?'danger':''}" data-act="confirmCoach" data-s="${x.s.id}" data-c="${x.cid}" data-v="${x.st==='rejected'?'':'no'}">Reject</button></td></tr>`).join('')}</tbody></table></div>`:empty(f==='pending'?'All caught up':'Nothing here',f==='pending'?'No coach check-ins are waiting for confirmation this month.':'No check-ins match this filter.')})}`;
}else{
body=`<div class="toolbar"><span class="muted small">Link each coach to their account in Team & Settings so they can check in.</span><button class="btn primary" data-act="editCoach">${ICON.plus} Add coach</button></div>
${panel({title:'Coaching staff',count:D.coaches.length,body:D.coaches.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Coach</th><th>Phone</th><th>Groups</th><th>Account</th><th></th></tr></thead><tbody>${D.coaches.slice().sort(by(c=>c.name)).map(c=>{const linked=Object.entries(D.members).find(([,m])=>m.coachId===c.id);return `<tr><td><div class="cell-name"><span class="av">${esc(initials(c.name))}</span><div><div class="t">${esc(c.name)}</div><div class="s">${esc(c.title||'')}</div></div></div></td><td class="mono small">${esc(c.phone||'—')}</td><td>${(c.groups||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join(' ')||'<span class="faint">—</span>'}</td><td>${linked?'<span class="pill ok">Linked</span>':'<span class="pill plain">Not linked</span>'}</td><td class="r nowrap"><button class="btn sm" data-act="openCoach" data-id="${c.id}">Sessions</button> <button class="btn sm" data-act="editCoach" data-id="${c.id}">${ICON.edit} Edit</button></td></tr>`}).join('')}</tbody></table></div>`:empty('No coaches yet','Add your coaching staff to assign them to sessions.',`<button class="btn primary" data-act="editCoach">${ICON.plus} Add coach</button>`)})}`;
}
return titleBlock({sec:'Squad · Coaches',title:'Coaches',cells:[['To confirm',pend]]})+t.html+body;
};
DRAWERS.coach={render(d){const c=byId(D.coaches,d.id);if(!c)return null;const r=coachMonth(c.id);
return {head:`<div class="eyebrow">${esc(c.title||'Coach')} · ${fmtMonth(S.month)}</div><h2>${esc(c.name)}</h2><div class="s">${r.ok} confirmed · ${r.pending} pending · ${r.rejected} rejected</div>`,
body:panel({title:'Check-ins',count:r.total,actions:r.pending?`<button class="btn sm primary" data-act="confirmCoachAll" data-c="${c.id}">Confirm ${r.pending} pending</button>`:'',body:r.rows.length?`<div class="list">${r.rows.map(x=>`<div class="li"><div class="grow"><div class="t">${esc(fmtDay(x.s.date))} · ${esc(x.s.group)}</div><div class="s">${esc(x.s.start)}–${esc(x.s.end)} · in at ${fmtTime(x.s.coaches[c.id].at)}</div></div>${coachPill(x.st)}<button class="btn sm" data-act="confirmCoach" data-s="${x.s.id}" data-c="${c.id}" data-v="${x.st==='confirmed'?'':'ok'}">${x.st==='confirmed'?'Undo':'Confirm'}</button></div>`).join('')}</div>`:empty('No check-ins','No sessions recorded for this coach this month.')})}}};
Object.assign(ACT,{
openCoach:d=>openDrawer('coach',d.id),
confirmAll:async()=>{const q=[];D.sessions.forEach(s=>Object.keys(s.coaches||{}).forEach(cid=>{if(s.coaches[cid]&&coachStatus(s.id,cid)==='pending')q.push([s.id,cid])}));for(const[s,c]of q)await writeConfirm(s,c,'ok').catch(()=>{});toast(`Confirmed ${q.length}`)},
confirmCoachAll:async d=>{const r=coachMonth(d.c);for(const x of r.rows.filter(x=>x.st==='pending'))await writeConfirm(x.s.id,d.c,'ok').catch(()=>{});toast('Confirmed')},
editCoach:d=>{const c=d.id?byId(D.coaches,d.id):{};
modal({title:d.id?'Edit coach':'Add coach',body:`${fld('Full name',inp('name',c.name,'text','required'))}<div class="f2">${fld('Title',inp('title',c.title||'','text','placeholder="Head coach, GK coach…"'))}${fld('Phone',inp('phone',c.phone||'','tel'))}</div>${fld('Groups',`<div class="dpick">${cfg().groups.map((g,i)=>`<input type="checkbox" data-multi name="groups" id="f_cg_${i}" value="${esc(g)}" ${(c.groups||[]).includes(g)?'checked':''}><label for="f_cg_${i}" style="width:auto;padding:0 10px">${esc(g)}</label>`).join('')}</div>`)}`,
extra:d.id?`<button type="button" class="btn danger" data-act="delCoach" data-id="${d.id}">Remove</button>`:'',
onSubmit:async f=>{if(!f.name)return 'Enter the coach’s name.';const o={name:f.name,title:f.title,phone:f.phone,groups:f.groups||[],updatedAt:Date.now()};if(d.id)await W(()=>Store.update('coaches/'+d.id,o),'Coach updated');else await W(()=>Store.add('coaches',{...o,createdAt:Date.now()}),'Coach added')}});
},
delCoach:d=>{$$('.scrim').pop()?.remove();confirmBox('Remove coach',`Remove ${esc(coachName(d.id))}? Their past check-ins stay in the records.`,'Remove',()=>W(()=>Store.del('coaches/'+d.id),'Coach removed'))},
exportCoaches:()=>{const rows=[['Coach','Title','Confirmed sessions','Pending','Rejected','Check-ins','Month']];D.coaches.forEach(c=>{const r=coachMonth(c.id);rows.push([c.name,c.title||'',r.ok,r.pending,r.rejected,r.total,S.month])});saveCsv(`coach-sessions-${S.month}.csv`,rows)},
});
function saveCsv(name,rows){if(!PLATFORM.canDownload())return toast('Downloads aren’t available here.',true);const csv='\ufeff'+rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');Promise.resolve(PLATFORM.download(name,csv)).then(()=>toast('Saved')).catch(e=>{if(e&&e.code!=='declined')toast('Couldn’t save the file.',true)})}

PAGE_RENDER.players=()=>{
const q=(S.ui.pq||'').toLowerCase(),g=S.ui.pg||'',st=S.ui.pst||'active';
let ps=D.players.filter(p=>(st==='all'||(st==='active'?p.status!=='inactive':p.status==='inactive'))&&(!g||p.group===g)&&(!q||(p.name+' '+(p.parentName||'')).toLowerCase().includes(q))).sort(by(p=>p.group+'|'+p.name));
const counts=cfg().groups.map(x=>[x,playersInGroup(x).length]);
return titleBlock({sec:'Squad · Players',title:'Players',cells:[['Registered',activePlayers().length],['Groups',cfg().groups.length]]})+
`<div class="toolbar"><div class="row" style="flex:1"><label class="search"><span class="sr">Search players</span>${ICON.search}<input class="input" id="pSearch" placeholder="Search name or parent" value="${esc(S.ui.pq||'')}" data-input="ui" data-k="pq"></label>${chips('pst',[['active','Active'],['inactive','Left'],['all','All']],'active','Status')}</div><button class="btn primary" data-act="editPlayer">${ICON.plus} Add player</button></div>
${chips('pg',[['','All groups'],...counts.map(([x,n])=>[x,`${x} · ${n}`])],'','Group')}
${panel({title:'Roster',count:ps.length,body:ps.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Player</th><th>Group</th><th class="c">No.</th><th>Training days</th><th>Attendance</th><th>${esc(fmtMonthName(S.month))}</th><th>Parent</th></tr></thead><tbody>${ps.map(p=>{const a=playerMonth(p);return `<tr class="click" data-act="openPlayer" data-id="${p.id}"><td><div class="cell-name">${avatar(p)}<div><div class="t">${esc(p.name)}</div><div class="s">${esc(p.position||'')}${ageOf(p.dob)!=null?' · '+ageOf(p.dob)+' yrs':''}</div></div></div></td><td>${esc(p.group)}</td><td class="c mono">${esc(p.number||'—')}</td><td>${daysMatrix(p.trainingDays)}</td><td class="nowrap">${a.expected?`<span class="tnum">${a.attended}/${a.expected}</span> <span class="muted small">· ${a.rate}%</span>`:'<span class="faint">—</span>'}</td><td>${p.status==='inactive'?'<span class="pill plain">Left</span>':payPill(payStatus(p,S.month))}</td><td><div class="s" style="font-size:13px">${esc(p.parentName||'')}</div><div class="mono small muted">${esc(p.parentPhone||'')}</div></td></tr>`}).join('')}</tbody></table></div>`:empty(D.players.length?'No matches':'No players yet',D.players.length?'Try another search or group.':'Add your first player to start taking attendance and tracking payments.',D.players.length?'':`<button class="btn primary" data-act="editPlayer">${ICON.plus} Add player</button>`)})}`;
};
ACT.openPlayer=d=>openDrawer('player',d.id,{tab:d.tab||'overview'});
ACT.editPlayer=d=>{
const p=d.id?byId(D.players,d.id):{status:'active',joined:today(),group:cfg().groups[0],trainingDays:[]};
const fee=d.id&&D.billing[d.id]&&D.billing[d.id].fee!=null?D.billing[d.id].fee:'';
modal({title:d.id?'Edit player':'Add player',wide:true,body:`
<div class="f2">${fld('Full name',inp('name',p.name,'text','required'))}${fld('Date of birth',inp('dob',p.dob,'date'))}</div>
<div class="f3">${fld('Group',sel('group',cfg().groups,p.group))}${fld('Position',sel('position',['',...POSITIONS],p.position||''))}${fld('Shirt number',inp('number',p.number||'','text','inputmode="numeric" maxlength="3"'))}</div>
${fld('Training days',dayPick('trainingDays',(p.trainingDays||[]).map(Number)),'Attendance rate is measured against these days.')}
<div class="f2">${fld('Parent / guardian',inp('parentName',p.parentName||''))}${fld('Parent phone',inp('parentPhone',p.parentPhone||'','tel'))}</div>
<div class="f3">${fld('Joined',inp('joined',p.joined||'','date'))}${fld('Monthly fee ('+esc(fin().currency)+')',inp('fee',fee,'number','min="0" step="1" placeholder="'+esc(fin().defaultFee)+' default"'),'Leave blank for the default. 0 = scholarship.')}${fld('Status',sel('status',[['active','Active'],['inactive','Left the academy']],p.status||'active'))}</div>
${fld('Notes',`<textarea name="notes" id="f_notes" placeholder="Medical notes, kit size…">${esc(p.notes||'')}</textarea>`)}`,
extra:d.id?`<button type="button" class="btn danger" data-act="delPlayer" data-id="${d.id}">Delete</button>`:'',
onSubmit:async f=>{if(!f.name)return 'Enter the player’s name.';
const o={name:f.name,dob:f.dob,group:f.group,position:f.position,number:f.number,trainingDays:(f.trainingDays||[]).map(Number),parentName:f.parentName,parentPhone:f.parentPhone,joined:f.joined,status:f.status,notes:f.notes,updatedAt:Date.now()};
let id=d.id;
if(id)await W(()=>Store.update('players/'+id,o),'Player updated');else{id=Store.newId('players');await W(()=>Store.set('players/'+id,{...o,createdAt:Date.now()}),'Player added')}
const had=D.billing[id];
if(f.fee!==''||had)await W(()=>Store.set('billing/'+id,{fee:f.fee===''?null:num(f.fee),updatedAt:Date.now()}));
}});
};
ACT.delPlayer=d=>{$$('.scrim').pop()?.remove();confirmBox('Delete player',`Delete ${esc(playerName(d.id))} for good? To keep their history, edit the player and set status to “Left the academy” instead.`,'Delete',async()=>{await W(()=>Store.del('players/'+d.id),'Player deleted');closeDrawer()})};

DRAWERS.player={
open(d){Subs.on('progress',()=>Store.subCol('progress',{where:[['playerId','==',d.id]]},r=>{D.progress=r;render()}));Subs.on('ratings',()=>Store.subCol('ratings',{where:[['playerId','==',d.id]]},r=>{D.ratings=r;render()}));Subs.on('playerPayments',()=>Store.subCol('payments',{where:[['playerId','==',d.id]]},r=>{D.playerPayments=r;render()}))},
close(){['progress','ratings','playerPayments'].forEach(k=>{Subs.off(k);D[k]=[]})},
render(d){
const p=byId(D.players,d.id);if(!p)return null;
const tab=d.tab||'overview';const a=playerMonth(p);
const tb=`<div class="tabs" role="tablist" style="margin:-4px 0 0">${[['overview','Profile'],['attendance','Attendance'],['payments','Payments'],['progress','Progress']].map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-act="pTab" data-v="${k}">${l}</button>`).join('')}</div>`;
let body='';
if(tab==='overview'){
body=`<div class="kv">
<div><span class="k">Group</span><span class="v big">${esc(p.group)}</span></div>
<div><span class="k">Shirt</span><span class="v big">${esc(p.number||'—')}</span></div>
<div><span class="k">Attendance · ${esc(fmtMonthName(S.month))}</span><span class="v big">${a.rate==null?'—':a.rate+'%'}</span></div>
<div><span class="k">${esc(fmtMonthName(S.month))} fee</span><span class="v">${payPill(payStatus(p,S.month))} <span class="muted small">${money(paidFor(p.id,S.month))} / ${money(feeOf(p))}</span></span></div>
<div><span class="k">Position</span><span class="v">${esc(p.position||'—')}</span></div>
<div><span class="k">Date of birth</span><span class="v">${p.dob?esc(fmtDateY(p.dob))+` · ${ageOf(p.dob)} yrs`:'—'}</span></div>
<div><span class="k">Joined</span><span class="v">${esc(fmtDateY(p.joined)||'—')}</span></div>
<div><span class="k">Training days</span><span class="v">${daysMatrix(p.trainingDays)}</span></div>
<div><span class="k">Parent</span><span class="v">${esc(p.parentName||'—')}</span></div>
<div><span class="k">Phone</span><span class="v mono" style="user-select:all">${esc(p.parentPhone||'—')}</span></div>
</div>${p.notes?`<div class="callout"><h4>Notes</h4><p style="white-space:pre-wrap">${esc(p.notes)}</p></div>`:''}`;
}else if(tab==='attendance'){
body=`<div class="kpis">${kpi('Attended',`${a.attended}<small>/ ${a.expected}</small>`,'On training days',a.expected?a.attended/a.expected:0,rateTone(a.rate))}${kpi('Late',a.late,'')}${kpi('Absent',a.absent,'')}${kpi('Extra',a.extra,'Sessions off-schedule')}</div>
${panel({title:'Sessions',count:fmtMonth(S.month),body:a.rows.length?`<div class="list">${a.rows.map(r=>`<div class="li"><div class="grow"><div class="t">${esc(fmtDay(r.s.date))}</div><div class="s">${esc(r.s.start)}–${esc(r.s.end)}${r.exp?'':' · not a training day'}</div></div>${attPill(r.st)}</div>`).join('')}</div>`:empty('No sessions yet',`No ${esc(p.group)} sessions recorded in ${esc(fmtMonth(S.month))}.`)})}`;
}else if(tab==='payments'){
const pays=D.playerPayments.slice().sort(by(x=>x.month+(x.date||''),-1));
body=`<div class="between"><span class="muted small">Monthly fee ${money(feeOf(p))}${feeOf(p)<=0?' · scholarship':''}</span><button class="btn primary" data-act="recordPay" data-p="${p.id}">${ICON.plus} Record payment</button></div>
${panel({title:'Payment history',count:pays.length,body:pays.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>For month</th><th>Paid on</th><th>Method</th><th class="r">Amount</th><th></th></tr></thead><tbody>${pays.map(x=>`<tr class="click" data-act="editPay" data-id="${x.id}"><td class="strong">${esc(fmtMonth(x.month))}</td><td>${esc(fmtDateY(x.date))}</td><td>${esc(x.method||'')}</td><td class="r">${money(x.amount)}</td><td class="r nowrap"><button class="btn sm" data-act="openInvoice" data-kind="pay" data-id="${x.id}" data-pid="${p.id}">Invoice</button> <button class="btn sm" data-act="editPay" data-id="${x.id}" aria-label="Edit or delete this payment">${ICON.edit} Edit</button></td></tr>`).join('')}</tbody></table></div>`:empty('No payments yet','Record the first monthly payment for this player.'),foot:pays.length?'Tap a payment to change or delete it.':''})}`;

}

function pickPhoto(pid){

const i=document.createElement('input');i.type='file';i.accept='image/*';
i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;toast('Uploading photo…');

function shrinkImage(file,max){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Couldn’t read that image.')),'image/jpeg',.86)};img.onerror=()=>rej(new Error('That file isn’t an image.'));img.src=u})}

function radarSVG(cur,prev){
const n=SKILLS.length,cx=170,cy=150,R=108;
const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/10,cy+Math.sin(a)*R*v/10]};
const poly=sc=>SKILLS.map(([k],i)=>pt(i,num(sc&&sc[k])).map(x=>x.toFixed(1)).join(',')).join(' ');
let g='';[2,4,6,8,10].forEach(l=>{g+=`<polygon points="${SKILLS.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
SKILLS.forEach((_,i)=>{const[x,y]=pt(i,10);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line-2)"/>`});
const labels=SKILLS.map(([,l],i)=>{const[x,y]=pt(i,12.4);return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1" fill="var(--muted)">${l.toUpperCase()}</text>`}).join('');
return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Skill rating chart">${g}${prev?`<polygon points="${poly(prev)}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>`:''}${cur?`<polygon points="${poly(cur)}" fill="var(--accent-soft)" stroke="var(--fg)" stroke-width="1.6"/>${SKILLS.map(([k],i)=>{const[x,y]=pt(i,num(cur[k]));return `<rect x="${(x-2.5).toFixed(1)}" y="${(y-2.5).toFixed(1)}" width="5" height="5" fill="var(--fg)"/>`}).join('')}`:''}${labels}</svg>`;
}
const avgScore=sc=>sc?Math.round(sum(SKILLS,([k])=>num(sc[k]))/SKILLS.length*10)/10:null;

/* ---------- match helpers ---------- */
/* A competition holds age categories (teams), each with its own squad, coaches, matches and result.
Older competitions saved with a single age group show as one category until it is edited. */
function compTeams(c){if(!c)return [];if(Array.isArray(c.teams)&&c.teams.length)return c.teams;return c.group?[{id:'g_'+c.group,group:c.group,name:'',playerIds:[],coachIds:[],fee:null,placement:c.placement||'',notes:'',_legacy:true}]:[]}
const teamLabel=t=>t?(t.name||t.group||'Team'):'';
function teamOfMatch(c,m){const ts=compTeams(c);if(!ts.length)return null;return (m.teamId&&ts.find(t=>t.id===m.teamId))||ts.find(t=>t.group===(m.group||(c&&c.group)||''))||(ts.length===1?ts[0]:null)}
const matchTeam=m=>teamOfMatch(byId(D.competitions,m.competitionId),m);
const matchGroup=m=>{const t=matchTeam(m);return t?t.group:(m.group||(byId(D.competitions,m.competitionId)||{}).group||'')};
const matchLabel=m=>{const t=matchTeam(m);return t?teamLabel(t):matchGroup(m)};
const inTeam=(m,tid)=>(matchTeam(m)||{}).id===tid;
function matchResult(m){if(m.status!=='ft')return null;const a=num(m.ourScore),b=num(m.theirScore);return a>b?'W':a<b?'L':'D'}
function compRecord(cid,tid){let w=0,dr=0,l=0,gf=0,ga=0;const ms=D.matches.filter(m=>m.competitionId===cid&&m.status==='ft'&&(!tid||inTeam(m,tid)));ms.forEach(m=>{const a=num(m.ourScore),b=num(m.theirScore);gf+=a;ga+=b;if(a>b)w++;else if(a<b)l++;else dr++});return {p:ms.length,w,d:dr,l,gf,ga}}
function upcomingMatches(group){const t=today();return D.matches.filter(m=>(!group||matchGroup(m)===group)&&(m.status==='live'||(m.status==='scheduled'&&m.date>=t))).sort(by(m=>(m.status==='live'?'0':'1')+m.date+(m.time||'')))}
function compState(c){if(c.status)return c.status;const t=today();if(c.end&&c.end<t)return 'finished';if(c.start&&c.start>t)return 'upcoming';return 'ongoing'}
const COMP_PILL={upcoming:['','Upcoming'],ongoing:['ok','Ongoing'],finished:['plain','Finished']};
const compCats=c=>compTeams(c).map(teamLabel).join(' · ');
function compPlacements(c,g){const ts=compTeams(c).filter(t=>t.placement&&(!g||t.group===g));return ts.length?ts.map(t=>compTeams(c).length>1?`${teamLabel(t)} ${t.placement}`:t.placement).join(' · '):''}
function teamPaid(cid,tid,pid){return sum(D.compPayments.filter(p=>p.competitionId===cid&&p.playerId===pid&&p.direction!=='out'&&(!p.teamId||p.teamId===tid)),p=>p.amount)}
function fixtureRow(m,o={}){
const comp=byId(D.competitions,m.competitionId);const us=cfg().short;const home=m.homeAway!=='away';
const L=home?us:m.opponent,R=home?m.opponent:us;
const played=m.status==='ft'||m.status==='live';
const score=played?(home?`${num(m.ourScore)} – ${num(m.theirScore)}`:`${num(m.theirScore)} – ${num(m.ourScore)}`):m.status==='postponed'?'Postponed':esc(m.time||'TBC');
const res=matchResult(m),lab=matchLabel(m);
return `<div class="fixture ${o.click?'click':''}" ${o.click?`data-act="editMatch" data-id="${m.id}"`:''}>
<div class="when">${esc(fmtDay(m.date))}${o.comp!==false&&comp?`<br>${esc(comp.name)}`:''}${m.round?`<br>${esc(m.round)}`:''}</div>
<div class="team home" ${home?'style="font-weight:700"':''}>${esc(L)}</div>
<div class="score ${played?'':'pending'}">${score}</div>
<div class="team" ${!home?'style="font-weight:700"':''}>${esc(R)}</div>
<div class="after">${lab&&o.cat!==false?`<span class="tag">${esc(lab)}</span>`:''}${m.status==='live'?'<span class="pill live">Live</span>':res?`<span class="res ${res}" title="${{W:'Win',D:'Draw',L:'Loss'}[res]}">${res}</span>`:''}</div>${o.note&&m.notes?`<div class="fnote">${esc(m.notes)}</div>`:''}${o.coaches&&(m.coachIds||[]).length?`<div class="fcoach">Coach: ${esc(m.coachIds.map(coachName).join(', '))}</div>`:''}</div>`;
}

<div class="comp-cats">${ts.length?ts.map(t=>`<span class="cat-chip">${esc(teamLabel(t))}<i>${(t.playerIds||[]).length||''}</i></span>`).join(''):'<span class="muted small">No categories yet</span>'}</div>
<div class="rec"><span><b>${r.w}</b>Won</span><span><b>${r.d}</b>Drawn</span><span><b>${r.l}</b>Lost</span><span><b>${r.gf}:${r.ga}</b>Goals</span></div>

async function saveTeams(c,teams,msg){

await W(()=>Store.update('competitions/'+c.id,{teams:clean,group:clean[0]?clean[0].group:'',updatedAt:Date.now()}),msg);
}
async function saveTeam(c,t,msg){const ts=compTeams(byId(D.competitions,c.id)||c);const i=ts.findIndex(x=>x.id===t.id);await saveTeams(c,i<0?[...ts,t]:ts.map(x=>x.id===t.id?t:x),msg)}

openComp:d=>{S.ui.compId=d.id;S.ui.cdTab='cats';S.ui.cf='';render();window.scrollTo(0,0)},

PAGE_RENDER.matches=()=>{

const comps=D.competitions.filter(c=>!g||compTeams(c).some(t=>t.group===g)).sort(by(c=>({ongoing:0,upcoming:1,finished:2}[compState(c)])+(c.start||'')));
const lastWinner=D.potm.filter(x=>x.status==='closed'&&x.winner).sort(by(x=>x.id,-1))[0];
let hero='';
if(next){const comp=byId(D.competitions,next.competitionId);const home=next.homeAway!=='away';const us=`<div class="side"><img class="only-light" src="${IMG.crestN}" alt=""><img class="only-dark" src="${IMG.crestW}" alt=""><div class="nm">${esc(cfg().short)}</div></div>`;const them=`<div class="side"><div class="crestbox">${esc(initials(next.opponent))}</div><div class="nm">${esc(next.opponent)}</div></div>`;
const live=next.status==='live';const days=Math.round((parseD(next.date)-parseD(today()))/864e5);
hero=`<section class="nextmatch">${home?us:them}<div class="mid"><span class="kick">${live?'<span class="pill live">Live</span>':days===0?'Today':days===1?'Tomorrow':`In ${days} days`}</span><div class="big">${live?(home?`${num(next.ourScore)}–${num(next.theirScore)}`:`${num(next.theirScore)}–${num(next.ourScore)}`):esc(next.time||'TBC')}</div><span class="kick">${esc(fmtDay(next.date))}${next.venue?' · '+esc(next.venue):''}</span><span class="tag">${esc(comp?comp.name:'')}${next.round?' · '+esc(next.round):''} · ${esc(matchLabel(next))}</span></div>${home?them:us}</section>`}
return titleBlock({sec:'Competition · Match centre',title:'Match centre',month:false,note:'Fixtures, live scores and results for every Atelier XI team.',cells:[['Upcoming',up.length]]})+
`${chips('mg',groupOpts(true),'','Age group')}
${hero||`<div class="panel">${empty('No upcoming matches','New fixtures appear here as soon as the academy adds them.')}</div>`}

${panel({title:'Latest results',count:results.length,body:results.length?results.map(m=>fixtureRow(m,{note:true})).join(''):`<div class="empty" style="padding:22px"><p>No results yet.</p></div>`})}
</div><div class="grid">
${lastWinner?potmWinnerMini(lastWinner):''}
${panel({title:'Competitions',count:comps.length,body:comps.length?`<div class="list">${comps.map(c=>{const ts=compTeams(c).filter(t=>!g||t.group===g);const st=compState(c);
return `<div class="li" style="align-items:flex-start"><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.kind||'')}${c.location?' · '+esc(c.location):''}</div>
${ts.length?`<div class="mc-cats">${ts.map(t=>{const r=compRecord(c.id,t.id);return `<div><span class="tag">${esc(teamLabel(t))}</span><span class="mono small muted">${r.w}W ${r.d}D ${r.l}L</span>${t.placement?`<b class="small">${esc(t.placement)}</b>`:''}</div>`}).join('')}</div>`:''}</div><span class="pill ${COMP_PILL[st][0]}">${COMP_PILL[st][1]}</span></div>`}).join('')}</div>`:`<div class="empty" style="padding:22px"><p>No competitions yet.</p></div>`})}
</div></div>`;

/* ---------- PLAYER OF THE MONTH ---------- */
const potmDoc=m=>D.potm.find(x=>x.id===m)||null;
const currentPotm=()=>potmDoc(monthOf(today()));
function myVote(m){const v=D.potmVotes.find(x=>x.id===S.me.id);return v&&v.votes?v.votes[m]||null:null}
function tally(m){const t={};D.potmVotes.forEach(v=>{const p=v.votes&&v.votes[m];if(p)t[p]=(t[p]||0)+1});return t}
function pPhoto(p,cls){const u=photoUrl(p);return u?`<img src="${esc(u)}" alt="${esc(p.name)}" loading="lazy">`:`<span class="mono-l">${esc(initials(p.name))}</span>`}
function potmPlayer(id){const p=byId(D.players,id);if(p)return p;const d=D.potm.find(x=>x.info&&x.info[id]);if(d)return {id,...d.info[id]};return {id,name:(D.potm.find(x=>x.winner===id)||{}).winnerName||'Player',group:''}}
const potmInfo=ids=>Object.fromEntries(ids.map(id=>{const p=byId(D.players,id)||{};return [id,{name:p.name||'',group:p.group||'',position:p.position||'',number:p.number||'',photo:p.photo||null,photoUrl:p.photoUrl||null,photoData:p.photoData||null}]}));
function potmMini(pm){
const t=tally(pm.id);const lead=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];
if(pm.status==='closed'&&pm.winner)return potmWinnerMini(pm);
return panel({title:'Player of the month',count:fmtMonthName(pm.id),actions:`<button class="btn sm" data-act="go" data-r="potm">${myVote(pm.id)?'View':'Vote'}</button>`,body:`<div class="list"><div class="li"><div class="grow"><div class="t">Voting open · ${(pm.nominees||[]).length} nominees</div><div class="s">${sum(Object.values(t))} vote${sum(Object.values(t))===1?'':'s'} so far${isMgmt()&&lead?` · leading: ${esc(potmPlayer(lead[0]).name)}`:''}</div></div></div></div>`});
}
function potmWinnerMini(pm){const p=potmPlayer(pm.winner);return `<section class="panel"><div class="panel-h"><h2>Player of the month<span class="c">${esc(fmtMonth(pm.id))}</span></h2></div><div class="winner-band" style="border:0"><div class="ph" style="width:84px">${pPhoto(p)}</div><div style="min-width:0"><div class="eyebrow">${esc(p.group||'')}${p.position?' · '+esc(p.position):''}</div><div class="nm" style="font-size:26px;margin-top:6px">${esc(p.name)}</div>${pm.citation?`<p class="muted small" style="margin:6px 0 0">${esc(pm.citation)}</p>`:''}</div></div></section>`}
PAGE_RENDER.potm=()=>{
const m=S.month;const pm=potmDoc(m);const staff=isStaffR(S.role);const mg=isMgmt();
const hall=D.potm.filter(x=>x.status==='closed'&&x.winner).sort(by(x=>x.id,-1));
let body='';
if(!pm){
body=`<div class="panel">${empty('Voting not open',mg?`Pick the nominees for ${esc(fmtMonth(m))} to open voting. Coaches, administration and the owner each get one vote.`:`Nominees for ${esc(fmtMonth(m))} haven’t been announced yet.`,mg?`<button class="btn primary" data-act="potmNominate">${ICON.plus} Choose nominees</button>`:'')}</div>`;
}else{
const t=tally(m);const total=sum(Object.values(t));const max=Math.max(1,...Object.values(t));const mine=myVote(m);const closed=pm.status==='closed';
const showTally=mg||closed;
const noms=(pm.nominees||[]).map(potmPlayer).sort(by(p=>closed?-(t[p.id]||0):0));
if(closed&&pm.winner){const w=potmPlayer(pm.winner);body+=`<section class="winner-band"><div class="ph">${pPhoto(w)}</div><div style="min-width:0;display:grid;gap:8px"><span class="pill solid plain">Player of the month · ${esc(fmtMonth(m))}</span><div class="nm">${esc(w.name)}</div><div class="muted">${esc(w.group||'')}${w.position?' · '+esc(w.position):''}${w.number?' · #'+esc(w.number):''}${showTally?` · ${t[w.id]||0} of ${total} votes`:''}</div>${pm.citation?`<p style="margin:0;max-width:60ch;color:var(--fg-2)">${esc(pm.citation)}</p>`:''}</div></section>`}
body+=`<div class="toolbar"><span class="muted small">${closed?'Voting closed.':staff?(mine?`You voted for ${esc(potmPlayer(mine).name)}. You can change it until voting closes.`:'Tap a player to cast your vote. One vote per staff member.'):'Staff are voting. The winner is announced here at the end of the month.'}${!closed&&mg?` · ${total} vote${total===1?'':'s'} cast`:''}</span>${mg?`<div class="row">${closed?`<button class="btn" data-act="potmReopen">Reopen voting</button>`:`<button class="btn" data-act="potmNominate">Edit nominees</button><button class="btn primary" data-act="potmClose" ${total?'':'disabled'}>Close & announce winner</button>`}</div>`:''}</div>
<div class="potm-grid">${noms.map(p=>{const v=t[p.id]||0;return `<article class="pcard ${!closed&&mine===p.id?'voted':''} ${closed&&pm.winner===p.id?'winner':''}"><div class="ph">${pPhoto(p)}${p.number?`<span class="no">${esc(p.number)}</span>`:''}${mg&&PLATFORM.canPhoto()&&D.players.some(x=>x.id===p.id)?`<button class="btn sm addph" data-act="photo" data-id="${p.id}" aria-label="Add photo for ${esc(p.name)}">${ICON.cam}</button>`:''}</div><div class="bd"><div class="nm">${esc(p.name)}</div><div class="s">${esc(p.group||'')}${p.position?' · '+esc(p.position):''}</div>${showTally?`<div class="tally"><span class="bar"><i style="--p:${v/max}"></i></span><span>${v}</span></div>`:''}${staff&&!closed?`<button class="btn sm ${mine===p.id?'primary':''}" data-act="potmVote" data-p="${p.id}">${mine===p.id?ICON.check+' Your vote':'Vote'}</button>`:''}</div></article>`}).join('')}</div>`;
}
body+=hall.length?panel({title:'Past winners',count:hall.length,body:`<div class="hall">${hall.map(h=>{const p=potmPlayer(h.winner);return `<div>${avatar(p)}<div style="min-width:0"><div class="t" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div><div class="mono small muted">${esc(fmtMonthShort(h.id))}</div></div></div>`}).join('')}</div>`}):'';
return titleBlock({sec:'Squad · Player of the month',title:'Player of the month',note:mg&&PLATFORM.canPhoto()?'Add player photos from each card or from the player’s profile.':'',cells:[['Status',pm?(pm.status==='closed'?'Closed':'Voting'):'Not open']]})+body;
};
Object.assign(ACT,{
potmNominate:()=>{const m=S.month;const pm=potmDoc(m);const cur=new Set(pm?pm.nominees||[]:[]);
const groups=cfg().groups.map(g=>[g,playersInGroup(g)]).filter(([,ps])=>ps.length);
modal({title:'Nominees · '+fmtMonthName(m),wide:true,body:`<p class="muted small" style="margin:0">Choose two to eight players. Photos show on the voting cards when added.</p>${groups.map(([g,ps])=>fld(g,`<div class="cpick" style="max-height:none">${ps.map(p=>`<input type="checkbox" data-multi name="nominees" id="f_n_${p.id}" value="${p.id}" ${cur.has(p.id)?'checked':''}><label for="f_n_${p.id}">${esc(p.name)} <span class="muted small">${esc(p.position||'')}</span></label>`).join('')}</div>`)).join('')||'<p class="muted">Add players first.</p>'}`,
submit:pm?'Save nominees':'Open voting',onSubmit:async f=>{const n=f.nominees||[];if(n.length<2)return 'Pick at least two players.';if(n.length>8)return 'Pick eight players at most.';
if(pm)await W(()=>Store.update('potm/'+m,{nominees:n,info:potmInfo(n),updatedAt:Date.now()}),'Nominees saved');else await W(()=>Store.set('potm/'+m,{month:m,nominees:n,info:potmInfo(n),status:'open',winner:null,citation:'',openedAt:Date.now(),by:S.me.id||null}),'Voting is open')}});
},
potmVote:d=>{if(!S.me.id)return toast('Sign in to vote.',true);const m=S.month;const cur=D.potmVotes.find(x=>x.id===S.me.id);const votes={...((cur&&cur.votes)||{}),[m]:d.p};
queued('potmVotes/'+S.me.id,()=>W(()=>Store.set('potmVotes/'+S.me.id,{votes,at:Date.now()}),'Vote saved')).catch(()=>{})},
potmClose:()=>{const m=S.month;const pm=potmDoc(m);const t=tally(m);const noms=(pm.nominees||[]).slice().sort((a,b)=>(t[b]||0)-(t[a]||0));
modal({title:'Announce winner',body:`${fld('Winner',`<div class="cpick">${noms.map((id,i)=>`<input type="radio" name="winner" id="f_w_${id}" value="${id}" ${i===0?'checked':''}><label for="f_w_${id}">${esc(potmPlayer(id).name)} <span class="muted small">· ${t[id]||0} vote${(t[id]||0)===1?'':'s'}</span></label>`).join('')}</div>`,'The most-voted player is selected. Change it to break a tie.')}${fld('Citation (optional)',`<textarea name="citation" id="f_citation" placeholder="Why they earned it — shown to parents">${esc(pm.citation||'')}</textarea>`)}`,
submit:'Announce',onSubmit:async f=>{if(!f.winner)return 'Choose the winner.';const p=byId(D.players,f.winner);await W(()=>Store.update('potm/'+m,{status:'closed',winner:f.winner,winnerName:p?p.name:'',citation:f.citation,closedAt:Date.now()}),'Winner announced')}});
},
potmReopen:()=>W(()=>Store.update('potm/'+S.month,{status:'open',winner:null}),'Voting reopened').catch(()=>{}),
});

const taskDone=t=>!!(D.taskStatus[t.id]&&D.taskStatus[t.id].done);
function myOpenTasks(){return D.tasks.filter(t=>t.assignee===S.me.id&&!taskDone(t))}
PAGE_RENDER.tasks=()=>{
const owner=S.role==='owner';const f=S.ui.tkf||'open';const t0=today();
let list=owner?D.tasks.slice():D.tasks.filter(t=>t.assignee===S.me.id);
const who=S.ui.tka||'';if(owner&&who)list=list.filter(t=>t.assignee===who);
list=list.filter(t=>f==='all'||(f==='open'?!taskDone(t):taskDone(t))).sort(by(t=>(taskDone(t)?'1':'0')+(t.due||'9999')));
const staffIds=Object.entries(D.members).filter(([,m])=>m.role==='admin'||m.role==='coach').map(([id])=>id);
if(owner)resolveNames(staffIds);
return titleBlock({sec:'Academy · Tasks',title:owner?'Tasks':'My tasks',month:false,note:owner?'Only the owner assigns tasks. Staff see and complete their own.':'Tasks the owner has assigned to you.',cells:[['Open',(owner?D.tasks:D.tasks.filter(t=>t.assignee===S.me.id)).filter(t=>!taskDone(t)).length]]})+
`<div class="toolbar"><div class="row">${chips('tkf',[['open','Open'],['done','Done'],['all','All']],'open','Status')}${owner&&staffIds.length?`<select class="input" style="width:auto;height:28px" id="tkaSel" data-change="tka" aria-label="Assignee"><option value="">Everyone</option>${staffIds.map(id=>`<option value="${esc(id)}" ${who===id?'selected':''}>${esc(personName(id))}</option>`).join('')}</select>`:''}</div>${owner?`<button class="btn primary" data-act="editTask">${ICON.plus} Assign task</button>`:''}</div>
${panel({title:'Tasks',count:list.length,body:list.length?`<div class="list">${list.map(t=>{const done=taskDone(t);const late=!done&&t.due&&t.due<t0;return `<div class="li"><button class="btn sm ${done?'primary':''}" style="width:34px;padding:0" data-act="toggleTask" data-id="${t.id}" aria-pressed="${done}" aria-label="${done?'Mark not done':'Mark done'}">${done?ICON.check:''}</button><div class="grow"><div class="t" style="${done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</div>${t.detail?`<div class="s" style="white-space:pre-wrap">${esc(t.detail)}</div>`:''}<div class="row small" style="margin-top:6px">${owner?`<span class="tag">${esc(personName(t.assignee))}</span>`:''}${t.priority==='high'?'<span class="pill bad plain">High priority</span>':''}${t.due?`<span class="mono ${late?'':'muted'}" style="${late?'color:var(--bad)':''}">Due ${esc(fmtDate(t.due))}</span>`:''}${done&&D.taskStatus[t.id].at?`<span class="muted">Done ${esc(fmtDate(ds(new Date(D.taskStatus[t.id].at))))}</span>`:''}</div></div>${owner?`<button class="btn sm ghost" data-act="editTask" data-id="${t.id}" aria-label="Edit">${ICON.edit}</button>`:''}</div>`}).join('')}</div>`:empty(f==='open'?'Nothing open':'No tasks',owner?(staffIds.length?'Assign work to administration or coaches. They’ll see it under My tasks.':'Approve staff in Team & Settings first, then assign them tasks.'):'You have no tasks right now.')})}`;
};
CHANGE.tka=v=>{S.ui.tka=v;render()};

toggleTask:d=>{const done=!taskDone({id:d.id});queued('taskStatus/'+d.id,()=>W(()=>Store.set('taskStatus/'+d.id,{done,...stamp()}),done?'Marked done':'Reopened')).catch(()=>{})},
editTask:d=>{const t=d.id?byId(D.tasks,d.id):{priority:'normal'};const staffIds=Object.entries(D.members).filter(([,m])=>m.role==='admin'||m.role==='coach').map(([id,m])=>[id,`${personName(id)} · ${ROLE_LABEL[m.role]}`]);

});

/* ============================================================
ATELIER XI — Money in & out: expenses, coach pay, profit
============================================================ */
const EXP_CATS=['Coach pay','Pitch rental','Equipment','Kit stock','Transport','Marketing','Utilities','Other'];
const coachRate=cid=>(((D.finance||{}).coachRates)||{})[cid]||null;
const expIn=m=>D.expenses.filter(x=>x.month===m);
const compInM=m=>sum(D.compPayments.filter(x=>monthOf(x.date)===m&&x.direction!=='out'),x=>x.amount);
const compOutM=m=>sum(D.compPayments.filter(x=>monthOf(x.date)===m&&x.direction==='out'),x=>x.amount);
const tuitionIn=m=>sum(D.payments.filter(x=>x.month===m),x=>x.amount);
function monthMoney(m){
const ins=[['Tuition',tuitionIn(m)],['Kits & apparel',apparelCollectedIn(m)],['Competitions',compInM(m)]];
const ex=expIn(m);const known=new Set(EXP_CATS);
const outs=EXP_CATS.map(c=>[c,sum(ex.filter(x=>x.category===c||(c==='Other'&&!known.has(x.category))),x=>x.amount)]);
outs.push(['Competitions',compOutM(m)]);
const tin=sum(ins,x=>x[1]),tout=sum(outs,x=>x[1]);
return {ins,outs,tin,tout,profit:tin-tout};
}
/* A coach's whole month: every session they're down for (training schedule + matches they're assigned to),
plus any session they covered. Each one is given (confirmed), waiting for confirmation, still to come, or missed. */
function coachPlan(cid){
const m=S.month,t=today(),seen=new Set(),rows=[];
for(let i=1;i<=daysInMonth(m);i++){const ds=m+'-'+pad(i);
sessionsForDate(ds).forEach(s=>{if(seen.has(s.id))return;const mine=(s.coachIds||[]).includes(cid),on=coachOn(sessDoc(s.id),cid);if(!mine&&!on)return;seen.add(s.id);
rows.push({s,ds,match:s.kind==='match',planned:mine,st:on?coachStatus(s.id,cid):ds<t?'missed':'upcoming'})})}
const n=k=>rows.filter(r=>r.st===k).length;
return {rows,planned:rows.filter(r=>r.planned).length,given:n('confirmed'),waiting:n('pending'),rejected:n('rejected'),missed:n('missed'),upcoming:n('upcoming'),upMatches:rows.filter(r=>r.match&&r.st==='upcoming').length,matches:rows.filter(r=>r.match).length};
}
function coachPayRows(m){
return D.coaches.map(c=>{const r=coachRate(c.id);const cm=coachMonth(c.id);const pl=coachPlan(c.id);const rate=r?num(r.rate):0;const monthly=!!r&&r.type==='monthly';
const due=!r?0:monthly?rate:cm.ok*rate;
const expected=!r?0:monthly?rate:(pl.given+pl.waiting+pl.upcoming)*rate;
const paid=sum(D.expenses.filter(x=>x.month===m&&x.category==='Coach pay'&&x.coachId===c.id),x=>x.amount);
return {c,r,rate,monthly,pl,sessions:cm.ok,pending:cm.pending,due,expected,waitingPay:monthly?0:pl.waiting*rate,toCome:monthly?0:pl.upcoming*rate,paid,bal:Math.max(0,due-paid)}}).sort(by(x=>x.c.name));
}
const coachPayDue=m=>sum(coachPayRows(m),x=>x.bal);
function missingRecurring(m){
const prev=addMonths(m,-1);const cur=expIn(m);
return D.expenses.filter(x=>x.month===prev&&x.recurring&&!cur.some(y=>y.category===x.category&&(y.label||'')===(x.label||'')&&(y.coachId||'')===(x.coachId||'')));
}

const tot=k=>sum(rows,r=>r[k]);

function yearChart(rows){
const W=720,H=250,L=58,R=8,T=14,B=34,pw=W-L-R,ph=H-T-B;
const max=Math.max(1,...rows.map(r=>Math.max(r.tin,r.tout)));
const niceStep=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p};
const step=niceStep(max/4),top=Math.ceil(max/step)*step;
const y=v=>T+ph-(v/top)*ph;const gw=pw/rows.length,bw=Math.min(16,gw/2-4);
const bar=(x,v,cls)=>{if(v<=0)return '';const h=Math.max(2,ph*v/top),yy=T+ph-h,r=Math.min(4,h/2,bw/2);return `<path class="${cls}" d="M${x},${T+ph} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${T+ph} Z"/>`};
let grid='';for(let v=0;v<=top+1e-9;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'yc-base':'yc-grid'}"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" class="yc-lbl">${esc(fmtK(v))}</text>`}
let bars='',labels='',hits='';
rows.forEach((r,i)=>{const gx=L+i*gw,cx=gx+gw/2;
hits+=`<rect class="yc-hit" data-yc="${i}" x="${gx}" y="${T}" width="${gw}" height="${ph+B-4}"/>`;
bars+=bar(cx-bw-1,r.tin,'yc-in')+bar(cx+1,r.tout,'yc-out');
const d=parseD(r.m+'-01');const mo=d.toLocaleDateString('en-GB',{month:'short'});
labels+=`<text x="${cx}" y="${T+ph+16}" text-anchor="middle" class="yc-lbl">${esc(mo)}</text>${i===0||d.getMonth()===0?`<text x="${cx}" y="${T+ph+28}" text-anchor="middle" class="yc-lbl yc-yr">${d.getFullYear()}</text>`:''}`});
return `<div class="yc-legend" aria-hidden="true"><span><i class="yc-sw yc-in"></i>Money in</span><span><i class="yc-sw yc-out"></i>Money out</span></div>
<div class="yc-wrap"><svg viewBox="0 0 ${W} ${H}" class="yc" role="img" aria-label="Money in and money out for each of the last 12 months. The table below lists the same figures.">${grid}${hits}${bars}${labels}</svg><div class="yc-tip" hidden></div></div>`;
}

function ensureReportSubs(date){
if(S._repKey===date&&Subs.m.has('repPayments')&&Subs.m.has('repExpenses'))return;
Subs.off('repPayments');Subs.off('repExpenses');D.repPayments=[];D.repExpenses=[];LOADED.delete('repPayments');LOADED.delete('repExpenses');
S._repKey=date;
subCol('repPayments','payments',{where:[['date','==',date]]});
subCol('repExpenses','expenses',{where:[['date','==',date]]});
}
function dayData(date){
const ins=[],outs=[];
D.repPayments.filter(x=>x.date===date).forEach(x=>{const p=byId(D.players,x.playerId);ins.push({cat:'Tuition',who:playerName(x.playerId),what:`${fmtMonth(x.month)} fee${p?' · '+p.group:''}`,note:x.note||'',method:x.method||'Cash',by:x.by,at:x.at,amount:num(x.amount),act:'editPay',id:x.id})});
D.apparelOrders.forEach(o=>(o.payments||[]).forEach(pp=>{if(pp.date===date)ins.push({cat:'Kits & apparel',who:buyerName(o),what:`${itemName(o.itemId)}${o.size?' · '+o.size:''} × ${num(o.qty)}`,note:'',method:pp.method||'Cash',by:o.by,at:pp.at||o.at,amount:num(pp.amount)})}));
D.compPayments.filter(x=>x.date===date).forEach(x=>{const c=byId(D.competitions,x.competitionId);const row={cat:'Competitions',who:x.playerId?playerName(x.playerId):'',what:`${x.label||''}${c?' · '+c.name:''}${c&&x.teamId?' · '+teamLabel(compTeams(c).find(t=>t.id===x.teamId)):''}`,note:'',method:x.method||'Cash',by:x.by,at:x.at,amount:num(x.amount)};(x.direction==='out'?outs:ins).push(row)});
D.repExpenses.filter(x=>x.date===date).forEach(x=>outs.push({cat:EXP_CATS.includes(x.category)?x.category:'Other',who:x.coachId?coachName(x.coachId):'',what:x.label||x.category,note:x.note||'',method:x.method||'Cash',by:x.by,at:x.at,amount:num(x.amount),act:'editExpense',id:x.id}));
const group=(rows,order)=>order.map(c=>{const rs=rows.filter(r=>r.cat===c).sort(by(r=>r.at||0));return {cat:c,rows:rs,total:sum(rs,r=>r.amount)}}).filter(g=>g.rows.length);
const all=[...ins,...outs];const mo=mm=>{const i=METHODS.indexOf(mm);return i<0?99:i};
const byMethod=[...new Set(all.map(r=>r.method))].sort((a,b)=>mo(a)-mo(b)).map(mm=>({method:mm,in:sum(ins.filter(r=>r.method===mm),r=>r.amount),out:sum(outs.filter(r=>r.method===mm),r=>r.amount)}));
const tin=sum(ins,r=>r.amount),tout=sum(outs,r=>r.amount);
const sessions=D.sessions.filter(s=>s.kind!=='match'&&s.date===date&&isHeld(s)).sort(by(s=>s.start||''));
const matches=D.matches.filter(mt=>mt.date===date).sort(by(mt=>mt.time||''));
return {date,ins,outs,inG:group(ins,['Tuition','Kits & apparel','Competitions']),outG:group(outs,[...EXP_CATS,'Competitions']),byMethod,tin,tout,net:tin-tout,sessions,matches};
}

const fullDate=d=>parseD(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

const inBlock=R.inG.length?R.inG.map(repGroup).join('')+`<div class="li"><div class="grow"><b>Total in</b></div><b class="tnum" style="font:600 22px var(--f-display)">${money(R.tin)}</b></div>`:`<div class="empty" style="padding:22px"><p>No money in on this date.</p></div>`;
const outBlock=R.outG.length?R.outG.map(repGroup).join('')+`<div class="li"><div class="grow"><b>Total out</b></div><b class="tnum" style="font:600 22px var(--f-display)">${money(R.tout)}</b></div>`:`<div class="empty" style="padding:22px"><p>No money out on this date.</p></div>`;
const act=(R.sessions.length||R.matches.length)?`<div class="list">${R.sessions.map(s=>{const g=playersInGroup(s.group);const pres=g.filter(p=>['P','L'].includes((s.players||{})[p.id])).length;const co=Object.keys(s.coaches||{}).filter(k=>s.coaches[k]).map(coachName);return `<div class="li"><span class="mono small nowrap" style="width:96px">${esc(s.start||'')}–${esc(s.end||'')}</span><div class="grow"><div class="t">Training · ${esc(s.group)}</div><div class="s">${pres} of ${g.length} players present · ${co.length?'Coaches: '+co.map(esc).join(', '):'No coach checked in'}</div></div></div>`}).join('')}${R.matches.map(mt=>{const c=byId(D.competitions,mt.competitionId);const sc=mt.status==='ft'||mt.status==='live'?` · ${num(mt.ourScore)}–${num(mt.theirScore)}`:'';return `<div class="li"><span class="mono small nowrap" style="width:96px">${esc(mt.time||'')}</span><div class="grow"><div class="t">Match · ${esc(cfg().short)} vs ${esc(mt.opponent)}${sc}</div><div class="s">${esc(c?c.name:'')}${mt.round?' · '+esc(mt.round):''} · ${esc(matchGroup(mt))}</div></div></div>`}).join('')}</div>`:`<div class="empty" style="padding:22px"><p>No training sessions or matches recorded on this date.</p></div>`;
return tools+`<section class="report">
<div class="rep-head"><div><div class="eyebrow">${esc(cfg().name)} · Daily report</div><h2 class="rep-date">${esc(fullDate(date))}</h2></div><div class="muted small rep-gen">${ready?`Prepared ${esc(fmtDateY(today()))} ${esc(fmtTime(Date.now()))}`:'Loading…'}</div></div>
<div class="kpis k3">${kpi('Cash in',money(R.tin),`${R.ins.length} payment${R.ins.length===1?'':'s'}`)}${kpi('Cash out',money(R.tout),`${R.outs.length} payment${R.outs.length===1?'':'s'}`)}${kpi('Net for the day',`<span style="color:${R.net<0?'var(--bad)':'inherit'}">${money(R.net)}</span>`,'Cash in − cash out')}</div>
<div class="grid g2">${panel({title:'Money in',count:R.ins.length||null,body:inBlock})}${panel({title:'Money out',count:R.outs.length||null,body:outBlock})}</div>
${R.byMethod.length?panel({title:'By payment method',body:`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Method</th><th class="r">In</th><th class="r">Out</th><th class="r">Net</th></tr></thead><tbody>${R.byMethod.map(x=>`<tr><td class="strong">${esc(x.method)}</td><td class="r">${money(x.in)}</td><td class="r">${money(x.out)}</td><td class="r strong" style="color:${x.in-x.out<0?'var(--bad)':'var(--fg)'}">${money(x.in-x.out)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="r">${money(R.tin)}</td><td class="r">${money(R.tout)}</td><td class="r">${money(R.net)}</td></tr></tfoot></table></div>`,foot:'Use the Cash row to check the cash box at the end of the day.'}):''}
${panel({title:'Activity',body:act})}
<p class="muted small no-print" style="margin:0">Counts every payment by its “paid on” date. Tap a tuition payment or an expense to correct it.</p>
</section>`;
}
function reportText(R){
const L=[`*${cfg().short} · Daily report*`,fullDate(R.date),''];
L.push(`*Cash in: ${money(R.tin)}*`);R.inG.forEach(g=>L.push(`• ${g.cat}: ${money(g.total)} (${g.rows.length})`));if(!R.inG.length)L.push('• Nothing');
L.push('',`*Cash out: ${money(R.tout)}*`);R.outG.forEach(g=>L.push(`• ${g.cat}: ${money(g.total)} (${g.rows.length})`));if(!R.outG.length)L.push('• Nothing');
L.push('',`*Net: ${money(R.net)}*`);
if(R.byMethod.length)L.push('','By method:',...R.byMethod.map(x=>`• ${x.method}: in ${money(x.in)} · out ${money(x.out)}`));
if(R.sessions.length)L.push('',`Training sessions: ${R.sessions.length}`);

}

if(!doc||doc.invoiceNo||INV_DONE.has(path)||INV_ASSIGNING.has(path)||!LOADED.has('finance'))return;

try{
const n=Math.max(1,INV_NEXT,num((D.finance||{}).nextInvoice)||1);INV_NEXT=n+1;const date=today();const no=invFormat(n,date);

function invoiceData(kind,id){
const c=cfg();
if(kind==='pay'){
const all=allPays();const x=all.find(p=>p.id===id);if(!x)return null;
const p=byId(D.players,x.playerId)||{name:playerName(x.playerId)};
const fee=p.id?feeOf(p):0;
const same=all.filter(y=>y.playerId===x.playerId&&y.month===x.month).sort(by(y=>(y.date||'')+String(y.at||'').padStart(15,'0')));
const upTo=same.slice(0,Math.max(1,same.findIndex(y=>y.id===x.id)+1));
const paid=sum(upTo,y=>y.amount);const total=Math.max(fee>0?fee:0,paid);
const dn=INV_DONE.get('payments/'+id)||{};
return {kind,id,no:x.invoiceNo||dn.no||null,issued:x.invoiceDate||dn.date||x.date||today(),
billName:`Parent of ${p.name}`,billLines:[p.group?`Group ${p.group}`:'',p.parentPhone||''].filter(Boolean),phone:p.parentPhone||'',child:p.name,
lines:[{desc:`Monthly training fee · ${fmtMonth(x.month)}`,sub:`${p.name}${p.group?' · '+p.group:''}${fee<=0?' · scholarship':''}`,qty:1,unit:total,amount:total}],
payments:upTo.map(y=>({date:y.date,method:y.method||'Cash',amount:num(y.amount)})),total,paid,balance:Math.max(0,total-paid),note:x.note||'',
title:`${c.short} invoice · ${p.name} · ${fmtMonth(x.month)}`};
}
if(kind==='comp'){
const x=byId(D.compPayments,id);if(!x)return null;
const comp=byId(D.competitions,x.competitionId)||{name:'Competition'};const t=compTeams(comp).find(tt=>tt.id===x.teamId)||null;
const p=x.playerId?(byId(D.players,x.playerId)||{name:playerName(x.playerId)}):null;
const fee=t&&p?num(t.fee):0;
const same=p?D.compPayments.filter(y=>y.competitionId===x.competitionId&&y.direction!=='out'&&y.playerId===x.playerId&&(y.teamId||'')===(x.teamId||'')).sort(by(y=>(y.date||'')+String(y.at||'').padStart(15,'0'))):[x];
const upTo=same.slice(0,Math.max(1,same.findIndex(y=>y.id===x.id)+1));
const paid=sum(upTo,y=>y.amount);const total=Math.max(fee>0?fee:0,paid);
const dn=INV_DONE.get('compPayments/'+id)||{};
return {kind,id,no:x.invoiceNo||dn.no||null,issued:x.invoiceDate||dn.date||x.date||today(),
billName:p?`Parent of ${p.name}`:(x.label||'Customer'),billLines:p?[t?teamLabel(t):p.group?`Group ${p.group}`:'',p.parentPhone||''].filter(Boolean):[],phone:p?p.parentPhone||'':'',child:p?p.name:'',
lines:[{desc:`${comp.name}${t?' · '+teamLabel(t):''}`,sub:[x.label||'Competition contribution',p?p.name:''].filter(Boolean).join(' · '),qty:1,unit:total,amount:total}],
payments:upTo.map(y=>({date:y.date,method:y.method||'Cash',amount:num(y.amount)})),total,paid,balance:Math.max(0,total-paid),note:x.note||'',
title:`${c.short} invoice · ${p?p.name:(x.label||'')} · ${comp.name}`};
}
const o=byId(D.apparelOrders,id);if(!o)return null;
const it=byId(D.apparelItems,o.itemId)||{name:'Item'};const p=o.playerId?byId(D.players,o.playerId):null;
const total=orderTotal(o),paid=orderPaid(o);
const dn=INV_DONE.get('apparelOrders/'+id)||{};
return {kind,id,no:o.invoiceNo||dn.no||null,issued:o.invoiceDate||dn.date||o.date||today(),
billName:p?`Parent of ${p.name}`:(o.buyer||'Customer'),billLines:p?[p.group?`Group ${p.group}`:'',p.parentPhone||''].filter(Boolean):[],phone:p?p.parentPhone||'':'',child:p?p.name:'',
lines:[{desc:it.name,sub:[it.category,o.size?`Size ${o.size}`:'',o.kitNumber!=null&&o.kitNumber!==''?`No. ${o.kitNumber}`:'',o.kitName?`Name ${o.kitName}`:''].filter(Boolean).join(' · '),qty:num(o.qty),unit:num(o.unitPrice),amount:total}],
payments:(o.payments||[]).map(y=>({date:y.date,method:y.method||'Cash',amount:num(y.amount)})),total,paid,balance:Math.max(0,total-paid),note:'',
title:`${c.short} invoice · ${p?p.name:(o.buyer||'')} · ${it.name}`};
}
const invStatus=I=>I.balance<=0&&I.total>0?'PAID':I.paid>0?'PART PAID':'UNPAID';

function canvasToPdf(cv,title){
const dataUrl=cv.toDataURL('image/jpeg',0.92);const bin=atob(dataUrl.split(',')[1]);const img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
const enc=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
const parts=[];let len=0;const offs=[];const push=u=>{if(typeof u==='string')u=enc(u);parts.push(u);len+=u.length};
const W=595.28,H=841.89;const safe=String(title||'Invoice').replace(/·/g,'-').replace(/[^\x20-\x7E]/g,'').replace(/[()\\]/g,'');
push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push('\nendobj\n')};
obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
obj(2,()=>push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
obj(3,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
obj(4,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);push(img);push('\nendstream')});
const content=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
obj(5,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
obj(6,()=>push(`<< /Title (${safe}) /Producer (Atelier XI app) >>`));
const xref=len;push(`xref\n0 7\n0000000000 65535 f \n`);for(let n=1;n<=6;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
push(`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
return new Blob(parts,{type:'application/pdf'});
}

function waNumber(ph){let d=String(ph).replace(/\D/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='961'+d.slice(1);else if(d.length<=8)d='961'+d;return d}

function waOpen(url){let w=null;if(!isPhoneDevice()){try{w=window.open(url,'axi_whatsapp')}catch(e){}}if(!w){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}}

waOpen(waChatUrl(wa,cap));

}

c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,method,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
c.setUint32(16,crc,true);c.setUint32(20,body.length,true);c.setUint32(24,raw.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);

/* exact copy of every record, split into cells of 30,000 characters */
function bkRestoreSheet(A,meta){
const CH=30000,rows=[];let maxParts=1;
const add=(c,d)=>{const {id,...rest}=d;const s=JSON.stringify(rest);const parts=[];for(let i=0;i<s.length;i+=CH)parts.push(s.slice(i,i+CH));if(!parts.length)parts.push('{}');maxParts=Math.max(maxParts,parts.length);rows.push([c,String(id),...parts])};
add('_backup',{id:'info',...meta});
BK_COLS.forEach(c=>(A[c]||[]).forEach(d=>add(c,d)));
A.config.forEach(d=>add('config',d));
const head=['Collection','Record ID',...Array.from({length:maxParts},(_,i)=>i?'Data '+(i+1):'Data')];
return {name:'Restore data',rows:[head.map(h=>({v:h,s:XST.head})),...rows],widths:[22,26,...head.slice(2).map(()=>80)],freeze:true,filter:null};
}

function bkSummarySheet(T,meta,failed){
const rows=[[{v:`${cfg().name} — full backup`,s:XST.title}],
[{v:`Downloaded ${fmtDateY(meta.date)} at ${fmtTime(meta.at)} by ${meta.byName}`,s:XST.muted}],[],
[{v:'Sheet',s:XST.head},{v:'Records',s:XST.head},{v:'What’s in it',s:XST.head}],
...T.map(t=>[{v:t.name,s:XST.bold},t.count,t.about]),
[{v:'Restore data',s:XST.bold},meta.records,'An exact copy of every record. Leave this sheet unchanged so the app can be rebuilt from this file if ever needed.'],[]];
if(failed.length)rows.push([{v:'Not included',s:XST.bold},'',`These couldn’t be read when the backup was made: ${failed.join(', ')}. Try the download again.`]);
rows.push([{v:'Keep one copy each month somewhere safe, like your email or Google Drive. Each file holds everything, not just that month.',s:XST.muted}]);
return {name:'Summary',rows,widths:[24,10,96],freeze:false,filter:null};
}

ATELIER XI — Kit orders PDF export (multi-page, landscape A4)
============================================================ */
function pagesToPdf(cvs,title){
const enc=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
const jpg=cv=>{const b=atob(cv.toDataURL('image/jpeg',0.9).split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const parts=[],offs=[];let len=0;const push=u=>{if(typeof u==='string')u=enc(u);parts.push(u);len+=u.length};
const safe=String(title||'Document').replace(/·/g,'-').replace(/[^\x20-\x7E]/g,'').replace(/[()\\]/g,'');
const n=cvs.length,info=3+n*3;
push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
const obj=(k,body)=>{offs[k]=len;push(`${k} 0 obj\n`);body();push('\nendobj\n')};
obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
obj(2,()=>push(`<< /Type /Pages /Kids [${cvs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${n} >>`));
cvs.forEach((cv,i)=>{
const p=3+i*3,land=cv.width>cv.height,W=land?841.89:595.28,H=land?595.28:841.89,img=jpg(cv),content=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${p+1} 0 R >> >> /Contents ${p+2} 0 R >>`));
obj(p+1,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);push(img);push('\nendstream')});
obj(p+2,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
});
obj(info,()=>push(`<< /Title (${safe}) /Producer (Atelier XI app) >>`));
const xref=len;push(`xref\n0 ${info+1}\n0000000000 65535 f \n`);for(let k=1;k<=info;k++)push(String(offs[k]).padStart(10,'0')+' 00000 n \n');
push(`trailer\n<< /Size ${info+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
return new Blob(parts,{type:'application/pdf'});
}

{h:'DATE',w:104,v:o=>fmtDate(o.date)},
{h:'PLAYER / BUYER',w:250,v:o=>buyerName(o),b:true},
{h:'GROUP',w:74,v:o=>{const p=o.playerId?byId(D.players,o.playerId):null;return p?p.group||'':''}},
{h:'ITEM',w:222,v:o=>itemName(o.itemId)},
{h:'SIZE',w:92,v:o=>o.size||'',a:'center'},
{h:'NO.',w:58,v:o=>o.kitNumber!=null?String(o.kitNumber):'',a:'center',b:true},
{h:'NAME ON KIT',w:170,v:o=>o.kitName||'',b:true},
{h:'QTY',w:50,v:o=>num(o.qty),a:'right'},
{h:'TOTAL',w:104,v:o=>money(orderTotal(o)),a:'right'},
{h:'PAID',w:104,v:o=>money(orderPaid(o)),a:'right'},
{h:'OWES',w:104,v:o=>{const x=Math.max(0,orderTotal(o)-orderPaid(o));return x?money(x):'—'},a:'right',tone:o=>orderTotal(o)-orderPaid(o)>0?BADC:null},
{h:'STATUS',w:134,pad:22,v:o=>{const s=orderStatus(o);return s==='paid'?'Paid':s==='partial'?'Part paid':'Requested'},tone:o=>{const s=orderStatus(o);return s==='paid'?OKC:s==='partial'?WARNC:BADC},b:true},
{h:'HANDED OVER',w:114,pad:8,v:o=>o.delivered?'Yes':'No'},
];
const extra=(R-M-sum(cols,cl=>cl.w))/cols.length;let cx0=M;cols.forEach(cl=>{cl.w+=extra;cl.x=cx0;cx0+=cl.w});

const pages=[];let i=0;
pages.push(rows.slice(0,per1));i=per1;while(i<rows.length){pages.push(rows.slice(i,i+perN));i+=perN}
const lastRoom=(pages.length===1?per1:perN)-pages[pages.length-1].length;if(lastRoom<1)pages.push([]);
const n=pages.length;const cvs=[];
pages.forEach((pr,pi)=>{
const cv=document.createElement('canvas');cv.width=KP_W;cv.height=KP_H;const g=cv.getContext('2d');
const text=(s,x,y,font,color,align='left',ls=0)=>{g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';if('letterSpacing' in g)g.letterSpacing=ls+'px';g.fillText(String(s),x,y);if('letterSpacing' in g)g.letterSpacing='0px'};
const fit=(s,font,max)=>{g.font=font;s=String(s);if(g.measureText(s).width<=max)return s;while(s.length>1&&g.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'};
const line=(x1,y1,x2,y2,color=LINE,w=1.5)=>{g.strokeStyle=color;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};

text(String(c.slogan||'').toUpperCase(),hx,y+82,`500 15px ${F.m}`,MUTED,'left',3);
text('KIT ORDERS',R,y+58,`600 72px ${F.d}`,NAVY,'right',4);

const sw=(R-M)/st.length;st.forEach(([k,v],j)=>{const sx=M+j*sw;text(k,sx,y+40,`500 14px ${F.m}`,MUTED,'left',2);text(v,sx,y+82,`600 34px ${F.b}`,k==='STILL OWED'&&meta.owed>0?BADC:INK)});

cols.forEach(cl=>{const v=cl.v(o);if(v===''||v==null)return;const font=`${cl.b?600:500} 19px ${F.b}`;const ax=cl.a==='right'?cl.x+cl.w-12:cl.a==='center'?cl.x+cl.w/2:cl.x+(cl.pad||0);text(fit(v,font,cl.w-14-(cl.pad||0)),ax,by,font,(cl.tone&&cl.tone(o))||INK,cl.a||'left')});

text('Total',cx('PLAYER / BUYER').x,by,`600 20px ${F.b}`,NAVY);
[['QTY',String(meta.units)],['TOTAL',money(meta.total)],['PAID',money(meta.paid)],['OWES',meta.owed?money(meta.owed):'—']].forEach(([k,v])=>{const cl=cx(k);text(v,cl.x+cl.w-12,by,`600 20px ${F.b}`,k==='OWES'&&meta.owed>0?BADC:NAVY,'right')});

line(M,FOOT,R,FOOT,NAVY,2);
text(`${String(c.short||'').toUpperCase()} · ${String(c.slogan||'').toUpperCase()}`,M,FOOT+36,`500 14px ${F.m}`,MUTED,'left',3);

function kitPdfMeta(rows){
const f=S.ui.apf||'all',q=(S.ui.apq||'').trim();
const fl={all:'All orders',requested:'Requested, not paid',partial:'Partly paid',paid:'Paid',undelivered:'Not handed over yet'}[f]||'All orders';
const one=kitOneBuyer(rows);let who='';
if(one){const p=one.playerId?byId(D.players,one.playerId):null;who=[buyerName(one),p&&p.group,p&&p.parentName?'Parent: '+p.parentName:'',p&&p.parentPhone].filter(Boolean).join('  ·  ')}
const total=sum(rows,orderTotal),paid=sum(rows,orderPaid);
return {sub:[fl,q?`Search “${q}”`:'',`${fmtDateY(today())}`].filter(Boolean).join('  ·  '),who,orders:rows.length,units:sum(rows,o=>num(o.qty)),total,paid,owed:sum(rows,o=>Math.max(0,orderTotal(o)-orderPaid(o))),one};
}
ACT.kitPdf=async()=>{
const rows=kitRows();if(!rows.length)return toast('No orders to export.',true);
if(!PLATFORM.canDownload())return toast('Downloads aren’t available here.',true);
try{
const meta=kitPdfMeta(rows);const cvs=await drawKitPages(rows,meta);
const nm=meta.one?buyerName(meta.one):'';const file=`Kit-orders${nm?'-'+nm:''}-${today()}.pdf`.replace(/[^\w.-]+/g,'-');
await PLATFORM.download(file,pagesToPdf(cvs,`${cfg().short} kit orders${nm?' - '+nm:''}`));toast('PDF saved');
}catch(e){console.warn(e);if(!(e&&e.code==='declined'))toast('Couldn’t create the PDF.',true)}
};

function drPt(e){const svg=$('#drSvg');const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}}

try{svg.setPointerCapture(e.pointerId)}catch(_){}

DR.drag={mode:'move',p0:p,snap,orig:clone(o),moved:false,was};if(was!==DR.sel)drPaint();return}

const [t,c]=tool.split('|');

function drMove(e){

}
function drUp(){

}

ATELIER XI — Session plans

const spPre=o=>o.replace(/\s*…$/,'');
function spPresetOn(k,v,o){const P=SP_PRESETS[k];v=String(v||'').trim();if(!P)return false;if(P.multi)return v.split(/\s*,\s*/).includes(o);if(o.endsWith('…'))return v.toLowerCase().startsWith(spPre(o).toLowerCase());return v===o}

ACT.spPreset=d=>{const k=d.k,o=d.v,P=SP_PRESETS[k];if(!P||!SP.p)return;const inp=$('#spH_'+k);let v=String(SP.p[k]||'');
if(P.multi){let t=v.split(/\s*,\s*/).filter(Boolean);t=t.includes(o)?t.filter(x=>x!==o):[...t,o];v=t.join(', ')}
else if(o.endsWith('…')){const pre=spPre(o);if(!v.toLowerCase().startsWith(pre.toLowerCase()))v=pre+' '}
else v=v===o?'':o;
SP.p[k]=v;if(inp){inp.value=v;if(o.endsWith('…')){inp.focus();try{inp.setSelectionRange(v.length,v.length)}catch(e){}}}
spPresetSync(k);spSaveBtn()};

function spEmpty(s){
const old=(s.drills||[]).filter(id=>byId(D.drills,id));const blocks={};
SP_BLOCKS.forEach(([k],i)=>{blocks[k]={min:'',drillId:old[i]||'',notes:''}});
return {photoId:null,photoThumb:null,coachId:(s.coachIds||[])[0]||myCoachId()||'',intention:'',function:'',task:'',overload:'',blocks,reflection:{org:0,time:0,behaviour:0,interventions:0,comments:''}};
}
function spFrom(s){
const e=spEmpty(s),p=s.plan;if(!p)return e;
return {...e,...clone(p),blocks:Object.fromEntries(SP_BLOCKS.map(([k])=>[k,{...e.blocks[k],...((p.blocks||{})[k]||{})}])),reflection:{...e.reflection,...(p.reflection||{})}};
}
const spTotal=p=>sum(SP_BLOCKS,([k])=>num(((p.blocks||{})[k]||{}).min));
const spAvg=r=>{const v=SP_REFLECT.map(([k])=>num(r&&r[k])).filter(x=>x>0);return v.length?Math.round(sum(v)/v.length*10)/10:null};
const spDirty=()=>JSON.stringify(SP.p)!==SP.orig;
const spWhen=s=>`${fmtDayLong(s.date)}${s.start?` · ${s.start}–${s.end||''}`:''}`;

/* ---------- builder overlay ---------- */
function spRender(){
